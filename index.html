<script>
'use strict';
const QUESTIONS=[{"id": "初級-001", "level": "初級", "question": "下列哪種設計更容易使炎熱的臺灣溫度升高？", "options": ["加裝遮陽板", "在屋頂加裝通風塔", "室外有走廊設計", "加裝玻璃帷幕"], "answer": 3, "explanation": "加裝遮陽板、在屋頂加裝通風塔及室外有走廊設計都是讓室內較為通風、散熱的設計。", "row": 2}, {"id": "初級-002", "level": "初級", "question": "《京都協議書》主要共識是什麼？", "options": ["全面管制塑化劑的使用", "全面管制多氯聯苯", "環境荷爾蒙物質的管制", "管制二氧化碳的排放"], "answer": 3, "explanation": "《京都協議書》主要共識是管制二氧化碳的排放。", "row": 3}, {"id": "初級-003", "level": "初級", "question": "「可回收、低污染、省資源」的產品符合下列哪項標章概念？", "options": ["節能標章", "回收標章", "環保標章", "以上皆是"], "answer": 2, "explanation": "行政院環保署設計的「環保標章」，象徵「可回收、低污染、省資源」的綠色消費觀念，有助於國人養成「資源節約」的概念；在生活中，我們應該儘量選用貼有環保標章的商品。", "row": 4}, {"id": "初級-004", "level": "初級", "question": "「綠色生活」的『綠色』概念可以下列何者為之？", "options": ["省能源", "低污染", "低毒性", "以上皆是"], "answer": 3, "explanation": "『綠色生活』，內容很多是透過消費的方式來進行，而什麼是『綠色』？舉凡對環境友善(如：省能源、省資源、低污染、低毒性)的事項，均可稱為『綠色』。", "row": 5}, {"id": "初級-005", "level": "初級", "question": "「臺灣碳標籤」係由下列哪一種圖案搭配「CO2」化學符號及數字所組成？", "options": ["由紅色心形及綠葉組成腳印", "由紅色心形及紅花組成腳印", "由綠色心形及綠葉組成腳印", "由綠色心形及紅葉組成腳印"], "answer": 2, "explanation": "「臺灣碳標籤」由綠色心形和綠葉組成腳印，並搭配「CO2」化學符號及愛心中的數字揭露產品「碳足跡」，整體圖示意涵用愛大自然的心，減碳愛地球及落實綠色消費，以邁向低碳社會。", "row": 6}, {"id": "初級-006", "level": "初級", "question": "一名綠色消費者在購買商品時，下列哪個選項最正確？", "options": ["優先選購包裝精美的商品", "優先選購對環境傷害較少的產品", "接受店員提供的免費塑膠袋", "單次使用、用過即丟的商品較衛生"], "answer": 1, "explanation": "日常生活中做到只購買必須的用品而不任意浪費、做好垃圾減量、節省水電等資源、儘量搭乘大眾運輸工具、買東西自備購物袋等都是符合綠色消費的作法。", "row": 7}, {"id": "初級-007", "level": "初級", "question": "一般而言，水中「飽和溶氧」值隨水溫之上升而呈下列何種趨勢？", "options": ["減少", "增加", "不變", "波動"], "answer": 0, "explanation": "一般而言，水中「飽和溶氧」值隨水溫之上升而下降。", "row": 8}, {"id": "初級-008", "level": "初級", "question": "人類進入到下列哪一個時代，溫室效應才開始越來越嚴重？", "options": ["石器時代", "漁業時代", "工業時代", "農業時代"], "answer": 2, "explanation": "溫室效應主要是大量使用石化產品所影響，包含1.工業—燃燒石化燃料2.農牧業—動物排泄物3.交通運輸—使用汽柴油等石化燃料4.建築物—辦公室學校住宅用電用水用氣5.能源部門—燃燒石化燃料發電", "row": 9}, {"id": "初級-009", "level": "初級", "question": "人類對於核能的應用，應該要有什麼樣的態度？", "options": ["不斷興建核能發電廠", "致力研發核子武器", "適度地使用核能，注意核能可能帶來災害", "在深海處大量試爆核子武器"], "answer": 2, "explanation": "不斷興建核能發電廠的觀念是錯誤的。另外使用核能製造核子武器，可能造成巨大的災難。", "row": 10}, {"id": "初級-010", "level": "初級", "question": "下列有關能源敘述何者正確？", "options": ["化石燃料為可再生能源", "核燃料為不可再生能源", "太陽能為不可再生能源", "地熱為不可再生能源"], "answer": 1, "explanation": "核燃料為不可再生能源。", "row": 11}, {"id": "初級-011", "level": "初級", "question": "下列何者「不是」水力發電的優點？", "options": ["不會造成空氣污染", "運維成本低", "不會有生態衍生問題", "可以重複使用"], "answer": 2, "explanation": "使用水力發電的優點：可以重複使用、單位成本低、水能轉換成電能的效率是百分之九十、不會造成空氣污染、可以用來生產氫氣。使用水力發電的缺點：建築費用相當高、在河川土築水壩，會破壞河川的生態、很難找到適合築水壩的地點。", "row": 12}, {"id": "初級-012", "level": "初級", "question": "下列何者為國際間對於溫室效應主要管制的氣體？", "options": ["一氧化碳", "氨氣", "一氧化氮", "甲烷"], "answer": 3, "explanation": "會吸收地球長波輻射的氣體稱為溫室氣體，包含甲烷、氧化亞氮、二氧化碳、六氟化硫、全氟碳化物和氫氟碳化物等。", "row": 13}, {"id": "初級-013", "level": "初級", "question": "下列何者「不是」減碳診所提供的診斷服務？", "options": ["電力", "省水", "消防", "資源回收"], "answer": 2, "explanation": "電力、空調、省水、資源回收、綠建築可以提供節能診斷、改善方案評估等，整合性技術服務，而消防是消防署的管理範圍", "row": 14}, {"id": "初級-014", "level": "初級", "question": "下列何者「不是」節水小偏方？", "options": ["加裝流量蓮篷頭", "隨手關緊水龍頭", "定期檢查馬桶、水塔等", "直接用水龍頭沖洗衣物"], "answer": 3, "explanation": "加裝流量蓮篷頭、水龍頭曝氣器，減緩出水量；定期檢查馬桶、水塔、水池、水龍頭與水管，有沒有漏水的情形；不要直接用水龍頭沖洗衣物、碗盤、蔬菜，要將水適量的盛在盆裏使用，不僅可以再利用，也減少使用量。", "row": 15}, {"id": "初級-015", "level": "初級", "question": "下列何者「不是」資源回收前要作的處理？", "options": ["沖洗瓶罐", "壓扁瓶、罐、盒", "避免打破燈泡和日光燈管", "大型的廢棄傢俱與家電用品隨意丟棄路邊"], "answer": 3, "explanation": "回收前，要先將飲料的瓶瓶罐罐和免洗餐具，沖洗或擦拭乾淨，才不會產生臭味，並先將可以擠壓的瓶、罐、盒等壓扁，減小體積，增加回收的空間；玻璃類、燈泡和日光燈管，避免打破，並小心包好，再交給回收人員；丟棄大型的廢棄傢俱與家電用品前，要先和清潔隊約好收運的時間。", "row": 16}, {"id": "初級-016", "level": "初級", "question": "下列何者「不是」綠色產品？", "options": ["無磷清洗劑", "高級汽油", "再生紙", "不含氟氯碳化物之氣膠"], "answer": 1, "explanation": "綠色產品(Greenproducts)是指其在營銷過程中具有比目前類似產品更有利於環保的產品。", "row": 17}, {"id": "初級-017", "level": "初級", "question": "下列何者「不能」減輕溫室效應的？", "options": ["大量燒煤，以解决能源問題              ", "提倡使用節能技術和節能產品", "植樹造林，嚴禁亂砍濫伐森林", "提倡公共交通或步行方式出行"], "answer": 0, "explanation": "大量燒煤只會增加CO2的排放，並促使溫室效應日趨嚴重，並不能減輕溫室效應。", "row": 18}, {"id": "初級-018", "level": "初級", "question": "下列何者「不符合」綠色消費原則?", "options": ["使用可分解的環保塑膠袋", "自備餐具、環保杯、環保袋", "做好資源回收，讓資源再利用", "注意生態保護，不要污染環境造成公害"], "answer": 0, "explanation": "若要做到綠色消費，有六大原則需要遵守。這六個原則中有三個英文單字字首為「R」，三個為「E」，所以也稱為「三R、三E」六原則。減量消費(Reduce)、重複使用(Reuse)、回收再生(Recycle)、講求經濟(Economic)、符合生態(Ecological)、實踐平等(Eqaitable)。", "row": 19}, {"id": "初級-019", "level": "初級", "question": "下列何者「不會」減少溫室氣體的排放？", "options": ["减少使用煤、石油等化石燃料", "大量植樹造林，禁止亂砍亂伐", "增高燃煤氣體排放的煙囪 ", "開發太陽能、水能等新能源"], "answer": 2, "explanation": "增高煙囪並不會降低溫室氣體的排放。", "row": 20}, {"id": "初級-020", "level": "初級", "question": "下列何者「無法」達到節能減碳的目的？", "options": ["隨手關燈", "用大量的水洗澡", "出門走路、騎踏車", "多吃蔬食少吃肉"], "answer": 1, "explanation": "人人可做的環保行動：(1)隨手關燈，節約能源、(2)使用大眾運輸工具，近距離可騎腳踏車或步行、(3)飲食宜蔬食、適量與少油膩，有益健康且能減少污染。", "row": 21}, {"id": "初級-021", "level": "初級", "question": "下列何者是可以落實低碳旅遊的方式？", "options": ["用旅館的免洗牙刷用具", "請爸媽自己開車去旅遊", "搭大眾運輸工具旅遊", "舉辦營火晚會"], "answer": 2, "explanation": "低碳旅遊是指在旅遊的過程中，以溫室氣體排放量最小(尤其是二氧化碳)的方式進行遊旅，以保護地球的旅遊方式。例如搭乘公車或火車等大眾交通工具去旅行。\n", "row": 22}, {"id": "初級-022", "level": "初級", "question": "下列何者是正確的資源回收行為？", "options": ["將報紙丟入垃圾桶", "只要東西壞了就丟掉", "將可以再利用的物品進行回收", "不論可否回收，所有垃圾都投入回收桶"], "answer": 2, "explanation": "資源回收是把可以再利用的物品回收，而不能回收的就稱為垃圾。報紙屬於紙類可進行回收，所以應丟入資源回收桶。\n", "row": 23}, {"id": "初級-023", "level": "初級", "question": "下列何者是全球平均溫度上升對我們人類的影響？", "options": ["我們可以住的地方越來越多", "農田的生產量增加", "提高大規模傳染病的發生率", "我們可以使用的動植物量增加"], "answer": 2, "explanation": "全球溫度上升，會導致許多天災，例如旱災、水災和颱風等等，加上災害過後常出現環境衛生問題，會提高大規模傳染病發生的機會。", "row": 24}, {"id": "初級-024", "level": "初級", "question": "下列何者是全球溫度上升對野生動植物的影響？", "options": ["提高生產能力", "造成幼小動物生存率下降", "造成動物大量繁殖", "增加動物種類"], "answer": 1, "explanation": "全球溫度上升，會導致許多天災，例如旱災、水災和颱風等等，這些災害都會令動植物容易生病，特別是幼小動物的生存受到嚴重威脅。", "row": 25}, {"id": "初級-025", "level": "初級", "question": "下列何者是全球溫度上升對環境所造成的影響？", "options": ["陸地面積增加", "降低國民的購買能力", "海平面上升", "颱風變少"], "answer": 2, "explanation": "全球溫度上升，導致冰山融化、海平面上升、陸地面積減少、颱風頻繁等等，加上災害過後會出現環境衛生問題，很容易有大規模的傳染病。", "row": 26}, {"id": "初級-026", "level": "初級", "question": "下列何者是減碳的真正目的？", "options": ["為了提高我們生活水準", "為了減緩全球暖化", "為了增加氧氣", "為了減少電費"], "answer": 1, "explanation": "減碳是為了減少溫室效應氣體，減少溫室效應氣體是為了要減緩全球暖化以保護地球，保護地球是為了讓大家能生活在一個美麗的星球上。", "row": 27}, {"id": "初級-027", "level": "初級", "question": "下列何者最符合綠色消費的環保行為？", "options": ["選購新型電器就不需要考慮節能效力", "減少不必要的消費", "免費的塑膠袋，不需要重複使用", "買咖啡不需要自備環保杯"], "answer": 1, "explanation": "節約是最好的環保行動，生活上的消費是生存必須的，但是浪費就不應該。", "row": 28}, {"id": "初級-028", "level": "初級", "question": "下列何者會增加水資源的浪費？", "options": ["使用兩段式沖水馬桶", "隨手關緊水龍頭", "換裝節水水龍頭", "洗澡用盆浴方式"], "answer": 3, "explanation": "避免浪費水資源的方法其實很簡單，可以從日常生活的小細節開始作起，例如隨手關水龍頭、使用省水標章商品、以淋浴代替盆浴等等。", "row": 29}, {"id": "初級-029", "level": "初級", "question": "下列何者會增加最多空氣污染？", "options": ["走路上學", "騎腳踏車", "種植植物", "焚燒塑膠垃圾"], "answer": 3, "explanation": "空氣污染主要來自於工廠、汽機車、燃燒廢棄物等所產生的廢氣，對環境造成很大的影響。減少空氣污染的方式有很多，例如：多搭乘大眾交通工具，減少一人開車、騎機車的頻率；不露天焚燒物品，如落葉、垃圾、塑膠袋、紙袋等。", "row": 30}, {"id": "初級-030", "level": "初級", "question": "下列何者對全球溫度上升的影響較大？", "options": ["汽車與機車排放廢氣", "人類放屁", "種植蔬菜", "捕撈魚類"], "answer": 0, "explanation": "溫室效應主要是大量使用化石燃料、動物排泄等行為排放溫室效應氣體如二氧化碳所造成。", "row": 31}, {"id": "初級-031", "level": "初級", "question": "下列何者對減碳有幫助？", "options": ["大量種植樹木", "增加該地區之人口數", "火山噴發", "積極開發土地"], "answer": 0, "explanation": "樹木可以進行光合作用，吸收二氧化碳、放出氧氣，是減緩溫室效應及淨化空氣的大功臣。另外，樹木的葉面可以黏著懸浮微粒，所以有濾浮游塵、淨化空氣的作用", "row": 32}, {"id": "初級-032", "level": "初級", "question": "下列何者對溫室效應的描述是正確的？", "options": ["地球臭氧層破洞", "如果沒有溫室效應，地球會冷的人類無法居住", "空氣中產生很多顆粒", "雨水變酸了"], "answer": 1, "explanation": "地面將所吸收之太陽能以長波方式向天空輻射。大氣層中之水氣、雲層及微塵物，可吸收來自地球表面之長波輻射能，使地表面上之熱量不致無止境的散失，這種保溫作用稱為溫室效應。", "row": 33}, {"id": "初級-033", "level": "初級", "question": "下列何者屬於可以回收的電池？", "options": ["碳鋅電池", "鎳鎘電池", "鋰電池", "以上皆是"], "answer": 3, "explanation": "電池回收包括一次(用完即丟)及二次(可充電電池)均可以回收。一次電池碳鋅電池、鹼錳電池、氧化銀電池、氧化汞電池、鋅空氣電池二次電池鎳鎘電池、鎳氫電池、鋰電池。", "row": 34}, {"id": "初級-034", "level": "初級", "question": "下列何處適合設置沼氣發電？", "options": ["沿海地區", "公園空地", "垃圾掩埋場", "觀光地區"], "answer": 2, "explanation": "設置地點應考量環境衛生及操作安全性，例如：垃圾掩埋場、污水處理場、廢水處理場、畜牧廢水處理場等可產生沼氣以供燃燒及發電之場所，也必須考量設備重量負載設計基礎結構，與腐蝕性氣體，氣體如硫化氫或水接觸之材料為耐腐蝕之材質。", "row": 35}, {"id": "初級-035", "level": "初級", "question": "下列何項作法能降低溫室氣體的排放？", "options": ["多蓄養食草動物", "增加森林面積", "使用大自然產生的化石燃料", "增加該區人口數"], "answer": 1, "explanation": "增加溫室氣體排放、減少植物的表面覆蓋率及不使用環保筷等，都會使得溫室效應的情況越來越嚴重。目前溫室氣體中二氧化碳的比例為最高，需要減輕二氧化碳排放及增加綠樹的種植。", "row": 36}, {"id": "初級-036", "level": "初級", "question": "下列何種行為會減少熱島效應的程度？", "options": ["多開車", "興建綠建築", "多使用冷氣", "多舖設柏油路"], "answer": 1, "explanation": "都市的熱島現象原因有柏油路吸熱、建築物高聳、樹木稀少、汽機車排放廢氣等等，若要降低此現象，可興建綠建築，多種植物等。\n", "row": 37}, {"id": "初級-037", "level": "初級", "question": "下列哪一種活動「不會」產生大量懸浮微粒？", "options": ["建造房屋", "火力發電", "生產鋼鐵", "出外郊遊"], "answer": 3, "explanation": "人為產生懸浮微粒的行為包括火力發電、建造房屋、生產鋼鐵等過程中所釋放出來的灰塵。", "row": 38}, {"id": "初級-038", "level": "初級", "question": "下列哪一種發電方式「最不」環保？", "options": ["火力發電", "風力發電", "太陽能發電", "水力發電"], "answer": 0, "explanation": "火力發電鍋爐燃燒過程中會造成空氣污染，並產生大量二氧化碳造成溫室效應。", "row": 39}, {"id": "初級-039", "level": "初級", "question": "下列哪些產品需要張貼強制性能源效率標示？", "options": ["電冰箱", "除濕機", "窗(壁)型與箱型冷氣機", "以上皆是"], "answer": 3, "explanation": "電冰箱、除濕機、冷氣機能源效率標示揭露訊息包括產品名稱、型號、有效內容積、能源因數標示值、能源效率等級、年耗電量...等資訊。能源因數標示值(EF)越高，產品之年耗電量就會越低，代表該產品越節能；消費者亦可由能源效率等級辨識出高能源效率產品，產品能源效率等級的數字愈小代表愈省能、數字愈大代表愈耗能", "row": 40}, {"id": "初級-040", "level": "初級", "question": "下列哪個選項「不是」節能減碳的正確作法？", "options": ["隨手關燈", "使用節能標章的電器產品", "做好資源回收", "節省時間，多乘電梯"], "answer": 3, "explanation": "節能減碳的正確作為：隨手關燈拔插頭、使用省電燈具、鐵馬步行、多蔬食少吃肉等。", "row": 41}, {"id": "初級-041", "level": "初級", "question": "下列哪個選項是應用太陽能的「缺點」？", "options": ["不會產生空氣污染", "取之不盡用之不竭", "長期沒有日照就無法發電", "沒有任何缺點"], "answer": 2, "explanation": "太陽能是一項可以永續利用又少污染的絕佳天然資源，然而使用太陽能也有一些缺點，主要是受到陽光的限制，只能在陽光充足的白天，才能利用太陽能發電。", "row": 42}, {"id": "初級-042", "level": "初級", "question": "下列哪種方式是正確的節約能源方式？", "options": ["將室內空調冷氣開到強冷", "住家屋頂種植植物以降低室溫", "將空調冷氣開啟並將門窗打開", "將室內風扇全天候打開"], "answer": 1, "explanation": "綠化屋頂的好處有(1)改善熱島效應：吸收熱能，有助散熱、(2)降低頂層溫度，大約減低冷暖氣耗電量20%(一般瀝青屋頂日間溫度可達攝氏65度)、(3)美化環境、(4)改善空氣、(5)隔音、(6)調節雨水流量(保護下水道，排水系統)、(7)屋頂可種植農作物，提供食物、(8)保護屋頂(減少紫外線輻射)。", "row": 43}, {"id": "初級-043", "level": "初級", "question": "下列哪種方法可以節約用水？", "options": ["用盆浴後的水刷洗廁所", "用洗米水、煮麵水、苦茶粉洗碗筷", "採用二段式省水馬桶", "以上皆是"], "answer": 3, "explanation": "以上三種方式都可以達到省水之目的", "row": 44}, {"id": "初級-044", "level": "初級", "question": "下列哪種房子的設計「沒有」隔熱與通風的效果？", "options": ["建築物四周都有迴廊設計", "建築物有多孔牆", "頂樓加蓋鐵皮屋", "樓房屋頂有通風塔"], "answer": 2, "explanation": "建築的外牆或走廊採用多孔性設計、有走廊或遮陽設備的建築設計均可以使建築物達到散熱的效果；頂樓加蓋鐵皮屋反而會有增溫現象產生。", "row": 45}, {"id": "初級-045", "level": "初級", "question": "下列哪種房屋的設計「不會」影響室內溫度的變化？", "options": ["建築外牆的顏色", "建材的熱傳導性", "信箱擺放的位置", "室內採光的多寡"], "answer": 2, "explanation": "房屋外表的顏色、房屋的建材及窗戶的採光、通風、隔熱均會影響室內溫度的變化。", "row": 46}, {"id": "初級-046", "level": "初級", "question": "下列哪種能源「不是」潔淨且污染小的發電方式？", "options": ["水力", "太陽能", "風力", "核能"], "answer": 3, "explanation": "核能發電所排放的溫水會造成環境污染與生態破壞。", "row": 47}, {"id": "初級-047", "level": "初級", "question": "下列哪種能源的使用對環境破壞的程度最高？", "options": ["太陽能", "石油", "風力", "以上皆是"], "answer": 1, "explanation": "目前綠色能源包括風力、太陽能、水力、地熱、沼氣和海洋能。石油的大量開採及消耗將造成溫室效應等全球性問題。", "row": 48}, {"id": "初級-048", "level": "初級", "question": "下列哪種能源是動、植物的遺骸分解時，所產生的揮發性物質？", "options": ["地熱", "煤礦", "天然氣", "石油"], "answer": 2, "explanation": "天然氣是動、植物的遺骸分解時，所產生的揮發性物質。", "row": 49}, {"id": "初級-049", "level": "初級", "question": "下列哪種發電方式「不屬於」再生能源？", "options": ["水力", "風力", "太陽能", "核能"], "answer": 3, "explanation": "處理核廢料費時費力且核能發電所排出的大量溫水，會影響海域生物的生長。", "row": 50}, {"id": "初級-050", "level": "初級", "question": "下列哪種發電方式是利用水位的高度差產生的能量發電？", "options": ["火力發電", "水力發電", "核能發電", "風力發電"], "answer": 1, "explanation": "水力發電是利用水位的高度差，促使發電機發電。", "row": 51}, {"id": "初級-051", "level": "初級", "question": "下列哪種發電方式需要大量的冷卻水？", "options": ["風力發電", "水力發電", "核能發電", "以上皆是"], "answer": 2, "explanation": "核能發電以鈾為原料產生熱，將水加熱成蒸氣，推動發電機發電，並利用海水冷卻核子反應爐，而產生的溫熱海水會影響海洋生物的生長，使珊瑚礁死亡。", "row": 52}, {"id": "初級-052", "level": "初級", "question": "以下各種再生能源，哪一項必須仰賴足夠的風力才能穩定地供電，否則就得靠電池將電力貯存？", "options": ["生質酒精", "水力發電", "太陽能發電", "風力發電"], "answer": 3, "explanation": "再生能源中，只有生質能可以像石油一樣，貯存起來，以後或任何時間再使用。其他都得仰賴電池，而電池的效率又無法很高，造成供電的不穩定。", "row": 53}, {"id": "初級-053", "level": "初級", "question": "以下何者為造成溫室效應加劇的主要原因？", "options": ["懸浮微粒", "臭氧排放", "二氧化碳排放", "海水上升"], "answer": 2, "explanation": "二氧化碳排放為造成溫室效應的主要原因。", "row": 54}, {"id": "初級-054", "level": "初級", "question": "以下何者常以太陽能來使用？", "options": ["熱水器", "路燈", "計算機", "以上皆是"], "answer": 3, "explanation": "熱水器、路燈和電池等都可利用太陽能來提供。", "row": 55}, {"id": "初級-055", "level": "初級", "question": "以下何種氣體主要造成溫室效應？", "options": ["二氧化碳", "一氧化碳", "氧氣", "氮氣"], "answer": 0, "explanation": "造成溫室效應的氣體中，主要是二氧化碳，其次是氧化亞氮、甲烷和氫氟碳化物及臭氧，而二氧化碳主要是燃燒煤、石油等化石燃料。\n", "row": 56}, {"id": "初級-056", "level": "初級", "question": "以下何種發電方式的污染程度較低？", "options": ["煤炭發電", "石油發電", "天然氣發電", "太陽能發電"], "answer": 3, "explanation": "太陽能發電係使用再生能源對於環境的污染最少。", "row": 57}, {"id": "初級-057", "level": "初級", "question": "以下哪一項「不是」節約總用水量的好方法？", "options": ["雨水的回收", "減低工業用水", "減少打掃洗地的次數", "以淋浴替代泡澡"], "answer": 2, "explanation": "二十一世紀，人類所面臨的生存問題，最嚴重的是能源，其次是水，再來是糧食及環境。不過生活才是重點，不可以為了省水而不重視衛生。", "row": 58}, {"id": "初級-058", "level": "初級", "question": "以下哪一項「不是」臺灣都市綠建築避免熱島效應作法？", "options": ["架設綠屋頂", "多建金屬玻璃帷幕大樓", "增設草溝設計", "在空地設計貯集滲透水池"], "answer": 1, "explanation": "金屬玻璃帷幕其透光性強，雖可減少燈光照明器具，但相對地其室內溫度較高，導致冷氣使用時間長久，反而加速熱島效應的產生。", "row": 59}, {"id": "初級-059", "level": "初級", "question": "以下哪一項的作法，可以有效洗碗而不浪費太多的水或洗碗精？", "options": ["將髒的碗盤先行沖水，清除表面", "洗碗的水溫約在攝氏45度", "髒碗盤不疊在一起，而使盤底變油", "以上皆是"], "answer": 3, "explanation": "水溫很重要，稍微高的水溫，可以輕易洗掉油膩。先行沖掉髒東西，而不用洗碗精，可以節省水及洗碗精的用量。", "row": 60}, {"id": "初級-060", "level": "初級", "question": "以下哪一項是有效提昇家裡用電效率的作法？", "options": ["吹冷氣時，打開部分窗戶通風", "將電流與電壓間偏離的相角調回零", "把客廳的燈全部開光來閱讀", "將剛洗好的衣服，趕快直接進行烘衣程序"], "answer": 1, "explanation": "很多家庭生活的小細節，都嚴重影響到用電的效率。而相角的偏離，更直接讓臺電送進來的電變成虛功率而無法使用。", "row": 61}, {"id": "初級-061", "level": "初級", "question": "以下哪一種購買方式最符合低碳生活的原則？", "options": ["購買舶來品", "使用國際名牌的商品", "購買本地生產的商品", "購買名牌包"], "answer": 2, "explanation": "購買本地生產的商品，可以降低長途交通運輸所消耗的能源，進而達到低碳生活的目的。", "row": 62}, {"id": "初級-062", "level": "初級", "question": "北歐國家課徵碳稅項目中「不包括」哪項？", "options": ["天然氣", "水力發電", "煤碳", "油品"], "answer": 1, "explanation": "碳稅係針對一般常見能源如油品、煤碳、電力及天然氣等，以其碳含量為基準，所課徵之稅目，亦有稱為二氧化碳稅。而目前北歐國家的課徵碳稅項目中並沒有包涵水力發電。", "row": 63}, {"id": "初級-063", "level": "初級", "question": "下列哪一項為全球暖化對臺灣造成的影響？", "options": ["水資源增加", "土石流減少", "沿海土地面積縮減", "颱風減少"], "answer": 2, "explanation": "全球暖化會導致西部海岸的低窪地區有遭受淹沒的危險，颱風侵臺的機率提高且強度變大，容易發生土石流等災害，登革熱等傳染病在冬天也會肆虐臺灣，年均溫度也會提升。", "row": 64}, {"id": "初級-064", "level": "初級", "question": "冰島擁有下列哪一種豐富資源，並且藉此提供首都所需的能源？", "options": ["太陽能", "風力", "地熱", "潮汐能"], "answer": 2, "explanation": "冰島利用豐富的地熱資源和地熱發電科技；首都雷克亞維克是百分之百靠地熱提供能源的都市。", "row": 65}, {"id": "初級-065", "level": "初級", "question": "各國為解決能源耗竭問題而研發替代能源，下列何者「不是」可再生能源？", "options": ["風力", "地熱", "石油", "太陽能"], "answer": 2, "explanation": "再生能源有太陽能、水力、風力、地熱等。", "row": 66}, {"id": "初級-066", "level": "初級", "question": "各種交通工具和電器設備所排放的哪種氣體，容易造成地球暖化？", "options": ["二氧化硫", "二氧化碳", "一氧化碳", "一氧化硫"], "answer": 1, "explanation": "汽機車與電器設備排放的廢氣、濃煙，增加空氣中二氧化碳的濃度，造成全球暖化。", "row": 67}, {"id": "初級-067", "level": "初級", "question": "如果要蓋一座符合環保概念的園區，下列哪個選項的作為「不適合」出現？", "options": ["利用風力發電", "採用太陽能發電系統", "選購節能標章的設施", "建材儘量從國外買進來"], "answer": 3, "explanation": "政府倡導降低生態和環境負荷的行動。例如鼓勵使用太陽能發電、推動綠建築。應就地取材，才是符合環保的概念。", "row": 68}, {"id": "初級-068", "level": "初級", "question": "我們應該如何節約能源，下列何者是正確的？", "options": ["電視機可以打開一整晚", "中午午休時，隨手關燈", "距離目的地不到3分鐘，還是開車比較方便", "夏天時，冷氣可以開到20度以下"], "answer": 1, "explanation": "電視機沒有收看時，要記得關掉，以避免浪費能源；距離目的地不到3分鐘，建議用步行的方式比較節省能源；夏天時，室內的溫度建議在26度左右最剛好，不要讓冷氣開到20度以下，這樣會浪費能源喔。", "row": 69}, {"id": "初級-069", "level": "初級", "question": "京都議定書主要是減少下列哪一種氣體的排放？", "options": ["二氧化碳", "水蒸氣", "一氧化碳", "氫氣"], "answer": 0, "explanation": "京都議定書主要是規範人為排放溫室氣體的數量，以減少對環境的影響，對全球升溫的貢獻來說，由於二氧化碳的排放量最多，所占比率最大，所以京都議定書主要是希望能減少二氧化碳的排放量。", "row": 70}, {"id": "初級-070", "level": "初級", "question": "京都議定書主要是減少下列哪一種環境效應？", "options": ["溫室效應", "酸雨", "火山爆發", "生物多樣性"], "answer": 0, "explanation": "京都議定書主要是規範人為排放溫室氣體的數量，以減少對環境的影響，而溫室效應的氣體主要是二氧化碳。", "row": 71}, {"id": "初級-071", "level": "初級", "question": "京都議定書對我國帶來什麼影響？", "options": ["促使我國對節能減碳的重視", "促使我國對海洋污染的重視", "促使我國對輻射污染的重視", "促使我國對垃圾分類的重視"], "answer": 0, "explanation": "我國雖然沒有簽署京都議定書，但政府也積極推行環境保護政策，以減少溫室效應對全球環境所造成的影響。", "row": 72}, {"id": "初級-072", "level": "初級", "question": "使用太陽能燈和太陽能熱水器是配合綠建築的哪一項主張？", "options": ["讓人住得更舒適", "涵養水源", "節能減碳", "親近自然環境"], "answer": 2, "explanation": "充分利用太陽能、風力等自然資源，能減少對環境的傷害，即可節能，也可減碳。", "row": 73}, {"id": "初級-073", "level": "初級", "question": "使用何種再生能源有助於減少溫室氣體的排放？", "options": ["風能", "水力", "太陽能", "以上皆是"], "answer": 3, "explanation": "有些再生能源(如風能、水力、太陽能)不會排放溫室氣體，如二氧化碳，因此不會增加溫室效應的風險。", "row": 74}, {"id": "初級-074", "level": "初級", "question": "怎樣的住宅設計可以「減少」能源的消耗，下列哪個選項最正確？", "options": ["設置電梯", "讓室內空氣對流", "使用白熾燈泡", "採用玻璃帷幕牆"], "answer": 1, "explanation": "利用空氣對流的特性，設計自然通風的房舍，讓人住得更舒適。", "row": 75}, {"id": "初級-075", "level": "初級", "question": "政府所宣導的節能「減碳」，指的是減少下列哪一種物質？", "options": ["一氧化碳", "二氧化碳", "一氧化二碳", "二氧化三碳"], "answer": 1, "explanation": "我們常聽到的節能減「碳」指的是空氣中的二氧化碳。", "row": 76}, {"id": "初級-076", "level": "初級", "question": "政府為配合京都議定書的政策，做了哪些努力？", "options": ["因為沒有簽署所以沒有政策", "實施噪音管制時段", "落實垃圾不落地政策", "制定再生能源發展條例"], "answer": 3, "explanation": "京都議定書主要是規範人為排放溫室氣體的數量，以減少對環境的影響。臺灣政府做了許多政策，包括：研發低污染的替代能源、宣導全民減碳和改變能源結構等等。", "row": 77}, {"id": "初級-077", "level": "初級", "question": "為控制污染問題，各國紛紛投入研發乾淨的替代能源，目前哪一種能源逐漸被國人居家使用？", "options": ["太陽能", "水力", "生質燃料", "地熱"], "answer": 0, "explanation": "許多國家運用科技，改善能源耗竭和環境污染的問題，積極發展太陽能光電。", "row": 78}, {"id": "初級-078", "level": "初級", "question": "相對而言，下列哪種發電方式對環境所造成的影響最大？", "options": ["風力、地熱發電", "核能、火力發電", "水力、太陽能", "風力、水力發電"], "answer": 1, "explanation": "火力發電雖然有污染防制設備的幫忙，但還是會排出廢氣，造成空氣污染；核能發電則會排出大量溫水，影響海域生物的生長。", "row": 79}, {"id": "初級-079", "level": "初級", "question": "要過健康的綠生活，我們可以怎麼做，下列何者正確？", "options": ["多爬樓梯、少搭電梯", "自備環保餐具、環保袋", "搭乘大眾交通工具", "以上皆是"], "answer": 3, "explanation": "少搭電梯、多搭乘大眾交通工具可以節約能源、減少碳排放；而自備環保餐具替代一次性產品(例如免洗碗筷、免洗杯)，還有自備環保袋替代塑膠袋，都可以降低塑膠使用量。", "row": 80}, {"id": "初級-080", "level": "初級", "question": "家裡的冰箱是家裡最耗能的電氣產品，因此如何正確使用冰箱是非常重要的。以下哪一項是有效節能減碳的作法？", "options": ["購買節能標章的冰箱", "每週定期清理冰箱裡的物品", "減少開關冰箱的頻率", "以上皆是"], "answer": 3, "explanation": "冰箱是家裡節電的首選，然而不是每個家庭都有經費來購買新冰箱；因此，正確地的操作也是必須努力學習的。", "row": 81}, {"id": "初級-081", "level": "初級", "question": "臺灣目前發電方式所占比例最高的是下列哪個選項？", "options": ["火力發電", "風力發電", "太陽能發電", "核能發電"], "answer": 0, "explanation": "臺灣目前發電方式所占比例最高的是火力發電。", "row": 82}, {"id": "初級-082", "level": "初級", "question": "燃燒後所產生的蒸汽來推動發電機發電，是利用下列哪種方式？", "options": ["水力發電", "核能發電", "火力發電", "風力發電"], "answer": 2, "explanation": "使用煤、石油與天然氣當燃料，利用燃燒後的蒸氣推動發電機，是臺灣發電的主要動力。", "row": 83}, {"id": "初級-083", "level": "初級", "question": "購買具有節能標章的產品(如：變頻冷氣)，長期而言有何好處？", "options": ["節電", "省錢", "減碳", "以上皆是"], "answer": 3, "explanation": "選購環保標章、節能標章、省水標章及EER值高的商品，節能減碳又環保。", "row": 84}, {"id": "初級-084", "level": "初級", "question": "離岸式風力發電廠開發需透過哪個單位去做海洋污染防治？", "options": ["經濟部(能源局)", "國防部、行政院海巡署", "行政院環保署", "內政部(營建署)"], "answer": 2, "explanation": "離岸式風力發電廠申設時涉及較通案性之相關業務及主管機關，(電業籌設：經濟部能源局)、(國家安全相關管制及禁限建事項：國防部、行政院海巡署)、(人工島嶼設施結構物設置：內政部營建署)、(環境影響評估及海洋污染防治則是：行政院環保署)", "row": 85}, {"id": "初級-085", "level": "初級", "question": "關於天然氣的描述，下列哪個選項是「錯誤」的？", "options": ["燃點很低", "氣體很活潑", "可以回收再利用", "容易散失"], "answer": 2, "explanation": "天然氣是蘊藏在地底下的氣體混和物，容易散失、很活潑且容易燃燒。", "row": 86}, {"id": "初級-086", "level": "初級", "question": "關於太陽能的敘述，下列哪個選項是正確的？", "options": ["太陽能是地球主要電力來源", "太陽能目前被廣泛的使用於家電用品上", "太陽能會污染環境", "太陽能路燈是將太陽的熱儲存起來，再轉換成電能"], "answer": 3, "explanation": "它的基本原理是將太陽輻射能收集起來，通過與物質的相互作用轉換成熱能加以利用。", "row": 87}, {"id": "初級-087", "level": "初級", "question": "關於透水步道的敘述，下列哪個選項是「錯誤」的？", "options": ["它的透水性佳", "可以涵養自然界的水資源", "柏油為常見用材", "使雨水容易滲入地底下"], "answer": 2, "explanation": "透水步道利用透水性佳的石頭、地磚來鋪設庭院步道、車道，雨水容易滲入地底下，可以涵養自然界的水資源。柏油不是透水步道常見的用材。", "row": 88}, {"id": "初級-088", "level": "初級", "question": "運輸能源的需求與消耗量僅次於工業用途，若能達到「綠色運輸」，必能為地球減輕不少負擔。下列何者符合「綠色運輸」之定義？", "options": ["上課來不及，搭乘計程車", "騎自行車或搭乘大眾運輸交通工具", "騎摩托車到附近便利商店，而不走路前往", "開跑車出門比較威風"], "answer": 1, "explanation": "綠色運輸定義為「基於環境永續與人本關懷之理念，透過發展低碳運輸系統、加強運輸需求管理與提升運輸能源使用效率等方針，及公共運輸發展導向規劃、先進之通訊與綠能科技應用等方式，達成環境保護、節能減碳、便捷無縫等目標之運輸。」透過能源使用效率的提高及替代能源的使用，減少石化能源的消耗及溫室氣體與空氣污染物的排放。", "row": 89}, {"id": "初級-089", "level": "初級", "question": "下列關於政府推動的「四省專案計畫」，何者敘述正確？", "options": ["省油─員工公出鼓勵搭乘計程車，以報公帳", "省水─馬桶只裝一段式沖水配件，減少成本", "省紙─公文及紙張使用，採取單面印刷才符合審美", "省電─推行步行運動，3 樓以下不搭乘電梯。"], "answer": 3, "explanation": "環保署為促成民眾在一般生活中就可力行節能減碳，在2011 年啟動的全國「四省競賽計畫」，期望在不降低生活品質、不造成生活不便的前提下，達到節能減碳的目標。之後，更以機關學校為規範對象，於2013 年推動「政府機關及學校四省專案計畫」。", "row": 90}, {"id": "初級-090", "level": "初級", "question": "面蓋式平板太陽能熱水器的表面多漆成何種顏色，以加強太陽輻射吸收效能？", "options": ["紅色", "黑色", "銀色", "白色"], "answer": 1, "explanation": "面蓋式平板太陽能熱水器，係利用表面漆成黑色的金屬集熱板吸收太陽輻射，並在金屬板下焊上集水管，把金屬集熱板所吸收的熱量傳導至集水管內的冷水。由於金屬集熱板直接暴露在大氣中，為減少熱量的散失，通常會在金屬集熱板底面包覆隔熱材料，並在框架上方覆以玻璃面蓋，既不妨礙陽光入射，又可減少金屬集熱板表面的熱對流損失。", "row": 91}, {"id": "初級-091", "level": "初級", "question": "電動車因具低污染之優點，而成為各國推廣的綠色低碳運具，下列關於電動車之描述，何者為「非」？", "options": ["行駛成本較低", "噪音較低", "不會消耗能源", "具減碳效益"], "answer": 2, "explanation": "目前電動公車不含電池之車體價格高於柴油公車，初期客運業者負擔高，但隨著油價上漲，電動公車使用成本已低於柴油公車，柴油公車除了操控性、最大馬力、扭力及車輛總重較佳外，其餘如行駛成本、減碳及噪音等性能電動公車皆優於柴油公車。", "row": 92}, {"id": "初級-092", "level": "初級", "question": "溫室效應對地球有何影響？", "options": ["氣溫上升", "氣溫不變", "氣溫降低", "水資源變多"], "answer": 0, "explanation": "溫室效應之影響如下：\n1.氣溫上升，南北極冰山融解，海平面上升，沿海地帶淹沒 。\n2.氣溫上升，冰河消失，水資源減少 。\n3.氣溫上升，乾旱增加，糧食不足。\n4.生態系統破壞，生物絕跡。", "row": 93}, {"id": "初級-093", "level": "初級", "question": "減少能源消費，不但可降低進口能源依賴，轉換為國家競爭力，還有以下哪一個重要目的？", "options": ["享譽國際", "解決饑荒", "降低溫室氣體排放", "減少天災人禍發生"], "answer": 2, "explanation": "能源效率的提升可以減少能源消費，因此降低國家的進口能源依賴、改善能源安全、轉換為國家競爭力而刺激經濟成長，最重要的是降低污染及溫室氣體排放。", "row": 94}, {"id": "初級-094", "level": "初級", "question": "下列何者是降低冷氣使用的好方法？", "options": ["冷氣使用時打開週遭窗戶增加空氣對流降低溫度", "設定溫度以19~21\n°C為宜", "減少日光燈照射", "種植盆栽可以淨化空氣，並可降低暑氣"], "answer": 3, "explanation": "冷氣溫度每調高1°C，可省6％的耗電量，並可藉由種植盆栽等綠色作物來淨化空氣降低暑氣。另外也可以藉由酒精揮發快速之效果來有效降低室內溫度。", "row": 95}, {"id": "初級-095", "level": "初級", "question": "關於省水標章之敘述，下列何者為真？", "options": ["通過檢驗的產品，才能在產品上標示省水標章", "省水標章標示越大越受民眾肯定", "省水標章使用證書有效期間一律為十年", "省水標章之使用政府會另外收取一筆使用費"], "answer": 0, "explanation": "省水標章使用證書，應分別記載廠商名稱、地址、代表人姓名、產品項目、產品名稱及型號、證書編號及有效起迄日期。取得省水標章使用證書之產品，應於產品本體清楚標示省水標章圖樣及廠商編號。使用省水標章時，應依規定註冊之圖樣，不得變形或加註字樣，但得依等比例放大或縮小。省水標章使用證書有效期間為3年，惟依省水標章要點第5點、第1項、第4款但書申請者，其有效期限與他廠或系列產品原有效期限內省水標章使用證書期限相同，為鼓勵節約用水，省水標章之使用及審查均不收取費用。惟申請時各項檢驗費用或必要之產品抽驗費用，由申請廠商自行負擔。", "row": 96}, {"id": "初級-096", "level": "初級", "question": "請問販賣何種產品之商店，可申請獲得綠色商店標誌？", "options": ["比便利商店還便宜之產品", "溫室栽種之有機產品", "顏色為綠色之產品", "有環保或節能之綠色商品"], "answer": 3, "explanation": "環保署定義售有一定數量環保或節能之綠色商品，並針對該商品具有特定陳列方式之通路為「綠色商店」，經申請後核發綠色商店LOGO。", "row": 97}, {"id": "初級-097", "level": "初級", "question": "為何要響應政府的「綠色消費」政策？", "options": ["因為綠色是代表健康的顏色", "保護地球資源，讓人類與地球共生", "讓政府有更多資金可以運用", "廠商賺錢後會幫忙種樹"], "answer": 1, "explanation": "由於經濟與科技快速成長，對自然界造成了嚴重污染與破壞，使得臺灣地區的資源超限利用，生態資源嚴重被破壞。針對這些環境問題，須從你、我日常生活習慣中建立「生活做環保，消費看標章」的意識，塑造愛護環境的情懷，以保護地球資源，讓人類與地球共生、共榮、共創青山綠水好家園。", "row": 98}, {"id": "初級-098", "level": "初級", "question": "成為綠色消費者，在購買家電產品時，應考慮什麼？", "options": ["價格是否昂貴", "外觀是否美觀", "包裝是否精美", "是否有節能標章"], "answer": 3, "explanation": "產品貼上這個圖樣，代表能源效率比國家認證標準高10至50%，不僅品質有保障，更節能省錢。希望藉由節能標章制度的推廣，鼓勵民眾使用高能源效率產品，以減少能源消耗。", "row": 99}, {"id": "初級-099", "level": "初級", "question": "具有環保標章的環保杯，應符合以下何項條件？", "options": ["盡量使用含雙酚A成分的材質", "不可重覆利用", "廢棄後會對環境造成衝擊", "不含有環境荷爾蒙"], "answer": 3, "explanation": "具有環保標章的環保杯，不使用聚氯乙烯與聚苯乙烯塑膠材質，不得檢出磷苯二甲酸酯類塑化劑、雙酚A及有害重金屬，產品可重複使用且易於回收，除於生產、使用、廢棄階段降低對環境之衝擊外，亦因產品中不含上例環境荷爾蒙等化學物質，可保護消費者健康。", "row": 100}, {"id": "初級-100", "level": "初級", "question": "推動綠色餐廳，可為環境帶來什麼影響？", "options": ["不浪費自然資源", "帶動經濟發展", "改善工廠營運狀況", "減少人口老化"], "answer": 0, "explanation": "綠色餐廳秉持對低碳、環保之理念，減少廢棄物和廚餘的處理，使自然資源不浪費。", "row": 101}, {"id": "初級-101", "level": "初級", "question": "下列何種方式可降低室內溫度？", "options": ["使用綠顏色油漆", "緊閉門窗避免熱氣流入", "屋頂綠化", "屋內多擺設一些傢俱"], "answer": 2, "explanation": "房屋外表的顏色、建材及窗戶的採光、通風、隔熱，均會影響室內溫度的變化。", "row": 102}, {"id": "初級-102", "level": "初級", "question": "下列關於綠色標章制度之敘述，何者正確？", "options": ["各行業的評估系統相同", "清潔生產評估系統完全以經驗為參考標準", "綠色標章制度與企業永續發展較無關聯", "將產業發展為綠色工廠，提升我國永續發展形象"], "answer": 3, "explanation": "綠色工廠標章制度、提供企業追求永續成長的議題，將產業升級並轉型為綠色工廠，以掌握國際綠色市場商機，提升我國永續發展的形象。清潔生產評估系統係以聯合國環境規劃署(UNEP)之定義為基礎，並參考相關輔導經驗所建立。然而，由於不同產業於生產、製程、污染物特性，關注之環境議題不盡相同，故將逐步建立各行業別之各項環境標竿值與清潔生產評估系統。", "row": 103}, {"id": "初級-103", "level": "初級", "question": "我國重視綠色產業主要原因為何？", "options": ["透過綠色產業，達到永續發展", "獲得實質經濟效益", "最終目標成為綠色產業的模範", "透過綠色產業，奠定國際地位"], "answer": 0, "explanation": "環境的議題無國界；產業必須面對永續發展趨勢的多元與快速演變，全球最大的積體電路製造商－台積電，為打造永續競爭力，積極取得綠色工廠標章。而華碩運用工業局推廣的各種清潔生產技術及環境管理系統，落實到綠色供應鏈，取得各式產品環保標章，將清潔生產及環境管理等綠色要素融入為產品環境化設計之綠色基因。", "row": 104}, {"id": "初級-104", "level": "初級", "question": "關於綠色產品之敘述，何者正確？", "options": ["於設計產品時以整體外觀為考量依據", "在選擇生產產品及方法時，考慮到如何使利益最大化", "生產綠色產品要選擇使用無公害的新能源", "包裝應採用華麗的外觀，吸引消費者"], "answer": 2, "explanation": "綠色產品應包括以下幾點：1.以產品的整體概念考慮產品的設計，產品形體及售後服務要節約資源、保護環境。2.在選擇產品與技術時，考慮到盡可能減少對環境的不利影響。3.生產綠色產品要選擇綠色資源，應看重使用無公害、養護型的新能源和資源。4.綠色產品的包裝材料盡可能單純化、簡單化、降低原材料消耗，避免過度包裝。", "row": 105}, {"id": "初級-105", "level": "初級", "question": "綠色農業，又稱永續農業，是利用新的耕作方法，來減少對土地的負擔。下列關於「綠色農業」的敘述，何者正確？", "options": ["為了保持水土，不惜砍伐森林實行綠色農業", "使用有機肥料代替化學肥料", "利用外來物種，清除害蟲", "為了提高利益不斷的耕作，不給土地休息的機會"], "answer": 1, "explanation": "永續農業的施行不僅是希望農民能有利潤、產量穩定且品質佳，更要追求耕種過程中維護環境的安全及保持水土。在實施策略上，包含：保育水土資源、建立合理輪作制度以維護土壤生產力、改進施肥技術、開發生物性及有機質肥料、農藥開發及農畜產廢棄物處理之研究，和有機農產品的推廣等等。", "row": 106}, {"id": "初級-106", "level": "初級", "question": "下列關於「綠色科技」的敘述，何者正確？", "options": ["只要滿足現代人需求即可", "製造出來的產品不要對環境有太嚴重的損害，不回收利用也無妨", "藉由改變製造或消費的型態來增加利益", "著重於開發替代科技以取代石化燃料或化學品"], "answer": 3, "explanation": "綠色科技的研發目的在於減少能源使用與降低污染，並能改善生活環境品質的科技；其主要理念有五：永續性強調滿足當代人需求，但不損及後代發展；從搖籃到搖籃是指製造出的產品必須能完全回收或再利用；減少資源使用量，目的在於藉由改變製造或消費的型態，以減少廢棄物與污染的產生；創新、著重開發替代科技以取代石化燃料或化學品。", "row": 107}, {"id": "初級-107", "level": "初級", "question": "「節能標章」代表的意思，以下何者為真?", "options": ["代表產品能源效率比國家標準(CNS)高", "代表產品使用年限較長", "使用節能家電，家裡的電費一定會減少", "使用節能家電，家裡的電費會獲得補助"], "answer": 0, "explanation": "產品標示「節能標章」代表高能源效率，通過認證之產品，其能源效率比國家標準(CNS)高10%~50%，高居市售產品能源效率之前10%~30%。亦即產品在相同功能條件下，相較於未獲證產品，消耗較少的能源、負擔較低的能源費用，尤其對於高耗能、長期使用或使用壽命長的產品項目，將有更顯著的差異。", "row": 108}, {"id": "初級-108", "level": "初級", "question": "使用節能標章產品，對環境會有什麼益處？", "options": ["提供植物更多的二氧化碳", "增加非再生能源", "讓居住環境中的植物成長加速", "節約能源減少碳排放"], "answer": 3, "explanation": "使用節能標章產品，最主要的效益就在於節約能源，一度電排放量為 0.536 kg CO2，天然氣一度（m3）的排放量為 2.09 kg CO2，桶裝瓦斯一公斤的排放量為 3.19kg CO2，汽油一公升的排放量為2.36 kg CO2，加速溫室效應，所以省能就可以減少二氧化碳排放量，減緩溫室效應惡化的速度。經過計算，購買一臺節能標章冷氣機，因為省電而減少的二氧化碳排放量大約相當於種植33棵大樹，而購買一臺節能標章電冰箱，對環境的貢獻更相當於種植40棵大樹。", "row": 109}, {"id": "初級-109", "level": "初級", "question": "政府為因應溫室效應，提出許多做法，以下何者為經濟部能源局積極推動的制度?", "options": ["推動「回收標章」制度", "推動「食品安全標章」制度", "推動「節能標章」制度", "推動「省水標章」制度"], "answer": 2, "explanation": "由於地球溫室效應日趨嚴重，且我國屬海島國家，99％以上能源仰賴進口，經濟部能源局為提昇能源使用效率，並降低二氧化碳排放量，積極推動「節能標章」制度，受理廠商自願性的申請，並利用宣導、獎勵、租稅優惠與政府強制採購等方式，鼓勵消費大眾與政府機關採購節能標章產品，為生產節能標章之廠商提供實際明確的經濟性誘因，以激勵廠商投入高能源效率產品的開發。", "row": 110}, {"id": "中級-001", "level": "中級", "question": "自溫室效應被發現且由科學家提出警訊至今，聯合國及各國政府與非政府組織即著手研擬各種不同類型之減緩策略，以下哪些「不是」臺灣的減緩策略？", "options": ["節約能源、提高能源效率", "發展火力發電技術", "開發新興與再生能源", "發展溫室氣體減量"], "answer": 1, "explanation": "自溫室效應被發現且由科學家提出警訊至今，聯合國及各國政府與非政府組織即著手研擬各種不同類型之減緩策略，包括：節約能源、提高能源效率、開發新興與再生能源、發展溫室氣體減量技術。然而全球暖化和氣候變遷的趨勢，已非靠人類減少溫室氣體排放所能避免。", "row": 2}, {"id": "中級-002", "level": "中級", "question": "《京都議定書》中規範下列何種溫室氣體？", "options": ["二氧化碳(CO2)", "氧氣(O2)", "一氧化碳(CO)", "臭氧(O3)"], "answer": 0, "explanation": "「京都議定書」係依據各國所提建議案再行協商以達共識，其重點包括管制氣體CO2、CH4、N2O、HFCs、PFCs、SF6等六種溫室效應的氣體減量。", "row": 3}, {"id": "中級-003", "level": "中級", "question": "《京都議定書》內容主要是限制下列何種氣體的排放，避免溫室效應惡化？", "options": ["二氧化碳", "臭氧", "水", "一氧化碳"], "answer": 0, "explanation": "京都議定書內容主要針對各國二氧化碳的排放。", "row": 4}, {"id": "中級-004", "level": "中級", "question": "《蒙特婁議定書》是為保護臭氧層，管制國際間臭氧層破壞物質的使用，下列何者「不是」管制的項目？", "options": ["二氧化碳", "四氯化碳", "氟氯碳化合物(CFCs)", "溴甲烷"], "answer": 0, "explanation": "目前管制的項目包括全氟氯碳化合物(CFCs)、海龍(Halons)、四氯化碳、非全氟氯碳化合物(HCFCs)、非全氟溴碳化合物(HBFCs)、三氯乙烷及溴甲烷等。", "row": 5}, {"id": "中級-005", "level": "中級", "question": "「氣候變化綱要公約」規定簽約國限制下列哪種氣體的排放？", "options": ["一氧化碳", "二氧化碳", "氫氣", "氧氣"], "answer": 1, "explanation": "氣候變化綱要公約規定簽約國訂出二氧化碳氣體的排放標準。", "row": 6}, {"id": "中級-006", "level": "中級", "question": "「這種氣體在溫室氣體中，雖然吸收長波輻射能量的能力最低，但是它卻占了溫室氣體總量的大部分，而對溫室效應造成最大的影響。」，上述氣體最可能為下列何者？", "options": ["甲烷", "二氧化碳", "全氟化碳", "六氟化硫"], "answer": 1, "explanation": "每一種溫室氣體攫住大氣中熱氣的能力均不同，HFCs與PFCs吸住熱的能力最大，甲烷吸收的熱超過二氧化碳吸收的21倍，而氧化亞氮所吸收的熱較二氧化碳所吸收的多270倍。以二氧化碳為基準，各溫室氣體的增溫效應及其來源如下：二氧化碳：1；甲烷：21；笑氣(N2O)：310；氫氟碳化物(HFCs)：140-11700；全氟化碳(PFCs)：6500-9200；六氟化硫(SF6)：23900。", "row": 7}, {"id": "中級-007", "level": "中級", "question": "「節能標章」的使用期限為何？", "options": ["1年", "2年", "3年", "4年"], "answer": 1, "explanation": "節能標章使用契約期限屆滿前四個月，廠商得檢具原核發之節能標章使用證書、廠商及產品之基本證明文件與產品產量及銷售量資料向執行單位提出續約申請，續約期間為2年，並得多次續約。", "row": 8}, {"id": "中級-008", "level": "中級", "question": "「潮汐發電」的發電原理是什麼？", "options": ["利用海水的溫差", "利用海水的波動", "利用海流的流動", "利用海水的水位差"], "answer": 3, "explanation": "潮汐發電是利用每天漲潮與退潮的水位差，帶動發電機發電，利用海水的重力位能轉換成電能。", "row": 9}, {"id": "中級-009", "level": "中級", "question": "「締約國應確保其溫室氣體的人為二氧化碳排放總量不超過分配數量，以使其在2008年至2012年承諾期內這些氣體的全部排放量從1990年水平至少減少5%」上列敘述應是哪一個文件的規範內容？", "options": ["《蒙特婁議定書》", "《京都議定書》", "《地球高峰會協議》", "《世界氣象組織規範書》"], "answer": 1, "explanation": "京都議定書規範締約國溫室氣體的二氧化碳排放量。", "row": 10}, {"id": "中級-010", "level": "中級", "question": "5R為垃圾減量的五項原則，下列何者正確？", "options": ["Refuse：拒用無環保觀念產品", "Repair:重複使用容器或產品", "Recycle:重視維修保養", "以上皆是"], "answer": 0, "explanation": "Reduce：減少丟棄之垃圾量。Reuse：重複使用容器或產品。Repair：重視維修保養，延長物品使用壽命。Refuse：拒用無環保觀念產品。Recycle：回收使用再生產品。", "row": 11}, {"id": "中級-011", "level": "中級", "question": "一旦大氣中的CO2含量增加，會引起哪一種後果？", "options": ["臭氧層破洞", "溫室效應惡化", "冰期來臨", "海平面下降"], "answer": 1, "explanation": "因人類使用化石燃料燃，產生CO2等氣體，大量排放進入大氣後，吸收地表之長波輻射，造成之人為溫室效應使地表溫度逐漸增加。", "row": 12}, {"id": "中級-012", "level": "中級", "question": "人類活動大量排放二氧化碳「不會」導致下列哪個後果？", "options": ["全球氣溫上升", "熱帶淺海珊瑚殼體溶解", "火山活動趨於旺盛", "地表吸收輻射量增加"], "answer": 2, "explanation": "大氣中二氧化碳含量提高，海洋中也會溶解更多二氧化碳，海水變酸會破壞珊瑚的碳酸鈣殼體。而人類活動大量排放二氧化碳並不會造成火山活動趨於旺盛。", "row": 13}, {"id": "中級-013", "level": "中級", "question": "人類活動提高了溫室效應造成地球暖化，下列敘述何者正確？", "options": ["會造成氣候劇烈變化", "地表溫度降低，海水溫度上升", "海平面下降", "冰河面積增加"], "answer": 0, "explanation": "人類使用化石燃料燃燒後所產生之CO2氣體，大量排放進入大氣後，吸收地表之長波輻射，造成之人為溫室效應使地表溫度逐漸增加，而溫室效應會影響地球不正常之氣候變遷。", "row": 14}, {"id": "中級-014", "level": "中級", "question": "下列何者「不是」我國永續能源政策綱領之政策原則「二高二低」？", "options": ["低排放", "低依賴", "高效率", "高經濟"], "answer": 3, "explanation": "永續能源政策的基本原則將建構「高效率」、「高價值」、「低排放」及「低依賴」。", "row": 15}, {"id": "中級-015", "level": "中級", "question": "下列何者「不是」氣候變遷所造成的災害？", "options": ["犯罪率提升", "加劇熱島效應", "電氣設備容易暴露於危險中", "都市污水處理與衛生設施亦受衝擊"], "answer": 0, "explanation": "都市地區建築物、道路、基礎設施和其他建設產生更多不透水面積，極端降雨所產生大量的地表逕流，能輕易使都市的排水系統失去作用，導致都市污水處理與衛生設施亦受衝擊，進而影響人類衛生健康；電氣設備也特別容易暴露於危險中，造成都市機能喪失或降低；由於熱島效應，高密度都市與周邊地區的溫差可能達到10℃。", "row": 16}, {"id": "中級-016", "level": "中級", "question": "下列何者「不是」海水溫度上升對水產養殖漁業生產的衝擊？", "options": ["改變養殖之水質環境", "增加水產疾病風險", "衝擊水產養殖物種生產力", "增加寒帶水產養殖物種生產量"], "answer": 3, "explanation": "海水溫度上升會改變養殖之水質環境，增加水產疾病風險，衝擊水產養殖物種生產力與生產量。", "row": 17}, {"id": "中級-017", "level": "中級", "question": "下列何者「不是」海水溫度上升對漁業生產的衝擊？", "options": ["改變海洋漁業資源種類與數量", "漁場位移或消失", "魚群迴游路線改變", "捕撈無獲風險降低"], "answer": 3, "explanation": "海水溫度上升會改變海洋漁業資源種類與數量、漁場位移或消失、魚群迴游路線改變及捕撈無獲風險增加。", "row": 18}, {"id": "中級-018", "level": "中級", "question": "下列何者「不是」綠建築的三大設計理念？", "options": ["增加舒適性", "自然調和健康", "重視環保", "經濟實惠"], "answer": 3, "explanation": "內政部建築研究所為鼓勵興建省能源、省資源、低污染之綠建築建立舒適、健康、環保之居住環境，發展以「舒適性」、「自然調和健康」、「環保」等三大設計理念。", "row": 19}, {"id": "中級-019", "level": "中級", "question": "下列何者「不是」製作擂茶的工具？", "options": ["擂缽", "擂捧", "擂棍", "水壺"], "answer": 3, "explanation": "擂茶別名「三生湯」，擂茶是一種民間古老的飲食方式，「擂」字本身就有研磨、擣杵之意，所以磨製是處理食物原料的根本方法；其次，擂茶被認為具有保健去病的效果，這可能與擂茶的材料不僅營養價值高，經磨製後又有助吸收有關。擂茶的工具為擂缽、擂捧、湯匙。", "row": 20}, {"id": "中級-020", "level": "中級", "question": "下列何者「不屬於」綠色商品？", "options": ["獲得能源標章產品", "獲得環保標章產品", "獲得綠建築標章產品", "獲得CNS標章產品"], "answer": 3, "explanation": "綠色商品導入與管理：商品獲得「環保標章」、「節能標章」等政府認定為綠色產品或符合這些標章規格的產品之導入與管理。CNS標章為：產品安全標章。", "row": 21}, {"id": "中級-021", "level": "中級", "question": "下列何者可以作為再生紙利用？", "options": ["蠟紙", "複寫紙", "傳真紙", "牛皮紙袋"], "answer": 3, "explanation": "廢紙可細分為白紙類、混合紙類、報紙類及牛皮紙類等四類分類回收但若是紙上有油漬、塑膠覆膜，或是複寫紙、蠟紙、摻有其他成分如金屬的合成紙、用過的衛生紙、紙尿片，是無法當再生紙用。", "row": 22}, {"id": "中級-022", "level": "中級", "question": "下列何者可以減輕溫室效應？", "options": ["控制溫室氣體排出", "舖設柏油路", "生產氟氯碳化物產品", "多吹冷氣降溫"], "answer": 0, "explanation": "造成溫室效應的氣體中，主要是二氧化碳，其次是氧化亞氮、甲烷和氫氟碳化物，減輕對策有規範廢氣排放量、增加植樹以吸收二氧化碳、停用氟氯碳化物產品等。", "row": 23}, {"id": "中級-023", "level": "中級", "question": "下列何者是二氧化碳所衍生的環境變遷問題？", "options": ["土壤污染", "水庫優養化", "全球暖化", "季風方向改變"], "answer": 2, "explanation": "人為活動排放出的空氣污染物質(如二氧化碳)改變原來自然環境，例如頻繁形成酸雨及嚴重的溫室效應，嚴重溫室效應進而演變成全球暖化的環境問題。", "row": 24}, {"id": "中級-024", "level": "中級", "question": "下列何者是世界各國國際間的合作，來防止全球溫度繼續上升的方法之一?", "options": ["簽署國際環保公約", "利用人為的力量使天空降雨", "一起發展太空科技", "一起簽署經濟貿易協定"], "answer": 0, "explanation": "為了解決全球溫度繼續上升，世界159個締約國及250個NGO於1997年12月1日至10日在日本京都一起簽署京都議定書，為要保護地球，創造永續經營的環境。", "row": 25}, {"id": "中級-025", "level": "中級", "question": "下列何者是可以回收的廢棄物？", "options": ["廢光碟片", "農藥廢容器", "廢行動電話", "以上皆是"], "answer": 3, "explanation": "資源回收可分為物品類(例如：廢鉛蓄電池、廢電子電器、廢照明光源)、容器類(例如：廢紙容器、廢塑膠容器、農藥廢容器)及其他類(例如：廢玻璃類、廢塑膠類、廢光碟片、廢行動電話與充電器)。", "row": 26}, {"id": "中級-026", "level": "中級", "question": "下列何者是目前因全球暖化而產生的國際環保的趨勢？", "options": ["廢棄物可以隨意跨國輸送", "土壤鹽化問題", "重視氣候變遷減緩與調適", "垃圾費隨袋徵收"], "answer": 2, "explanation": "目前國際環保的趨勢是降低碳的排放量、正視全球暖化的問題以及生物多樣性的保育行動，推廣日常生活節能減碳解決暖化問題以及物種消失的困境。", "row": 27}, {"id": "中級-027", "level": "中級", "question": "下列何者是全球暖化帶來的影響？", "options": ["白日增長", "夜晚增長", "夏季增長", "冬季增長"], "answer": 2, "explanation": "由於全球溫度上升，造成夏季高溫日子增長，冬季日子縮短。至於白日與夜晚時間的改變與全球暖化無關。", "row": 28}, {"id": "中級-028", "level": "中級", "question": "下列何者是全球溫度上升對環境造成的影響？", "options": ["冰層增厚", "海平面下降", "植物生長空間改變", "地層下陷"], "answer": 2, "explanation": "全球暖化造成動植物的生長環境改變，若無法適應溫度變化則無法生存；冰河、冰山融化使得海平面上升，陸地面積會縮減；地層下陷主要是超抽地下水造成。", "row": 29}, {"id": "中級-029", "level": "中級", "question": "下列何者是氣候變遷對珊瑚礁生物的影響？", "options": ["疾病蔓延", "增加生物物種", "降低生物活動量", "維持原狀"], "answer": 0, "explanation": "氣候變遷的另一效應是導致珊瑚礁生物的疾病蔓延，自1980年以來，全球珊瑚礁生物的疾病頻頻發生，科學家發現許多怪異的疾病都與氣候變遷有關。", "row": 30}, {"id": "中級-030", "level": "中級", "question": "下列何者是造成大量珊瑚死亡的原因之一？", "options": ["海水溶氧增加", "水中生物大量食用珊瑚", "海水溫度提高", "海水養分提高"], "answer": 2, "explanation": "珊瑚礁白化是珊瑚礁生病的徵兆。其原因包括全球暖化持續不斷、遊客蓄意破壞等，使珊瑚礁生態系造成傷害，而養分適當的提高及溶氧量增加對珊瑚是有正面的影響。", "row": 31}, {"id": "中級-031", "level": "中級", "question": "下列何者是造成河川溫度上升的原因？", "options": ["酸雨", "生物族群增加，影響水溫", "工廠溫水排入", "生物分解能量造成水溫升高"], "answer": 2, "explanation": "污染物藉由降雨方式進入河川、湖泊、水庫及海洋等水體中，酸雨使水質化學特性改變，不致影響溫度變化。工廠排入高溫的水入河川，會使河川溫度升高。\n", "row": 32}, {"id": "中級-032", "level": "中級", "question": "下列何者是造成氣候變化加劇的原因？", "options": ["臭氧層破洞", "沙塵暴", "酸雨", "地球暖化"], "answer": 3, "explanation": "颱風、颶風、龍捲風的威力變強，下雨的強度也變得比以往來得急又快，是由於嚴重的溫室效應引發全球暖化，大氣圈的溫度改變，氣候的變化也變得強烈。", "row": 33}, {"id": "中級-033", "level": "中級", "question": "下列何者是減少全球溫度繼續升高的方法之一？", "options": ["推廣無車日", "鼓勵民眾多在家中吹冷氣", "使用人工造雨", "多吃肉少吃蔬菜"], "answer": 0, "explanation": "減少全球暖化持續升高的方式有鼓勵人民從日常生活中節約能源使用及減少二氧化碳溫室氣體的排放量，減少燃燒化石燃料及電力的使用，鼓勵民眾多使用大眾交通工具，推廣無車日等。", "row": 34}, {"id": "中級-034", "level": "中級", "question": "下列何者是開車省油的好方法？", "options": ["冬天得常注意是否因為天冷而胎壓不足", "天氣很熱，在車上，引擎怠速來吹冷氣", "為了早點到達好省油，頻頻開快車與刹車", "放置大量雜物在車上便於取用，以減少開車"], "answer": 0, "explanation": "汽車的胎壓嚴重影響到汽油的燃燒效率。放雜物在車上，也許方便取用，但事實上很多雜物是一直都不會去用的，所以不會減少開車機率。", "row": 35}, {"id": "中級-035", "level": "中級", "question": "下列何者是溫室效應二氧化碳主要的來源？", "options": ["化石燃料的燃燒", "家畜腸胃發酵", "化肥", "森林"], "answer": 0, "explanation": "溫室氣體中的二氧化碳主要來自於化石燃料的燃燒，例如石油、天然氣和煤等。", "row": 36}, {"id": "中級-036", "level": "中級", "question": "下列何者是溫室效應的正確描述？", "options": ["因火山甦醒噴發所造成", "臭氧層薄化造成", "空氣中懸浮物造成保溫效應", "部分熱量被留在地球表面"], "answer": 3, "explanation": "溫室效應的原理就如同一座種花的溫室，陽光部分的能量會留在大氣圈內維持圈內的溫度，部分會經大氣層反射至外太空。", "row": 37}, {"id": "中級-037", "level": "中級", "question": "下列何者是種樹能減少山崩的理由？", "options": ["增加綠美化", "增加氧氣產生量", "植物可增加抓地力", "用來作為木材"], "answer": 2, "explanation": "因種植樹木具有保安固土、涵養水份的功能，能減少山崩情形。", "row": 38}, {"id": "中級-038", "level": "中級", "question": "下列何者是綠建材的優點？", "options": ["增加化學合成材料", "增加材料生產過程之耗能", "使用自然材料與高揮發性有機物質建材", "材料基本性能及特殊性能經過評估及管制"], "answer": 3, "explanation": "綠建材之優點如下：(1)生態材料：減少化學合成材之生態負荷與能源消耗、(2)可回收性：減少材料生產耗能與資源消耗、(3)健康安全：使用自然材料與低揮發性有機物質建材，可減免化學合成材之危害、(4)材料性能─材料基本性能及特殊性能評估與管制，可確保建材使用階段時之品質。", "row": 39}, {"id": "中級-039", "level": "中級", "question": "下列何者是綠建築的特色？", "options": ["與地球環境共生共存", "綠色外觀以凸顯特色", "會浪費資源", "跳脫地方特色"], "answer": 0, "explanation": "綠建築就是在建築上應用最少地球資源、使用最少能源及製造最少廢棄物的建築物；不僅是指在建築環境上進行植栽綠化，同時強調與地球環境共存的建築環境設計觀；並且著重節能設計、廢棄物減量、營造健康生活的建築物。", "row": 40}, {"id": "中級-040", "level": "中級", "question": "下列何者為《京都議定書》之締約國但未簽署該條約？", "options": ["中國", "日本", "美國", "法國"], "answer": 2, "explanation": "美國作為《京都協議書》的參與國之一，既不簽署該條約也不從條約退出。", "row": 41}, {"id": "中級-041", "level": "中級", "question": "下列何者為雨林減少的主要原因？", "options": ["人為砍伐", "溫室效應", "聖嬰現象", "臭氧層破裂"], "answer": 0, "explanation": "雨林減少的原因包括過度伐木、盜伐、過度放牧、過度耕作、不當焚燒、森林火災、酸雨等等。\n", "row": 42}, {"id": "中級-042", "level": "中級", "question": "下列何者為減少熱島效應最直接也最有效的行為？", "options": ["舖設水泥地", "增加建築面積內的保水性", "廢棄物減量", "建築物二氧化碳減量"], "answer": 1, "explanation": "保水性能的定義，就是建築基地涵養水分及貯集滲透雨水的能力。保水性不佳，土地會失去蒸發水分潛熱的能力，而喪失調節氣候的功能，進而造成熱島效應。", "row": 43}, {"id": "中級-043", "level": "中級", "question": "下列何者為對省水標章之描述？", "options": ["箭頭向上，代表將中心的水滴接起", "右邊三條水帶，代表「愛水、親水、節水」", "藍色代表水質純淨清澈", "以上皆是"], "answer": 3, "explanation": "(1)箭頭向上，代表將中心的水滴接起，強調回歸再利用，提高用水效率。\n(2)右邊三條水帶，代表「愛水、親水、節水」，藉以鼓勵民眾愛護水資源，親近河川、湖泊、水庫，並共同推動節約用水。\n(3)藍色代表水質純淨清澈，得之不易，務當珍惜。\n(4)整體而言，水資源如不虞匱乏，大家皆歡喜，故水滴笑臉迎人。", "row": 44}, {"id": "中級-044", "level": "中級", "question": "下列何者為臺電實施「夏月電價」的時期？", "options": ["1~3月", "4~6月", "6~9月", "10~12月"], "answer": 2, "explanation": "夏月電價(每年6月~9月)較非夏月(每年1~5月及10~12月)電價為高，係為公平合理反映夏月及非夏月間的季節性供電成本差異。所謂的「夏月電價調整」原則，就是調降供電成本較低的「非夏月」(10月-5月)電價，再調升供電成本較高的「夏月」(6月-9月)電價，以維持全年電費收入不變，並藉此激勵全民共同落實節能減碳。", "row": 45}, {"id": "中級-045", "level": "中級", "question": "下列何者對於溫室效應的敘述是正確的？", "options": ["溫室效應是工業革命以後才有的產物", "地球以外的其它行星都沒有溫室效應", "大氣圈的溫度會持續下降", "溫室效應會牽動地球不正常之氣候變遷"], "answer": 3, "explanation": "溫室效應會牽動地球不正常之氣候變遷，已對地球環境產生可預見之衝擊", "row": 46}, {"id": "中級-046", "level": "中級", "question": "下列何者對於綠建築的說明是正確的？", "options": ["主要使用綠色做為粉刷的顏色", "增加水霧設施", "增加房屋周圍的植物種類", "增加照明亮度"], "answer": 2, "explanation": "綠建築是指由建材生產到建築物規劃、設計、施工、使用、管理及拆除之一系列過程，消耗最少地球資源，使用最少能源及製造最少廢棄物的建築物，並種植綠色植物與自然共生共利。\n", "row": 47}, {"id": "中級-047", "level": "中級", "question": "下列何種組合屬於「海洋能」發電？", "options": ["潮汐發電、溫差發電", "溫差發電、汽電共生發電", "洋流發電、燃煤發電", "潮汐發電、燃氣發電"], "answer": 0, "explanation": "海洋能是藉由海洋之物理或化學特性而得到的能源；目前主要的海洋能發電有潮汐發電、溫差發電、洋流發電及波浪發電四種。", "row": 48}, {"id": "中級-048", "level": "中級", "question": "下列何種發電方式主要增加二氧化碳的產生量？", "options": ["風力發電", "太陽能發電", "火力發電", "水力發電"], "answer": 2, "explanation": "火力發電會因燃燒化石燃料而產生二氧化碳造成空氣污染，而風力、太陽能、水力發電均為再生能源，能降低二氧化碳排放量。\n", "row": 49}, {"id": "中級-049", "level": "中級", "question": "下列何種標章制度的推廣，是鼓勵民眾使用高能源效率產品，以減少能源消耗？", "options": ["綠建材", "省水標章", "碳標籤", "節能標章"], "answer": 3, "explanation": "藉由節能標章制度的推廣，鼓勵民眾使用高能源效率產品，以減少能源消耗。", "row": 50}, {"id": "中級-050", "level": "中級", "question": "下列何種購買冷氣的原則，會造成超量的耗電量？", "options": ["買大一號的冷氣機可以達到快速冷房的效果", "使用變頻的冷暖氣機", "先作好外牆的絕熱，與氣流分布的設計", "使用小型的冷氣機，低轉數下，提早運轉也可以舒適一整天"], "answer": 3, "explanation": "臺灣的夏季炎熱，不少電氣行為了賺取績效獎金，大都會勸人購買過大噸數的冷氣機，不但窗臺裝不下，也造成耗電量的增加與損失。", "row": 51}, {"id": "中級-051", "level": "中級", "question": "下列哪一個「不是」對於二氧化硫正確的敘述？", "options": ["與水反應為硫酸鹽", "具刺激臭味", "空氣污染指標之一", "酸雨的主要物質"], "answer": 0, "explanation": "除自然界產生外，一般為燃料中硫份燃燒與空氣中之氧結合者，為一具刺激臭味之無色氣體，易溶於水，與水反應為亞硫酸；於空氣中可氧化成硫酸鹽，為引起酸雨的主要物質。", "row": 52}, {"id": "中級-052", "level": "中級", "question": "下列哪一個吸收二氧化碳的作法，最有效率和符合經濟效益？", "options": ["綠化", "鹼吸收", "製成乾冰", "合成沼氣"], "answer": 0, "explanation": "綠化被公認是吸收二氧化碳最經濟且有效的策略，有減緩地球氣候高溫化的功效。", "row": 53}, {"id": "中級-053", "level": "中級", "question": "下列哪一項對於熱島效應的描述是正確的？", "options": ["多好發在島國地形上", "多好發在都市地區", "多好發在沙漠地區", "多好發在海邊"], "answer": 1, "explanation": "都市因為日照而增加的溫度高過周圍郊區，使得都市像一座熱島的現象。原因有柏油路吸熱、建築物高聳、樹木稀少、空氣污染等等。", "row": 54}, {"id": "中級-054", "level": "中級", "question": "下列哪一種水文現象與全球氣候變遷現象「無關」？", "options": ["全球海平面上升", "下雪的機會不變", "造成全球水文循環改變", "降雨與蒸發散的強度升高"], "answer": 1, "explanation": "全球氣候變遷現象已經明顯發生，主要包括：溫室氣體排放持續增加、大氣組成持續改變、地球升溫、全球氣候運作模式改變、造成全球水文循環改變、降雨與蒸發散的強度升高、下雪的機會變少、造成熱浪發生機會升高，部分地區將變得更乾旱、熱帶氣旋發生的機會升高，全球海平面上升。", "row": 55}, {"id": "中級-055", "level": "中級", "question": "下列哪一種作用或現象發生時，會增加大氣中的溫室氣體？", "options": ["燃燒化石燃料所產生之氣體", "海洋中碳酸鹽類的沉積作用", "植物行光合作用產生之氣體", "水蒸氣凝結為雨滴降落地面"], "answer": 0, "explanation": "燃燒化石燃料會產生二氧化碳與水氣等溫室氣體。", "row": 56}, {"id": "中級-056", "level": "中級", "question": "下列哪一種活動會使大氣的二氧化硫大量增加？", "options": ["火力發電", "飼養豬隻", "燃燒雜草", "種植農作物"], "answer": 0, "explanation": "空氣中的二氧化硫大部分來自於以石油或煤炭為燃料的火力發電廠，一般石油和煤炭中，都含有少量的硫，當這些燃料燃燒時，其中的硫便與空氣中的氧起化學反應，產生二氧化硫。", "row": 57}, {"id": "中級-057", "level": "中級", "question": "下列哪一種氣體排放量的增加會使得地球表面溫度上升？", "options": ["一氧化碳(CO)", "氧氣(O2)", "臭氧(O3)", "二氧化碳(CO2)"], "answer": 3, "explanation": "大氣中重要的溫室氣體包括：二氧化碳(CO2)、甲烷(CH4)、氧化亞氮(N2O)、氫氟碳化物(HFCs)、全氟碳化物(PFCs)及六氟化硫(SF6)，這些氣體都會導致地球溫度上升。\n", "row": 58}, {"id": "中級-058", "level": "中級", "question": "下列哪一種情況不容易讓貯存的水受微生物污染？", "options": ["貯存水的容器開口太大", "貯放的時間太長", "貯放的空氣中灰塵多", "貯存的水置於冰凍或冷藏"], "answer": 3, "explanation": "貯存的水置於冰凍或冷藏，在低溫下水中較不易滋生微生物。", "row": 59}, {"id": "中級-059", "level": "中級", "question": "下列哪一種發電方式最容易造成酸雨的產生？", "options": ["火力", "核能", "太陽能", "水力"], "answer": 0, "explanation": "火力發電燃燒時會排放二氧化硫廢氣，造成空氣污染及酸雨。", "row": 60}, {"id": "中級-060", "level": "中級", "question": "下列哪一種購買行為無法兼顧綠色消費與公平貿易的關係？", "options": ["儘量購買在地的農產品", "設法壓低農民利潤", "購買商品時從農民的利益出發", "多購買有機農產品"], "answer": 1, "explanation": "綠色消費意指「在維持基本生活所需並追求更佳生活品質之同時，降低天然資源與毒性物質之使用及污染物排放，目的在不影響後代子孫權益的消費模式」。", "row": 61}, {"id": "中級-061", "level": "中級", "question": "下列哪一種類型的土壤最為貧瘠？", "options": ["紅土", "黑土", "黃土", "綠土"], "answer": 0, "explanation": "紅色的土壤為已經化育很老(幾十萬年以上)，土壤中僅剩餘氧化鐵、鋁等性質者，土壤肥力很低。如桃園市埔心、南投縣埔里、屏東縣老埤等臺地之紅壤。", "row": 62}, {"id": "中級-062", "level": "中級", "question": "下列哪一類公民素養對保護環境最為重要？", "options": ["公德", "自私", "計較", "易怒"], "answer": 0, "explanation": "做為一個國家的公民，公德心與環境素養最為相關。良好的公民行為可由是否尊重近鄰居住空間的品質、不將垃圾隨意棄置於路邊、不讓廢水未經處理任意排放河川中等。這些行為攸關大家生活的品質與居住空間，端賴彼此相互尊重。", "row": 63}, {"id": "中級-063", "level": "中級", "question": "下列哪一類的山坡地較穩定？", "options": ["坡度較陡處", "板塊邊緣地震頻繁處", "農牧業土地高度利用處", "複層植被處"], "answer": 3, "explanation": "複層植被也就是種植多種植物，如喬木、次喬木、灌木、草與地茵等。對於發育成熟的林相而言，不同層次的樹冠分布還有分層截留雨水的功能，進而穩定山坡地結構。", "row": 64}, {"id": "中級-064", "level": "中級", "question": "下列哪個行動「不能」減緩大氣溫室氣體含量增加？", "options": ["搭乘大眾運輸工具", "採用太陽能發電技能", "於野地大量堆肥以節約資源", "節約用紙以保護森林"], "answer": 2, "explanation": "大量堆肥反而會產生甲烷釋放至大氣中，須有效收集才能達到節約資源的目的。", "row": 65}, {"id": "中級-065", "level": "中級", "question": "下列哪項屬於再生能源？", "options": ["天然氣", "風力", "地熱", "太陽能"], "answer": 0, "explanation": "太陽能、風力、水力、地熱及海洋能等都屬於再生能源。", "row": 66}, {"id": "中級-066", "level": "中級", "question": "下列哪種物質屬於再生能源？", "options": ["風", "煤", "石油", "天然氣"], "answer": 0, "explanation": "煤、石油和天然氣為自然界所蘊藏的資源，稱為自然資源，是非再生的能源。", "row": 67}, {"id": "中級-067", "level": "中級", "question": "下列哪個物質是現代火力發電廠所使用的燃料之一？", "options": ["煤", "鈾-235", "鈷-60", "木材"], "answer": 0, "explanation": "火力發電是燃燒煤、油或天然氣等燃料產生熱能，使水變成水蒸氣，帶動發電機而發電。", "row": 68}, {"id": "中級-068", "level": "中級", "question": "下列哪個政策的制定與溫室效應有關？", "options": ["《蒙特婁議定書》", "《東京高峰會協議》", "《生物安全議定書》", "以上皆非"], "answer": 3, "explanation": "《京都議定書》明定控制人為排放之溫室氣體數量，以期減少溫室效應對全球環境所造成的影響。", "row": 69}, {"id": "中級-069", "level": "中級", "question": "下列哪個國家公園設立之前，曾因戰地政務的考量，在沿海樹林中埋設大量的地雷，阻隔人們進入濱海的沙灘地，使該地意外成為活化石「鱟」理想的產卵地點？", "options": ["金門國家公園", "東沙環礁國家公園", "墾丁國家公園", "臺江國家公園"], "answer": 0, "explanation": "由文中戰地政務、沿海樹林大量放置地雷可知，是金門國家公園的特色。", "row": 70}, {"id": "中級-070", "level": "中級", "question": "下列哪個國際公約是為了減緩全球暖化速度而訂定？", "options": ["《南極公約》", "《京都議定書》", "《蒙特婁議定書》", "《生物多樣性條約》"], "answer": 1, "explanation": "京都議定書明確訂出世界主要工業國家溫室氣體排放量的削減率，要求各國切實執行。", "row": 71}, {"id": "中級-071", "level": "中級", "question": "下列哪個單位是噪音的受害單位也是加害單位？", "options": ["辦公室", "研究室", "圖書館", "學校"], "answer": 3, "explanation": "學校受到校外噪音影響學生學習，但是下課時產生噪音也影響周遭居民的安寧。", "row": 72}, {"id": "中級-072", "level": "中級", "question": "下列哪個選項「不是」光合作用的主要產物？", "options": ["氧氣", "二氧化碳", "葡萄糖", "水"], "answer": 1, "explanation": "所謂的光合作用是指葉綠體中的色素可吸收太陽能，提供能量使根部吸收的水分和經由氣孔進來的二氧化碳合成葡萄糖和水，並釋放出氧氣。", "row": 73}, {"id": "中級-073", "level": "中級", "question": "下列哪個選項「不是」全球暖化所造成的影響？", "options": ["北半球冬季縮短", "島嶼國家陸地面積增加", "特有種因棲息地消失而絕滅", "海水溫度上升"], "answer": 1, "explanation": "全球暖化使大氣層的溫度升高，導致全球氣候型態改變以及冰川融化，並使海平面上升，島嶼國家陸地面積可能因而減少，而赤道附近地區可能因高溫而損害穀類農作物。", "row": 74}, {"id": "中級-074", "level": "中級", "question": "下列哪個選項「不是」使地球表面漸漸趨於平坦的作用力？", "options": ["火山爆發", "風化作用", "侵蝕作用", "沉積作用"], "answer": 0, "explanation": "火山爆發會使地殼隆起。風化、侵蝕與沉積作用會使地球表面漸漸趨於平坦。", "row": 75}, {"id": "中級-075", "level": "中級", "question": "下列哪個選項「不是」空氣污染物？", "options": ["二氧化硫", "懸浮微粒", "氮氧化物", "氮氣"], "answer": 3, "explanation": "氮氣為大氣中含量最多的固定成分，非空氣污染物。", "row": 76}, {"id": "中級-076", "level": "中級", "question": "下列哪個選項「不是」政府決定興建核四廠之前，所需要用來判斷是否適宜設廠的考慮要項？", "options": ["地區經濟效益評估", "地主和廠方的遊說", "專家學者的評估", "生態環境的影響"], "answer": 1, "explanation": "政府決定興建核四廠之前，是否適宜設廠需要考慮地區經濟效益、聘請專家學者評估及對生態環境的影響等要項。", "row": 77}, {"id": "中級-077", "level": "中級", "question": "下列哪個選項「不是」紅樹林的功能？", "options": ["可以過濾水中化學有機廢物、懸浮物", "可以防止沿海地區的地層下陷", "可以提供許多生物繁衍和棲息的環境", "其根部有固土護岸的功能"], "answer": 1, "explanation": "紅樹林具有防風及穩固海岸的功能，可以降低強風對陸地地上生物的直接傷害；提供生物良好的棲息地及沿海魚類資源的食物來源。當人們過度抽取地下水，導致地下水水位降低，原本支撐的地層也就下落，造成「地層下陷」，地層下陷後很難再恢復，以致容易發生海水倒灌淹毀民宅的悲劇。", "row": 78}, {"id": "中級-078", "level": "中級", "question": "下列哪個選項「不是」臭氧層被破壞所導致的結果？", "options": ["皮膚癌患者增加", "農作物減產", "免疫系統受抑制", "氣候更加穩定"], "answer": 3, "explanation": "當臭氧層中的臭氧濃度減少時，地球表面受太陽紫外線照射的強度會增加，對生物有多種危害，使植物生長受阻、海洋中的浮游生物死亡、人的皮膚癌發病率增高等情形發生。", "row": 79}, {"id": "中級-079", "level": "中級", "question": "下列哪個選項「不是」陸域生態系？", "options": ["草原", "森林", "河口", "沙漠"], "answer": 2, "explanation": "河口屬於水域生態系。", "row": 80}, {"id": "中級-080", "level": "中級", "question": "下列哪個選項「不是」華盛頓公約的內容？", "options": ["限制國際間野生動植物的不當交易", "希望達成野生動植物的永續利用", "避免野生動、植物因人類的濫捕及販賣而瀕臨絕種", "使各國在政治、經濟與保育工作上可以互相支援、交流學術研究成果"], "answer": 3, "explanation": "華盛頓公約其主要目的在於管制野生動植物的貿易，因此將物種分級，以防止公約所保護的物種受到非法國際貿易而危害其生存。", "row": 81}, {"id": "中級-081", "level": "中級", "question": "下列哪個選項「不是」解決溫室效應惡化的有效方法？", "options": ["搭乘大眾運輸工具", "減少甲烷排放量", "使用再生能源", "開發熱帶雨林"], "answer": 3, "explanation": "大量燃燒煤和石油、大量開發土地以增加畜牧業等，都會增加溫室氣體的排放，使溫室效應增強而導致地球表面氣溫上升。", "row": 82}, {"id": "中級-082", "level": "中級", "question": "下列哪個選項「不是」臺灣現行的環保法規？", "options": ["野生動物保護法", "水污染防治法", "噪音管制法", "京都議定書"], "answer": 3, "explanation": "《水污染防治法》、《噪音管制法》為行政院環保署所制定，野生動物保護法為行政院農委會制定，以上均為政府為了推動環境保護所制定的相關法律。京都議定書為國際公約，不是臺灣現行的環保法規。", "row": 83}, {"id": "中級-083", "level": "中級", "question": "下列哪個選項「不屬於」石化工業的產品？", "options": ["塑膠", "人造纖維", "玻璃", "黏著劑"], "answer": 2, "explanation": "合成塑膠、塑膠、人造纖維、肥料、清潔劑、殺蟲劑、黏著劑及藥品都屬於石化工業產品；玻璃的主要成分是二氧化矽，不是石化工業的產品。", "row": 84}, {"id": "中級-084", "level": "中級", "question": "下列哪個選項「不屬於」食物中所能提供能量的養分之一？", "options": ["維生素", "蛋白質", "脂類", "醣類"], "answer": 0, "explanation": "食物中能提供給生物能量的養分為醣類、蛋白質與脂類。", "row": 85}, {"id": "中級-085", "level": "中級", "question": "下列哪個選項「不屬於」淡水生態系？", "options": ["池塘生態系", "河口生態系", "溪流生態系", "湖泊生態系"], "answer": 1, "explanation": "淡水生態系包含池塘、溪流與湖泊生態系。", "row": 86}, {"id": "中級-086", "level": "中級", "question": "下列哪個選項「不屬於」細菌外型的分類之一？", "options": ["球狀", "桿狀", "螺旋狀", "橄欖球狀"], "answer": 3, "explanation": "細菌的外型可分成球菌、桿菌、螺旋菌三種。橄欖球狀不屬於細菌的外型分類。", "row": 87}, {"id": "中級-087", "level": "中級", "question": "下列哪個選項可「減緩」大氣層中二氧化碳濃度的增加？", "options": ["火山爆發", "生態保育", "都市化開發", "多用化石燃料"], "answer": 1, "explanation": "火山爆發、都市化開發和使用化石燃料都會增加二氧化碳的濃度。", "row": 88}, {"id": "中級-088", "level": "中級", "question": "下列哪個選項可能是生物之所以會產生多樣性的原因？", "options": ["有性生殖造成生物個體特徵的多樣性", "基因突變", "生活棲息地的不同", "以上皆是"], "answer": 3, "explanation": "生物多樣性主要分為三個層次：基因差異的遺傳多樣性、物種差異的物種多樣性，還有棲息環境差異的生態系多樣性。", "row": 89}, {"id": "中級-089", "level": "中級", "question": "下列哪個選項是「不會」飛行的鳥類？", "options": ["鴕鳥", "蒼鷹", "麻雀", "白頭翁"], "answer": 0, "explanation": "鴕鳥是現存體型最大的鳥類，體重可達一百公斤，不能飛翔，一是因為牠的龐大身軀，二是因為牠的飛翔器官與其他鳥類不同。鳥類的飛翔器官，主要有由前肢變成的翅膀、羽毛等，羽毛中真正有飛翔功能的，是飛羽和尾羽。而鴕鳥的羽毛既無飛羽也無尾羽，已高度退化。", "row": 90}, {"id": "中級-090", "level": "中級", "question": "下列哪個選項是一個氟氯碳化合物CFC分子甚至可使十萬個臭氧分子反應成氧分子之主要原因？", "options": ["一個CFC分子分解一次可產生許多氯原子", "一個CFC分子可與許多個臭氧分子產生反應", "一個CFC分子與一個臭氧分子反應產生許多活性大的氧原子", "一個CFC分子分解產生的氯原子可重複與許多臭氧分子反應"], "answer": 3, "explanation": "在平流層中由於高能輻射線的照射，使CFC分解而釋放出一個氯原子，此氯原子可與臭氧分子反應生成氧分子，已反應的氯原子又可再生，重複與其它臭氧分子反應。經一連串反應後，一個CFC分子甚至可以使十萬個臭氧分子產生反應。", "row": 91}, {"id": "中級-091", "level": "中級", "question": "下列哪個選項是北極永久冰層融化而產生的環境衝擊？", "options": ["地球表面吸收太陽輻射量提高", "海豹與北極熊等極地生物因海洋擴張而更適合生存", "人類可經由東南通道減少航運路程", "海水密度提高造成洋流加劇"], "answer": 0, "explanation": "海豹與北極熊等生物棲息地區縮小。", "row": 92}, {"id": "中級-092", "level": "中級", "question": "下列哪個選項是目前大氣的組成成份？", "options": ["氮氣", "氧氣", "水氣、二氧化碳和臭氧", "以上皆是"], "answer": 3, "explanation": "目前大氣的組成主要為氮氣和氧氣，分別占了78%和21%，以及其它的氣體如水氣、二氧化碳和臭氧等。", "row": 93}, {"id": "中級-093", "level": "中級", "question": "下列哪個選項是地表最主要的地質作用力？", "options": ["冰川", "太陽", "流水", "風"], "answer": 2, "explanation": "流水是地表最主要的侵蝕力。", "row": 94}, {"id": "中級-094", "level": "中級", "question": "下列哪個選項是進行自然保育工作最根本的作法？", "options": ["當經濟利益與生態保育發生衝突時，絕對不開發", "設立國家公園", "教育民眾瞭解眾生平等且互相依賴的關係", "多設立動物園並以人工繁殖野生動物"], "answer": 2, "explanation": "當經濟利益與生態保育發生衝突時，須審慎評估，尋一個折衷方式；設立國家公園與動物園也對自然保育有助益，但最根本的方法是讓全民把保育成為本身的價值觀，這只有教育能做得到。", "row": 95}, {"id": "中級-095", "level": "中級", "question": "下列哪個選項是臺南「臺江國家公園」的地形特色？", "options": ["海埔地", "珊瑚礁", "海蝕平臺", "谷灣"], "answer": 0, "explanation": "臺江國家公園位於臺灣西南沿海，海岸類型屬於「沙岸」，屬海埔地、沙洲與濕地等特殊地形景觀。", "row": 96}, {"id": "中級-096", "level": "中級", "question": "下列哪個選項是臺灣島曾位於海平面之下的證據？", "options": ["恆春半島露出水面的珊瑚礁", "墾丁國家公園的玄武岩地形", "臺東八仙洞內有恐龍化石", "中橫山區常發生土石流"], "answer": 0, "explanation": "玄武岩地形位於澎湖群島；臺灣並沒有恐龍化石；中橫山區常發生土石流，僅可推論該區可能雨量集中，且水土保持不良。", "row": 97}, {"id": "中級-097", "level": "中級", "question": "下列哪個選項是酸雨對環境或生物造成的影響？", "options": ["減緩植物生長", "造成水體優養化", "使南極上空臭氧洞擴大", "造成溫、寒帶的生物棲息地往更高緯度處遷移"], "answer": 0, "explanation": "造成水體優養化是因為水中營養鹽過多所致；使南極上空臭氧洞擴大是使用氟氯碳化物所致；造成溫、寒帶的生物棲息地往更高緯度處遷移是因為全球暖化所致。", "row": 98}, {"id": "中級-098", "level": "中級", "question": "下列哪個選項是導致溫室效應惡化的主因？", "options": ["工廠及汽、機車排放的廢氣", "核能發電的副作用", "冰箱等的冷媒或噴霧劑釋出的氣體", "過度使用清潔劑"], "answer": 0, "explanation": "導致溫室效應最主要是因為廢氣中含有二氧化碳、甲烷等氣體。", "row": 99}, {"id": "中級-099", "level": "中級", "question": "下列哪個選項為爬蟲類之一？", "options": ["麻雀", "彈塗魚", "蜘蛛", "蛇類"], "answer": 3, "explanation": "麻雀屬於鳥類；彈塗魚屬於魚類；蜘蛛屬於節肢動物門蛛形綱。", "row": 100}, {"id": "中級-100", "level": "中級", "question": "下列哪個選項最有可能是近年來全球暖化日益嚴重的主要原因？", "options": ["被大氣吸收的太陽輻射增加，地表大氣中溫室氣體過低", "被大氣反射到太空的太陽輻射增加", "被地表反射到太空的太陽輻射增加", "被大氣吸收的地表輻射增加"], "answer": 3, "explanation": "溫室效應是地表輻射無法散發到太空所造成的。暖化與溫室效應有關，地表大氣中溫室氣體過高，使得地表輻射出的熱能會被溫室氣體吸收而無法散逸到太空中，使得地表溫度增加。", "row": 101}, {"id": "中級-101", "level": "中級", "question": "太陽能屬於幾次能源？", "options": ["一次能源", "二次能源", "三次能源", "四次能源"], "answer": 0, "explanation": "一次能源是指直接取自自然界沒有加工轉換的各種能源，如原媒、天然氣、核能、太陽能等。二次能源是指由一次能源加工轉換後得到的能源產品，如：電器、煤氣、汽油、液態石油氣、酒精等。", "row": 102}, {"id": "中級-102", "level": "中級", "question": "日常耗能以空調與照明用電佔最大比例。一般而言，哪一種燈具的耗電量最高？", "options": ["鎢絲燈泡", "日光燈", "LED燈", "省電燈泡"], "answer": 0, "explanation": "一般的照明節能設計具體來做的話，就是用日光燈代替鎢絲燈泡、鹵素燈，以電子式安定器、高反射塗裝日光燈或複金屬燈、鈉氣燈代替水銀燈。其次，室內可採用高明度的環境顏色，提高照明效果，減少燈具數達到節能的目的。還有，短小的20W日光燈管比40W或60W燈管耗電，可以採用一支40W燈管替代2、3支20W日光燈管。", "row": 103}, {"id": "中級-103", "level": "中級", "question": "以下何者為低碳、低污染之發電方式？", "options": ["地熱發電", "火力發電", "燃煤發電", "燃油發電"], "answer": 0, "explanation": "經濟部表示，示範獎勵辦法將為我國地熱發電事業創造更佳之投資環境，向低碳、潔淨、能源自主之再生能源國家邁進。", "row": 104}, {"id": "中級-104", "level": "中級", "question": "地球上大部分生物所需要的能量，都是由下列何者所供應？", "options": ["煤炭", "石油", "太陽", "綠色植物"], "answer": 2, "explanation": "綠色植物進行光合作用時，會將太陽能轉變並儲存於葡萄糖中，呼吸作用則可以將這些能量由葡萄糖中釋放出來；隨著吃與被吃的食性關係，養分中的能量就可以透過食物鏈在生物間傳遞。", "row": 105}, {"id": "中級-105", "level": "中級", "question": "有關生質能源與化石能源的比較敘述，下列哪個選項是正確的？", "options": ["生質能源形成的速率較化石能源慢", "生質能源是儲存太陽光能而來，化石能源則是儲存地底熱能而得", "生質能源不須加工就可使用，化石能源則須加工才能使用", "化石能源的形成要經過複雜的地質作用；生質能源則將生物廢料轉化為能源"], "answer": 3, "explanation": "化石能源是經長久的地質化學作用形成的，開採耗盡後，短時間內無法由原地繼續供應。相對地生質能源則是將生物或生物廢料，以原始狀態或經加工轉化之後，取來作為能源，這種能源只需要經採收或某些製造的程序，就可供人類使用。", "row": 106}, {"id": "中級-106", "level": "中級", "question": "有關各種發電方式與其特點的敘述，下列哪個選項是「錯誤」的？", "options": ["風力發電-僅有部分地區有足夠風力，且有不穩定現象", "火力發電-以燃燒化石燃料發電", "核能發電-利用核分裂產生的能量發電", "水力發電-利用流速較大的海流發電，會影響海洋生態"], "answer": 3, "explanation": "水力發電是利用水位的落差發電。", "row": 107}, {"id": "中級-107", "level": "中級", "question": "垃圾焚化廠除了可以處理垃圾以外，還可以提供以下何種用途？", "options": ["供水", "發電", "供石油", "淨化水質"], "answer": 1, "explanation": "焚化廠設有餘熱回收發電設施，利用熱交換原理，可以藉垃圾焚化後的廢熱回收鍋爐所產生的大量蒸氣推動汽輪機，連結發電機產生電能，在功能上，垃圾焚化廠除作為資源回收廠使用外，也可視為小型發電廠。", "row": 108}, {"id": "中級-108", "level": "中級", "question": "近年來北極地區冰層面逐漸縮小，其原因為何？", "options": ["全球暖化", "地震", "臭氧層破洞", "土地荒漠化"], "answer": 0, "explanation": "全球暖化將使冰河與兩極冰層融化，並因增溫使海水體積膨脹，海水面將上升並淹沒部分地區。", "row": 109}, {"id": "中級-109", "level": "中級", "question": "造成全球暖化的氣體中，最主要的是哪一種氣體？", "options": ["二氧化碳", "一氧化氮", "二氧化硫", "乙烷"], "answer": 0, "explanation": "工業革命以來，化石燃料燃燒，雨林的衰退使得二氧化碳在大氣圈的比例越來越高，陽光的紅外線能量被大量的二氧化碳吸收，嚴重的溫室效應變成全球暖化。", "row": 110}, {"id": "中級-110", "level": "中級", "question": "該選用貼有哪一種標章的電器用品較省能？", "options": ["減碳標章", "節能標章", "優良農產品標章", "環保標章"], "answer": 1, "explanation": "節能標章倡導國人響應節能從生活中的點滴做起。原料採取、產品製造、應用過程及使用後之再生利用，對地球環境負荷最小、對人類身體健康無害之材料像利用光電玻璃、太陽能板等材料達到節能減碳。", "row": 111}, {"id": "中級-111", "level": "中級", "question": "臺灣使用多種發電方式，以確保供電的穩定性，其中哪些發電方式主要仰賴進口的能源來運作？", "options": ["水力發電和火力發電", "水力發電和核能發電", "火力發電和核能發電", "火力發電和風力發電"], "answer": 2, "explanation": "只有水力發電和風力發電不需進口能源，火力發電的化石燃料及核能發電的核燃料均須靠進口。", "row": 112}, {"id": "中級-112", "level": "中級", "question": "餐飲業要配合推動綠色產業，使用下列哪一種材料較「不恰當」？", "options": ["當季食材", "進口材料", "在地食材", "蔬果輕食"], "answer": 1, "explanation": "進口食材須耗費運送過程所產生的碳量不符合綠色產業。", "row": 113}, {"id": "中級-113", "level": "中級", "question": "請問狹義的綠色能源，其定義為下列何者？", "options": ["會散發綠光的能源", "對環境友善的再生能源", "對環境完全無汙染的能源", "並不包含生質能"], "answer": 1, "explanation": "綠色能源，又稱潔淨能源，其定義有狹義與廣義之分。狹義的綠色能源是指對環境友善的再生能源，包含了太陽能、風能、地熱能、水力能、生質能、氫能及海洋能等；而廣義的綠色能源則是指在能源的生產及消費的過程中，選用對生態環境低污染的能源，如水、天然氣、淨煤及核能等。", "row": 114}, {"id": "中級-114", "level": "中級", "question": "關於造成熱島效應的原因，下列敘述何者正確？", "options": ["建造綠建築", "酸雨問題", "使用過多太陽能發電", "建造過多水泥大廈"], "answer": 3, "explanation": "熱島效應為城市人口過度集中，無節制使用冷氣，大量建造水泥大廈，柏油和水泥把地面包得密不透氣，滿街都是排放廢氣的汽機車。這些污染和廢熱，使氣流自然形成一頂看不見的圓拱形帷幕，籠罩在城市上方，結果城市就像一座發熱的小島，暴雨，閃電，滯留不去的污染物，整個居住環境為之惡化。", "row": 115}, {"id": "中級-115", "level": "中級", "question": "世界各國為了減緩氣候變遷，想出各種不同因應方法，但下列哪一種作法，反而可能使土地大量開發，造成糧食不足？", "options": ["風力發電", "發展生質能源", "太陽能發電", "發展地熱能源"], "answer": 1, "explanation": "而各國為了減緩氣候變遷，而大量發展生質燃料或造林的政策，反而加諸泥炭濕地、原始林地與草生地等棲地強大壓力，也將使碳匯能力大打折扣，這點有賴聯合國REDD規範〈減少毀林及森林退化造成的溫室氣體排放〉未來能訂定出明確的遊戲規則，落實生態保育。", "row": 116}, {"id": "中級-116", "level": "中級", "question": "電源、愛心雙手、生生不息的火苗，所組成的標誌，是指以下哪一個標章？", "options": ["綠建築標章", "美國能源之星", "節能標章", "環保標章"], "answer": 2, "explanation": "電源、愛心雙手、生生不息的火苗，所組成的標誌，就是節能標章。心形及手的圖案意指用心節約、實踐省油省氣省電；紅色火苗代表可燃油氣；電源插座代表生活用電，倡導國人響應節能從生活中的點滴做起。產品貼上這個圖樣，代表能源效率比國家認證標準高10至50%，不僅品質有保障，更省能省錢。希望藉由節能標章制度的推廣，鼓勵民眾使用高能源效率產品，以減少能源消耗。", "row": 117}, {"id": "中級-117", "level": "中級", "question": "請問節能標章產品是認可的第幾類環保產品？", "options": ["第一類", "第二類", "第三類", "第四類"], "answer": 2, "explanation": "第三類產品：指該產品經相關事業主管機關認定為符合「增加社會利益或減少社會成本」之產品，並發給證明文件者。\n節能標章產品屬於第三類產品。", "row": 118}, {"id": "中級-118", "level": "中級", "question": "環保餐館業星級評核內容及說明，下列何者正確？", "options": ["省「水」之星：廢水、雨水回收再利用。", "減「廢」之星：減少廢氣排放", "「購」安星：花費較高金額", "守「法」之星：有條件提供免洗餐具"], "answer": 0, "explanation": "環保餐館業星級評核內容及說明\n1.省「水」之星：.廢水、雨水回收再利用等。\n2.減「廢」之星：落實廚餘回收再利用、落實垃圾分類等。\n3.「購」安星：實施綠色採購，並購買具有環保標章、省水標章、節能標章、綠建材標章或碳標籤之綠色商品等。\n4.守「法」之心：遵守空氣污染防制、噪音污染防制、餐飲廢水污水處理、廢棄物清理、室內空氣品質、環境衛生用藥及病媒防治、食品衛生、購物用塑膠袋及塑膠類（含保麗龍）免洗餐具限制使用政策等相關法規規定，1年內未遭環保局及衛生局開立罰單，並於3年內未爆發食品中毒或污染之情事。", "row": 119}, {"id": "中級-119", "level": "中級", "question": "環保餐館業在環境面的活動效益，以下何者正確？", "options": ["獲得業者綠色消費回饋", "大量且免費的媒體宣傳", "使用的產品能資源回收再利用", "無酬提供相關環保標章輔導"], "answer": 2, "explanation": "環境面的活動效益：\n1.節能、省水。\n2.減少食材浪費。\n3.一次性廢棄物減量。\n4.可回收資源再利用。\n5.降低污染源。", "row": 120}, {"id": "中級-120", "level": "中級", "question": "「在維持基本生活所需，並追求更佳生活品質之同時，降低天然資源與毒性物質之使用及污染物排放，目的在不影響後代子孫權益的消費模式。」是何種消費模式？", "options": ["綠色消費", "經濟消費", "本地消費", "刺激消費"], "answer": 0, "explanation": "綠色消費意指「在維持基本生活所需，並追求更佳生活品質之同時，降低天然資源與毒性物質之使用及污染物排放，目的在不影響後代子孫權益的消費模式」。綠色消費涵蓋食衣住行娛樂等各個層面，而綠色採購是落實綠色消費的最佳途徑；採購回收材料製造之物品，優先考量環境面之採購行為，亦即採購之產品對環境及人類健康有最小的傷害性。", "row": 121}, {"id": "中級-121", "level": "中級", "question": "政府透過「環境標誌與宣告」讓消費者能選擇有利環境的產品，以下敘述何者正確？", "options": ["綠色商品須透過外包裝標示詳盡解說，才能吸引民眾採購", "商品標示環保標章可視為一種廣告行為，藉以爭取消費者認同", "使用環保法規限制消費者須購買環保產品", "使用有環保標章的冷氣機就可以放心一直吹冷氣"], "answer": 1, "explanation": "「環境標誌與宣告」利用簡單且明確的說明、符號或圖形，將產品或服務的環保特性表達出來，當採購者瞭解其說明或標誌之意涵，便較易做出對環境有利之購買決策，也就是採購環保產品。因而「環境標誌與宣告」可視為一種廣告的行為，藉由爭取消費者之認同，引發其採購較環保的產品，達到環保目的，而它也是推廣綠色消費運動的一種重要方式。", "row": 122}, {"id": "中級-122", "level": "中級", "question": "以下有關綠色商品的描述，何者正確？", "options": ["原料的取得即使是高污染，但產品可回收即可", "產品在使用時需有低污染、省資源的特性", "只要產品的製造節省資源就好", "只要產品廢棄時可回收就好"], "answer": 1, "explanation": "所謂綠色商品是指產品在原料的取得、產品的製造、銷售、使用及廢棄處理過程中，具有可回收、低污染、省資源等功能或理念，並經政府驗證通過取得環保標章、節能標章、省水標章、綠建材標章及第二類環境保護證明書之產品或服務。", "row": 123}, {"id": "中級-123", "level": "中級", "question": "在政府推行節能減碳以及近年電價上漲後，民眾紛紛使用省電家電，下列何者為較環保之省電燈具？", "options": ["LED燈泡", "鎢絲燈泡（白熾燈）", "鹵素燈泡", "霓虹燈"], "answer": 0, "explanation": "LED燈泡是目前最新、最環保光源，比鎢絲燈泡省約90％電力，連續使用可以長達約4年，而且使用上沒有高溫高熱的問題，但目前不容易普及的原因就是製作成本相當昂貴，所以在售價上也昂貴許多。", "row": 124}, {"id": "中級-124", "level": "中級", "question": "關於食物里程指的是？", "options": ["生產點送到消費者手上，所需運輸的距離", "消費者從店家購買到家，所需花費的距離", "產地賣到店家所需運輸的距離", "消費者購買到吃下去，所需的距離"], "answer": 0, "explanation": "食物里程是指食物由生產點送到消費者手上或消費者的餐桌上，需要運輸的距離。要計算一件食品的食物里程一點也不容易，特別是加工食品，它不但包括食品由產地運到香港的距離，也包括食品在生產過程中，每種成份及包裝材料等運輸距離的總和。", "row": 125}, {"id": "中級-125", "level": "中級", "question": "關於綠色飲食中提到的「地產地消」概念，可帶來那些好處？", "options": ["增加進口產量", "增加食物衛生安全性", "增加食物運輸里程", "受國際政經影響"], "answer": 1, "explanation": "「地產地消」的具體好處如：選擇當地食材避免多重風險，減少運輸里程並增加食物安全性。", "row": 126}, {"id": "中級-126", "level": "中級", "question": "目前倡導的低碳烹調，下列觀念何者正確？", "options": ["使用電力加熱比瓦斯加熱更有效率", "多用調味品可減少碳排量", "選擇熱傳導效率較高的鍋具", "多使用加工食品當配料烹調"], "answer": 2, "explanation": "低碳飲食是以碳足跡的角度來檢視食物的生命週期所產生的溫室氣體排放，其中包含了食物的採購與烹調。採購上應選用在地與當季食材，並少選購加工食品；在烹調上應考慮烹調的方式，如使用熱傳導較高的鍋具，減少能源耗損，且用瓦斯比電力加熱效率更高。另外，少用油、鹽、糖等調味料與加工品，不僅健康也可減少碳排放量。", "row": 127}, {"id": "中級-127", "level": "中級", "question": "於低碳飲食中，選擇當季食材可減少排碳量的原因為何？", "options": ["當季食材符合作物生長週期可減少農藥使用", "當季食材無蟲害不需農藥，故減少碳排放", "當季食材通常含碳比例較低", "當季食材通常不能運很遠販售"], "answer": 0, "explanation": "低碳飲食是以碳足跡的角度來檢視食物的生命週期所產生的溫室氣體排放。低碳飲食應選購當季食材，因其符合蔬果生長季節，不需額外添加肥料與農藥，進而減少食材生產過程中的碳排放量。", "row": 128}, {"id": "中級-128", "level": "中級", "question": "試問下列何者敍述為外來種「福壽螺」的特性？", "options": ["與當地原生螺類共存", "會吃掉大量的水中植物", "為北美洲淡水蝸牛", "為農作物益蟲"], "answer": 1, "explanation": "外來種－福壽螺，原為南美洲淡水蝸牛，會吃掉大量的水中植物，與當地原生螺類等水生動物互相競爭是主要的農作物害蟲。\n", "row": 129}, {"id": "中級-129", "level": "中級", "question": "有著植物殺手之稱的「小花蔓澤蘭」危害其他植物的原因為何？", "options": ["攀上樹木就會纏繞全株，阻礙植物光合作用", "生長速度慢，但會纏繞其他植物", "本身有毒液會釋放給其他植物", "可有無繁殖長出種子附在其他植物上"], "answer": 0, "explanation": "小花蔓澤蘭藉由阻斷陽光、覆蓋壓制、競爭水（養）份及釋放化學物質等方式，抑制其他植物的生長。", "row": 130}, {"id": "中級-130", "level": "中級", "question": "2014年發生的廢豬油事件，為何不肖業者會將將廢油摻入精煉過程中，賣給消費者？", "options": ["增加食物色澤", "成本較低", "使產量增加", "味道聞起來較佳"], "answer": 1, "explanation": "劣質豬油就是以使用過的廢油，經加熱、再製成劣質豬油，其中所含的細菌大部分會被高溫殺死，但油品中的總極性物質將會增加。劣質豬油價錢便宜，餐飲或食品加工業者貪小便宜，就很有機會用到這種問題叢生的油品。", "row": 131}, {"id": "中級-131", "level": "中級", "question": "下列哪一個日期為我國環境教育法公布日期？", "options": ["民國99年4月2日", "民國99年6月5日", "民國100年4月2日", "民國100年6月5日"], "answer": 1, "explanation": "環境教育法（99.06.05.制定）\n【法規沿革】 中華民國九十九年六月五日總統華總一義字第09900137311號令制定公布 全文二十六條；並自公布後一年施行。", "row": 132}, {"id": "中高級-001", "level": "中高級", "question": "「某溫室氣體多屬天然排放，自然界的生物厭氧腐解作用時會排放，如水體流動性不高之湖泊、濕地等均有較高貢獻」，以上描述是指下列何種氣體？", "options": ["二氧化碳", "甲烷", "氧化亞氮", "氫氟碳化物"], "answer": 1, "explanation": "甲烷(CH4)多屬天然排放，自然界的生物厭氧腐解作用本會有CH4之排放，如水體流動性不高之湖泊、濕地等均有較高貢獻。而人為活動造成的CH4排放因素則有自然水體受生活污水及工業廢水的污染、農業畜牧活動及工業製造程序等。", "row": 2}, {"id": "中高級-002", "level": "中高級", "question": "2009年哥本哈根氣候會議，對2012年《京都議定書》到期後的減緩目標，並無一致共識，僅通過無法律約束力的哥本哈根協議(CopenhagenAccord)，以下哪一項目「不是」協議的主要內容？", "options": ["控制全球升溫在2℃內", "所有國家都必須採取行動對抗氣候變遷", "提供即時與長期的財務援助", "必須在5年內，盡力將協議轉化為具法律約束力的協約"], "answer": 3, "explanation": "《哥本哈根協議》主要內容包括：控制全球升溫在2℃內，所有國家必須採取行動對抗氣候變遷，並提供即時與長期的財務援助，幫助高脆弱度且最可能受氣候變遷衝擊危害的國家進行調適與減緩，也必須在2年內盡力將哥本哈根協議轉化為具法律約束力的協約。", "row": 3}, {"id": "中高級-003", "level": "中高級", "question": "2010年某報紙刊登北極熊捕食小北極熊的畫面，此現象與下列何種情形「無關」？", "options": ["人類大量砍伐熱帶雨林", "汽、機車數量快速增加，使用燃料增多", "空氣中硫化物和氮化物增多", "火力發電廠排放的廢氣"], "answer": 2, "explanation": "極地浮冰量減少與溫室效應有關。人類大量砍伐熱帶雨林、汽車與機車數量快速增加，使用燃料增多、火力發電廠排放的廢氣皆與溫室效應相關。空氣中硫化物和氮化物增多，是導致酸雨的原因之一。", "row": 4}, {"id": "中高級-004", "level": "中高級", "question": "人類面臨全球暖化的危機，下列何者是民眾可以從生活中降低二氧化碳的排放量？", "options": ["多乘大眾運輸工具", "多開小汽車", "多使用冷氣", "多買包裝華麗的東西"], "answer": 0, "explanation": "政府一直積極推行節能減碳，包括鼓勵民眾搭乘大眾運輸工具、購買具有節能產品、落實教育宣導、推行低碳旅遊等等。", "row": 5}, {"id": "中高級-005", "level": "中高級", "question": "下列何者「不是」《京都議定書》所管制之氣體？", "options": ["二氧化碳", "甲烷", "臭氧", "氧化亞氮"], "answer": 2, "explanation": "《京都協議書》所管制的溫室氣體包括六種：二氧化碳、甲烷、氧化亞氮、氟化烴、全氟化碳、六氟化硫。", "row": 6}, {"id": "中高級-006", "level": "中高級", "question": "下列何者「不是」構成水足跡的三元素之一？", "options": ["綠色水足跡", "藍色水足跡", "灰色水足跡", "白色水足跡"], "answer": 3, "explanation": "水足跡的計算，由三個部分組成，分別是綠色水足跡、藍色水足跡、及灰色水足跡。其中，綠色水足跡代表商品生產過程中產生的蒸散量，藍色水足跡則代表消耗的地表水或地下淡水量，灰色水足跡則指稀釋生產中製造污染至標準水質所需要的用水量。三者加總即為水足跡。", "row": 7}, {"id": "中高級-007", "level": "中高級", "question": "下列何者「不屬於」計算水足跡的三個部分組成？", "options": ["綠色的水足跡", "藍色的水足跡", "灰色的水足跡", "白色的水足跡"], "answer": 3, "explanation": "在計算水足跡由三個部分組成：綠，藍，灰水足跡。綠色的水足跡：是使用雨水及雨水儲存在土壤中的水分；藍色的水足跡：是使用地表水和地下水；灰色的水足跡：是生產排放的污水稀釋到環境水質標準。", "row": 8}, {"id": "中高級-008", "level": "中高級", "question": "下列何者「無法」兼顧綠色消費與公平貿易的關係?", "options": ["購買有機農產品", "購買在地農產品", "壓低農民利潤", "從農民的利益出發"], "answer": 2, "explanation": "綠色消費意指「在維持基本生活所需並追求更佳生活品質之同時，降低天然資源與毒性物質之使用及污染物排放，目的在不影響後代子孫權益的消費模式」。其涵蓋食衣住行娛樂等各個層面，而綠色採購是落實綠色消費的最佳工具；採購回收材料製造之物品，優先考量環境面之採購行為，亦即採購之產品對環境及人類健康有最小的傷害性。", "row": 9}, {"id": "中高級-009", "level": "中高級", "question": "下列何者列入我國再生能源奬勵的項目？", "options": ["太陽能", "潮汐發電", "地熱發電", "以上皆是"], "answer": 3, "explanation": "我國再生能源獎勵對象為建築整合之太陽光電系統(BIPV)及海洋能發電系統。在海洋能發電設備部分，海洋溫差、鹽差、波浪、洋流或潮汐發電均可提出申請，總裝置容量在5瓦以上，每瓦獎勵金額以25萬元為上限，但超過100瓦部分，每瓦以15萬元為上限。", "row": 10}, {"id": "中高級-010", "level": "中高級", "question": "下列何者是目前造成全球海洋環境產生變化的主因？", "options": ["全球溫度下降", "魚貝種類增加", "陽光強度劇烈變化", "人類的活動影響"], "answer": 3, "explanation": "幾乎每一處海洋都受人為活動影響，目前只有極地偏僻的冰原地帶，還算保持著原始狀態，但也正面臨冰棚融化的威脅。", "row": 11}, {"id": "中高級-011", "level": "中高級", "question": "下列何者是全球暖化所導致的現象？", "options": ["沿海低窪地區被淹沒", "地震頻繁", "板塊運動", "海平面下降"], "answer": 0, "explanation": "全球溫度上升使得極地冰原融化、海平面上升，淹沒低窪之沿海陵地，衝擊低地國家及沿海地區居民。\n", "row": 12}, {"id": "中高級-012", "level": "中高級", "question": "下列何者是因為全球暖化使得海水溫度上升所帶來的影響？", "options": ["珊瑚白化", "產生酸雨", "產生煙霧", "臭氧層稀薄"], "answer": 0, "explanation": "全球暖化導致海水表溫升高，引起珊瑚白化，當海水表面溫度上升超過季節最高溫攝氏1度以上時，會造成珊瑚白化現象。", "row": 13}, {"id": "中高級-013", "level": "中高級", "question": "下列何者是地球溫度上升帶來的現象？", "options": ["減緩海平面下降的速度", "形成更強烈颶風、颱風及熱帶旋風", "加速地下水受污染的範圍", "加速動植物種類繁衍速度"], "answer": 1, "explanation": "全球氣候變暖帶來的災害有：熱浪侵襲、冰川消融、海平面上升、陸地減少、洪水氾濫、生物銳減、颶風、乾旱等等。", "row": 14}, {"id": "中高級-014", "level": "中高級", "question": "下列何者是氣候變遷發生的主因？", "options": ["溫室效應", "藤原效應", "熱島效應", "衝擊效應"], "answer": 0, "explanation": "根據德州農業機械大學海洋學系的ThomasJ.Crowley在289期的Science(科學)期刊上發表的論文指出，自然的變化只在全球暖化中扮演次要的角色，人類活動產生的溫室氣體才是主因。", "row": 15}, {"id": "中高級-015", "level": "中高級", "question": "下列何者為「無碳」能源？", "options": ["僅產生少量二氧化碳的能源", "即是化石燃料", "利用二氧化碳產生能源", "沒有碳原子參與的能源"], "answer": 3, "explanation": "無碳能源像是透過風力、水力或太陽能發電，整個過程中沒有碳原子的參與，自然就沒有二氧化碳的排放。", "row": 16}, {"id": "中高級-016", "level": "中高級", "question": "下列何種反應會產生甲烷物質？", "options": ["光合作用", "氧化作用", "硝化作用", "厭氧作用"], "answer": 3, "explanation": "有機物於厭氧條件在酸形成菌作用下產生有機酸及硫化氫、二氧化碳等，接著在甲烷形菌作用反應產生甲烷及二氧化碳。", "row": 17}, {"id": "中高級-017", "level": "中高級", "question": "下列何種方式可改善交通運輸工具所產生的二氧化碳排放量？", "options": ["減少自行開車的頻率", "改裝汽機車，增加效能", "買外國進口的汽車", "用含鉛汽油"], "answer": 0, "explanation": "二氧化碳的產生來自於石油燃燒後的產物，要減少二氧化碳的排放量就要減少自行開車的頻率，多使用大眾交通運輸，短程距離以步行或騎自行車代替，汽車可改用電力發動車子或油電混合車子等等，以減少對石油的使用量。\n", "row": 18}, {"id": "中高級-018", "level": "中高級", "question": "下列何種方式可避免熱島效應的產生？", "options": ["選用可回收產品", "增加綠樹及綠地面積", "多塗防曬油", "長時間使用冷氣機"], "answer": 1, "explanation": "減少熱島效應的方法有：植樹、採用高反射能素材、確保風的流通性、減低建築物(如冷氣)的人工排熱、分散市區人口至郊區以減低人工排熱、合理地規劃城市、選用節能減碳產品等等。", "row": 19}, {"id": "中高級-019", "level": "中高級", "question": "下列何種方式在校園內可以節省能源？", "options": ["多乘電梯，少走樓梯", "裝設自動感應照明", "空調設定於20~23度", "共乘計程車"], "answer": 1, "explanation": "裝設自動感應照明可減少使用的電量，還有開窗通風取代冷氣、白天無人時避免開燈、隨手關燈關水、低樓層多走樓梯不搭電梯及電梯共乘等等。\n", "row": 20}, {"id": "中高級-020", "level": "中高級", "question": "下列何種行為稱得上是節能減碳？", "options": ["腳踏車作為代步工具", "購買更換率高的產品", "多搭乘電梯", "室外溫度達到25度就開冷氣"], "answer": 0, "explanation": "節能減碳就是節約能源、提升能源效率及推廣再生能源同時減少二氧化碳排放量。", "row": 21}, {"id": "中高級-021", "level": "中高級", "question": "下列哪一種方法能夠在不影響生活的狀況下，輕鬆達到節能50-60%的效果？", "options": ["換LED電燈", "提高居家環境的生物多樣性", "增加庭園的綠地覆蓋率", "增設綠屋頂和外殼絕緣"], "answer": 3, "explanation": "外殼節能可輕鬆達到50-60%的效率。對於空調設備系統設計，同時厲行防止冰水主機超量設計的機制，可節省30%。對於照明設計，強制要求採用高效率燈具設計，節約20%。", "row": 22}, {"id": "中高級-022", "level": "中高級", "question": "下列哪一種行為或產品使用，需要考慮太陽的方位或仰角？", "options": ["裝設太陽能板", "裝設太陽能路燈", "種植植物", "以上皆是"], "answer": 3, "explanation": "裝設太陽能板、裝設太陽能路燈以及種植植物，皆需要考慮太陽的方位或仰角才能利用陽光。", "row": 23}, {"id": "中高級-023", "level": "中高級", "question": "下列哪一種行為能夠減少溫室氣體排放？", "options": ["挖掘更多的化石能源", "提高能源效率", "發展生質能源", "發展火力和核能發電"], "answer": 1, "explanation": "氣候變遷帶來的考驗將越來越嚴峻，面對來自全球的挑戰，臺灣正處於發展轉捩點上，同時加強與國際間合作，進行減碳政策、技術與經驗交流，並推動碳市場之國際接軌。任何能源的開發或者挖掘都會造成溫室氣體的排放；而提高能源效率則能夠有效減低能源的使用，減少溫室氣體排放。", "row": 24}, {"id": "中高級-024", "level": "中高級", "question": "下列哪一種作法「不符合」房屋的照明節能？", "options": ["選購燈具時，以低價為選購的主要考量", "居室應保有充足的開窗面，以利自然採光", "使用壽命較長的節能燈具", "室內採用明亮的設計，以提高照明效果"], "answer": 0, "explanation": "建築的日常耗能中以空調及照明用電佔了最大比例，照明用電比高達三至四成。建築物的使用壽命長，其節能的累積效果遠勝於其他工業產品。照明節能重點：建築室內牆面及天花板採用明亮設計、採用高效率燈具、儘量採自然採光設計及利用自動晝光節約照明控制系統。", "row": 25}, {"id": "中高級-025", "level": "中高級", "question": "下列哪個「不是」購車時選擇節能車輛的考量？", "options": ["車身流線型", "能源效率比(EER)越低越好", "低排氣量", "淺色系的車輛"], "answer": 1, "explanation": "購車時考量能源效率比(EER)，EER越高，車子越節能。選購車身流線型，車體較輕、低排氣量，淺色系的車輛，且選擇適當的隔熱紙，可減輕車輛空調負荷。", "row": 26}, {"id": "中高級-026", "level": "中高級", "question": "下列哪個選項為人類雨水收集保存的方式？", "options": ["排水溝", "游泳池", "河川", "地表面或礫石地面"], "answer": 3, "explanation": "雨水貯集是一種能夠收集且保存雨水的技術，人們使用簡單的方法，利用屋頂、地表面或礫石地面，再以工程技術製作的容器來貯水。而藉著降雨時間及空間的變異來收集雨水，已有超過4,000年的歷史。而游泳池不是收集保存雨水的方式之一。", "row": 27}, {"id": "中高級-027", "level": "中高級", "question": "下列哪個選項「不是」大氣中二氧化碳逐年增加之原因？", "options": ["海域的污染導致珊瑚大量死亡", "森林遭大量砍伐", "化石燃料的大量燃燒", "臭氧層的破壞"], "answer": 3, "explanation": "臭氧層的破壞會造成紫外線進入地球的濃度增加，和二氧化碳無直接關係。", "row": 28}, {"id": "中高級-028", "level": "中高級", "question": "下列哪個選項「不是」作為生質能源的燃料？", "options": ["酒精", "煤", "藻類", "牛隻排泄物"], "answer": 1, "explanation": "煤不是生質能源。煤是碳氫化合物經過地殼隔絕空氣的壓力和溫度條件下作用，產生的碳化化石礦物，主要被人類開採用作燃料。", "row": 29}, {"id": "中高級-029", "level": "中高級", "question": "下列哪個選項「不屬於」再生能源？", "options": ["太陽能", "石油", "風力", "生質能源"], "answer": 1, "explanation": "再生能源為來自大自然的能源，例如太陽能、風力、潮汐能、地熱等，是取之不盡，用之不竭的能源，相對於會窮盡的石化能源的一種能源。", "row": 30}, {"id": "中高級-030", "level": "中高級", "question": "下列哪個選項不是造成全球海平面上升的原因？", "options": ["海水因增溫而體積膨脹", "南北極冰帽及高山冰川消融", "北極海附近海面浮冰消融", "陸地水域、植被和土壤水減少"], "answer": 2, "explanation": "北極海附近的浮冰因體積已包含在水體之內，因此海上浮冰若融化並不影響海平面上升。", "row": 31}, {"id": "中高級-031", "level": "中高級", "question": "下列哪個選項屬於可再生的資源？", "options": ["太陽能", "煤", "天然氣", "礦物"], "answer": 0, "explanation": "可再生資源分成兩類，第一類如水力、風、潮汐、地熱和太陽能等，基本上可供人類永遠使用，沒有枯竭之虞。第二類如動物和植物資源，它們能夠生長繁殖，其更新速度與自身的繁殖能力、外界的環境有關。", "row": 32}, {"id": "中高級-032", "level": "中高級", "question": "下列哪種能源的產生方法符合節能減碳？", "options": ["燃煤發電", "火力發電", "風力發電", "柴油發電"], "answer": 2, "explanation": "風力發電不需耗費燃料，因此不會產生灰渣等廢棄物，最大的好處是不會排出二氧化碳。", "row": 33}, {"id": "中高級-033", "level": "中高級", "question": "下列敘述何者「錯誤」？", "options": ["溫室效應的氣體中，最主要的是二氧化碳", "溫室氣體污染物來源主要是畜牧業", "正常情況下水蒸氣才是地球上最重要之溫室效應氣體", "溫室效應會使全球氣溫節節上升"], "answer": 1, "explanation": "造成溫室效應的氣體中，最主要的是二氧化碳，其次是氧化亞氮、甲烷和氟氯碳化物及臭氧，這些污染物主要是燃燒石化原料(例如：煤、石油)所產生的。\n", "row": 34}, {"id": "中高級-034", "level": "中高級", "question": "中國大陸北方燃燒煤炭，隨著東北季風飄到臺灣，主要造成下列哪種污染？", "options": ["溫室效應", "熱島效應", "海水升溫", "酸雨"], "answer": 3, "explanation": "臺灣酸雨的分布，以臺灣西北部和宜蘭較嚴重，宜蘭太平山翠峰湖已經是酸化的湖泊，而陽明山國家公園的夢幻湖也已經達到酸化的邊緣，臺灣東部和澎湖則比較少酸雨的現象。以季節來說，大部分地區冬季是全年酸雨最嚴重的月份。所以，在這個季節，雨天外出時，一定要記得使用雨具。", "row": 35}, {"id": "中高級-035", "level": "中高級", "question": "以下各種再生能源，哪一項必須仰賴足夠的陽光才能穩定地供電，否則就得靠電池將電力貯存？", "options": ["生質酒精", "水力發電", "太陽能發電", "風力發電"], "answer": 2, "explanation": "再生能源中，只有生質能可以像石油一樣，貯存起來，以後或任何時間再使用。其他都得仰賴電池，而電池的效率又無法很高，造成供電的不穩定。", "row": 36}, {"id": "中高級-036", "level": "中高級", "question": "以下各種再生能源，哪一項較符合低碳的精神，在發電或作為能源時最會產生額外的能源耗損？", "options": ["生質酒精", "水力發電", "太陽能發電", "風力發電"], "answer": 0, "explanation": "生質酒精以微生物方法產生的酒精濃度較低，而酒精又溶於水中，必須仰賴蒸餾的方式來提煉，十分浪費能源。", "row": 37}, {"id": "中高級-037", "level": "中高級", "question": "由廢食用油、大豆、向日葵及油菜等能源作物提煉的生質柴油屬於生質能源的一種，下列哪個選項為其優點？", "options": ["不會排放二氧化碳", "生物可分解", "低毒性", "提高油耗"], "answer": 1, "explanation": "生質柴油燃燒仍會排放二氧化碳，但無毒性且可降低油耗。", "row": 38}, {"id": "中高級-038", "level": "中高級", "question": "再生能源除太陽能和風力能之外還包括哪些？", "options": ["生質能", "水力能", "海洋能", "以上皆是"], "answer": 3, "explanation": "再生能源：指太陽能、生質能、地熱能、海洋能、風力、非抽蓄式水力、國內一般廢棄物與一般事業廢棄物等直接利用或經處理所產生之能源，或其他經中央主管機關認定可永續利用之能源。", "row": 39}, {"id": "中高級-039", "level": "中高級", "question": "冰河消融線是指冰雪累積與融化的分界位置，且該分界會隨氣溫變化而位移。不考慮高度差異下，下列關於消融線的敘述，哪個選項較為合理？", "options": ["夏天時，冰河消融線會往冰河下游位移", "低緯區的冰河消融線位置，通常會較高緯區高", "乾燥區的冰河消融線位置，通常會較溼潤區低", "工業革命以來，冰河消融線位置大致呈現前進現象"], "answer": 1, "explanation": "夏天時因溫度升高造成冰雪融化，該線會往上游位移；根據降水量來比較，溼潤區會較低才對；工業革命以來，因二氧化碳排放量增加，造成溫室效應明顯，消融線呈現後退。", "row": 40}, {"id": "中高級-040", "level": "中高級", "question": "在全球暖化的危機中，臺灣民眾可以採取下列哪些正面的行動？", "options": ["響應節能減碳", "多消費拼經濟", "到國外避難", "多打掃房屋"], "answer": 0, "explanation": "針對全球暖化的危機，民眾可以在生活中開始落實行動，包括響應政府的節能減碳活動、減少砍伐樹木、增加種樹、做好災害防範以及成為綠色消費者等。", "row": 41}, {"id": "中高級-041", "level": "中高級", "question": "旨在減少溫室氣體排放量的《京都議定書》已於2005年2月16日生效，根據議定書內容，各國應該如何應變？", "options": ["減少冷煤使用", "減少二氧化碳排放量", "減少臭氧排放", "減少核能發電，改以火力發電"], "answer": 1, "explanation": "二氧化碳為造成溫室效應的主要氣體，故京都議定書規範人為排放溫室氣體的數量，以減少對環境的影響，由於二氧化碳的排放量最多，所以京都議定書主要是希望能減少二氧化碳的排放量。", "row": 42}, {"id": "中高級-042", "level": "中高級", "question": "有關人類發展生質能源的原因，下列哪個敘述「錯誤」？", "options": ["化石燃料即將用盡", "避免地球暖化加劇", "玉米產能過剩", "減少二氧化碳排放"], "answer": 2, "explanation": "若利用玉米為生質能源會造成糧價上升。", "row": 43}, {"id": "中高級-043", "level": "中高級", "question": "有關生質能源和化石燃料的敘述，下列哪個選項正確？", "options": ["生質能源較化石燃料易被分解，污染較少", "全面使用生質能源的好處多於壞處", "生質能源和化石燃料皆屬於可再生資源", "燃燒生質能源仍會產生二氧化碳，無助於二氧化碳所造成的溫室效應"], "answer": 0, "explanation": "生質能源仍有造成糧價上漲、生態平衡被破壞的疑慮；而化石燃料不屬於可再生能源；生質能源的淨碳排放為零。", "row": 44}, {"id": "中高級-044", "level": "中高級", "question": "有關生質能源的敘述，下列哪個選項「錯誤」？", "options": ["已應用於垃圾焚化發電", "已應用於沼氣發電", "生質能不包含牲畜糞便、農作物殘渣等使用", "非再生能源"], "answer": 3, "explanation": "生質能源屬於再生能源。", "row": 45}, {"id": "中高級-045", "level": "中高級", "question": "有關生質能源的敘述，下列哪個選項正確？", "options": ["生質能源泛指由生物產生的有機物質，包括化石燃料", "生質作物能轉換成可利用的能源，如生質柴油", "垃圾掩埋場的沼氣不屬於這種能源", "工業有機廢棄物無法當作生質能源"], "answer": 1, "explanation": "化石燃料不屬於生質能源；垃圾掩埋場的沼氣屬於生質能源；工業有機廢棄物也為生質能源的一種。", "row": 46}, {"id": "中高級-046", "level": "中高級", "question": "有關全球暖化的敘述，下列何者正確？", "options": ["地表溫度升高對空氣中水氣含量沒有影響", "二氧化碳(CO2)、甲烷(CH4)、氧化亞氮(N2O)、全氟碳化物(PFCs)、氫氟碳化物(HFCs)，以及六氟化硫(SF6)等是溫室氣體", "全球暖化是防災不須重視的課題之一", "全球暖化只造成地球平均氣溫的增加，不會引起其它效應"], "answer": 1, "explanation": "溫室效應自古就存在，它讓地球溫暖，適合動植物生存。但工業革命後，人為排放太多溫室氣體，使過多的熱留在地球，過度的溫室氣體使全球溫度異常變化，可能導致許多災害。", "row": 47}, {"id": "中高級-047", "level": "中高級", "question": "低碳生活中所要減的「碳」，指的是來自千萬年前物質。下列何者是前述說明所指的「碳」來源？", "options": ["生質酒精", "生質柴油", "石油和煤", "核電"], "answer": 2, "explanation": "石油和煤來自千萬年前捕獲的太陽能後死亡的生物；而生質柴油及酒精都是現代的植物或藻類提煉而成的。", "row": 48}, {"id": "中高級-048", "level": "中高級", "question": "何者「不是」綠色工廠標章的清潔生產範疇？", "options": ["辦公室", "機臺設備", "公用設備", "生產原物料之設備"], "answer": 0, "explanation": "本項指標評估工廠登記範疇內，於前3年度間任意2年度或24個月，生產產品過程所消耗之原物料總量，包括用於產品生產之原物料、機臺設備／公用設備／管末處理設備之使用及維護保養所需之耗材等，皆需納入評估。但用於非生產製造場地之原物料，如辦公室、餐廳、宿舍等，可不納入評估。", "row": 49}, {"id": "中高級-049", "level": "中高級", "question": "冷氣溫度設定範圍以攝氏(℃)幾度間為宜？", "options": ["20-22℃", "22-24℃", "24-26℃", "26-28℃"], "answer": 3, "explanation": "冷氣溫度設定範圍以26-28℃為宜，並應裝設自動溫控設備，以免過冷而浪費能源。對於經常進出的房間，室內溫度不要低於室外溫度5℃以上，以免影響身體健康。", "row": 50}, {"id": "中高級-050", "level": "中高級", "question": "冷氣機的能源效率比值，一般稱什麼？", "options": ["EF", "EA", "EER", "EIA"], "answer": 2, "explanation": "能源效率比值，俗稱EER值，EER＝冷房能力/消耗電力，冷房能力：冷氣機運轉一小時，可從室內移走的最大熱量，單位為kcal/hr、Btu/hr或kW；消耗電力：冷氣機額定運轉時，所需的電力，單位為W(瓦)或kW(千瓦)。EER值每提高0.1，可節省約4%的電力。", "row": 51}, {"id": "中高級-051", "level": "中高級", "question": "冷氣應控温於26~28℃，既能使人感到涼爽也有助於減碳。當我們調高冷氣溫度設定值1℃時，可節省多少的冷氣用電？", "options": ["1％", "6%", "25%", "40%"], "answer": 1, "explanation": "使用冷空調設備時，應維持室內溫度在以26~28℃為宜，每調高溫度設定值1℃，約可節省冷氣用電6%。", "row": 52}, {"id": "中高級-052", "level": "中高級", "question": "我國《公害糾紛處理法》中所謂的「公害」，是指因下列何種因素所造成生存環境的破壞？", "options": ["天然因素", "人為因素", "經濟因素", "政治因素"], "answer": 1, "explanation": "依照《公害糾紛處理法》第一章第二條說明，所謂的公害，是指因人為因素，導致破壞生存環境，而損害國民健康或有危害之虞者。", "row": 53}, {"id": "中高級-053", "level": "中高級", "question": "我國2012年訂定「國家氣候變遷調適政策綱領」的原因與社會有關的是以下何者？", "options": ["健全與提升社會的富裕度", "建立整合性的社會福利運作機制", "降低社會脆弱度", "作為島嶼老年化社會因應策略"], "answer": 2, "explanation": "氣候變遷已經在發生，但在時間與空間上具有高度不確定性，我國不得不在未知之中進行能讓風險最小化的決策，以健全與提升國家調適能力，降低社會脆弱度，並建立整合性的運作機制，以作為政策架構與計畫推動的實施基礎。", "row": 54}, {"id": "中高級-054", "level": "中高級", "question": "我國火力電廠燃燒產生的顆粒狀污染物（懸浮微粒），通常如何處理？", "options": ["可直接排出", "利用靜電集塵器去除，其排氣符合環保法規", "因環保法規未有限制，所以自訂標準處理", "用大量水直接沖洗後再排氣"], "answer": 1, "explanation": "臺電公司在空間許可的電廠裝設最先進的空氣污染防治設備如：靜電集塵器、脫硝、煙氣除硫等設備處理，使污染物排放降至最低，並符合環保法規。", "row": 55}, {"id": "中高級-055", "level": "中高級", "question": "我國包裝飲用水的相關管理法規，下列何者敘述正確？", "options": ["製造過程之水質查驗依《飲用水管理條例》規定", "包裝過程之衛生依《飲用水管理條例》規定", "水源之水質管理依《飲用水管理條例》規定", "包裝之標示依《飲用水管理條例》規定"], "answer": 2, "explanation": "飲用水管理條例第二十八條明定，供販賣之包裝或盛裝之飲用水，其水源之水質管理，依本條例之規定\n；其容器、包裝與製造過程之衛生、標示、廣告及水質之查驗，依食品衛\n生管理法之規定。", "row": 56}, {"id": "中高級-056", "level": "中高級", "question": "我國的溫室氣體減量目標是「全國二氧化碳排放減量，於哪一年要回到2005年排放量」？", "options": ["2013年", "2015年", "2020年", "2025年"], "answer": 2, "explanation": "臺灣身為地球村的一員，為因應全球氣候變遷及國內外之能源環保情勢日益嚴峻，行政院於97年第3095次院會通過之「永續能源政策綱領」宣告溫室氣體減量目標：「全國二氧化碳排放減量，於2020年回到2005年排放量，於2025年回到2000年排放量」。", "row": 57}, {"id": "中高級-057", "level": "中高級", "question": "我國政府在再生能源之規劃，以下何者「錯誤」？", "options": ["鼔勵沼氣發電", "鼔勵小型風力發電", "日本福島核災後已停止地熱發電奬勵", "規劃打造陽光屋頂百萬座"], "answer": 2, "explanation": "為鼓勵再生能源多元化發展，經濟部能源局擬訂沼氣發電、小型風力發電、地熱發電等的示範獎勵辦法，鼓勵各界踴躍投入利用更廣泛的再生能源資源。日本福島核災後，積極檢討國內擴大再生能源推廣的可行性，目前選定沼氣發電、小型風力發電、地熱發電等項目。", "row": 58}, {"id": "中高級-058", "level": "中高級", "question": "我國發電量由再生能源提供之比例為何？", "options": ["2.6%", "15%", "48%", "80%"], "answer": 0, "explanation": "依臺電公司公布民國100年發電量由高至低如下：燃煤40.3%、燃氣29.3%、核能19.0%、汽電共生4.3%、燃油3.2%、再生能源2.6%、抽蓄1.5%。", "row": 59}, {"id": "中高級-059", "level": "中高級", "question": "使用生質能源可以降低二氧化碳的排放量，其主要原因為何？", "options": ["使用生質能源不會排放二氧化碳", "使用生質能源所排放的二氧化碳遠少於一般的化石燃料", "使用生質能源排放的二氧化碳是現代植物光合作用所固定的二氧化碳", "生質能源的熱效應高於一般的化石燃料，因此使用量少，進而達到節能減碳的目標"], "answer": 2, "explanation": "化石燃料中的碳是古代生物所固定的，故燃燒化石燃料會將古代的二氧化碳排放到現代的空氣中，而生質能源來自現今生物所固定的二氧化碳。", "row": 60}, {"id": "中高級-060", "level": "中高級", "question": "炎炎夏日該如何使用冷氣較為恰當？", "options": ["打開冷氣，使室內溫度維持在22. 8度C", "打開冷氣，使室內溫度維持在16度C", "打開冷氣，使室內溫度維持在30度C", "打開冷氣，使室內溫度維持在26~28度C且配合電扇"], "answer": 3, "explanation": "根據經濟部能源局資料顯示，若要使用冷氣，請將室內溫度維持在26-28℃為宜，再配合電扇一起使用，效果絕佳。", "row": 61}, {"id": "中高級-061", "level": "中高級", "question": "建設多少仟瓦以上風力發電系統才需考量風速條件？", "options": ["200", "300", "400", "500"], "answer": 3, "explanation": "需考量500kW以上風機應參考當地風速資料，年滿發電時數建議至少需達2,000小時以上。", "row": 62}, {"id": "中高級-062", "level": "中高級", "question": "建築的耗能很大，若可以延長房子的壽命，則可以大幅減低二氧化碳的排放。下列何種作法能夠延長房屋的壽命和可維修性？", "options": ["安裝太陽能裝置", "興建可以絕熱保水的綠屋頂", "以綠屋頂取代防水層分離", "將水電管路等進行明管化設計"], "answer": 3, "explanation": "因為設備管路的壽命只有15年左右，而建築體可長達80年．更換個3─5次是必要的。將過去多埋於RC樓板內的管路明管化，拆換時才不會傷到結構。", "row": 63}, {"id": "中高級-063", "level": "中高級", "question": "建築的耗能很大，若可以延長房子的壽命，則可以大幅減低二氧化碳的排放。下列哪一項「不是」延長壽命耐久性的作法？", "options": ["只要單純地加強結構強度便易達成，提升結構強度20%則可延長壽命一倍", "增加1cmRC保護層厚度，可提升壽命十年", "耐震度設計提升到一級以上，酌量提高柱樑及樓板的RC保護層厚度", "在屋頂興建可以絕熱保水的綠屋頂"], "answer": 3, "explanation": "歐美房子的壽命在80年以上，英國更是百年以上．而臺灣是35至40年之間．若能耐久，則可減少其生命週期的二氧化碳排放密度。", "row": 64}, {"id": "中高級-064", "level": "中高級", "question": "建築節能設計中，哪一項的節能成效較大？", "options": ["外殼節能", "建築物外的綠化與保水", "空調節能", "照明節能"], "answer": 0, "explanation": "外殼節能可輕鬆達到50-60%的效率。對於空調設備系統設計，同時厲行防止冰水主機超量設計的機制，可節省30%。對於照明設計，強制要求採用高效率燈具設計，節約20%。", "row": 65}, {"id": "中高級-065", "level": "中高級", "question": "若未來生質能源取代化石燃料，可能產生的問題中，下列哪個選項「錯誤」？", "options": ["溫室效應現象消失", "森林面積減少", "生態失衡", "糧食作物價格上漲"], "answer": 0, "explanation": "大量種植能源作物，可能使物種單一化，造成生態失衡。", "row": 66}, {"id": "中高級-066", "level": "中高級", "question": "高雄都會公園原為垃圾掩埋場，經過改建後設置沼氣發電。是屬於下列哪一種能源之應用？", "options": ["太陽能", "化石能源", "生質能源", "核能"], "answer": 2, "explanation": "垃圾掩埋場產生的沼氣屬於生質能源。", "row": 67}, {"id": "中高級-067", "level": "中高級", "question": "將葵花油製成生質柴油，屬於下列何種能源類型？", "options": ["非再生能源", "回收能源", "生質能源", "太陽能"], "answer": 2, "explanation": "葵花油製成生質柴油是屬於生質能源類型。", "row": 68}, {"id": "中高級-068", "level": "中高級", "question": "通常地表氣溫和海拔高度呈現反比的關係，但有時在地表會有逆溫現象，亦即氣溫隨高度增加而升高。此現象最易發生在冬季晴朗無風的夜晚。為何「晴朗無風」有助於逆溫的形成？", "options": ["增加吸熱", "使氣壓降低", "有助分子熱量輻射", "有助地表大氣熱量累積"], "answer": 3, "explanation": "「晴朗無風」表示無熱對流，從地表散失的熱到空氣中，空氣分子單靠輻射熱量散失不易，會使熱量累積在地表大氣形成逆溫。", "row": 69}, {"id": "中高級-069", "level": "中高級", "question": "通常地表氣溫和海拔高度呈現反比的關係，但有時地表會有逆溫現象。下列哪一個現象的氣壓狀況和逆溫的情形相似？", "options": ["全球暖化", "鋒面籠罩", "颶風來襲", "都市熱島"], "answer": 3, "explanation": "都市熱島效應是地表散失的熱量累積在地表，造成局部地區氣溫較高，在高氣壓籠罩時容易發生；全球暖化特別是指靠近地表面或是海表面的全球平均氣溫隨著時間逐漸升高的現象； 鋒面籠罩與颶風來襲都是在低氣壓時發生。", "row": 70}, {"id": "中高級-070", "level": "中高級", "question": "溫室效應是因空氣中哪一個污染物過多所造成？", "options": ["二氧化硫", "二氧化氮", "二氧化碳", "一氧化碳"], "answer": 2, "explanation": "自從歐洲工業革命以來，人類的工業活動大量使用化石燃料(煤、石油)，燃燒化石燃料所產生的物質是空氣污染最主要的來源，因為燃燒所產生的二氧化碳若是過多，會引起溫室效應。", "row": 71}, {"id": "中高級-071", "level": "中高級", "question": "溫室效應除了二氧化碳之外，也發現下列何種氣體亦可加速全球暖化？", "options": ["氧氣(O2)", "一氧化碳(CO)", "甲烷(CH4)", "氫氣(H)"], "answer": 2, "explanation": "大氣中重要的溫室氣體包括：二氧化碳(CO2)、甲烷(CH4)、氧化亞氮(N2O)、氫氟碳化物(HFCs)、全氟碳化物(PFCs)及六氟化硫(SF6)。", "row": 72}, {"id": "中高級-072", "level": "中高級", "question": "溫室效應與下列哪個選項最相關？", "options": ["二氧化碳，宇宙射線", "二氧化碳，紅外線", "二氧化碳，紫外線", "二氧化氮，紅外線"], "answer": 1, "explanation": "二氧化碳可吸收紅外線中的熱量。", "row": 73}, {"id": "中高級-073", "level": "中高級", "question": "溫室氣體會造成地球暖化效應，其關鍵原因為何？", "options": ["溫室氣體具有毒性", "溫室氣體溫度較高", "溫室氣體會吸收水蒸氣", "溫室氣體可吸收地球長波輻射"], "answer": 3, "explanation": "大氣中可吸收地球長波輻射的氣體，稱為溫室氣體，其濃度增加時，會降低地表向太空的輻射率，減少熱量逸散至太空促使低層大氣和地表溫度升高。常見的溫室氣體種類包括有：二氧化碳、甲烷、氧化亞氮、氫氟碳化物、全氟碳化物、六氟化硫、水蒸氣及臭氧等。", "row": 74}, {"id": "中高級-074", "level": "中高級", "question": "溫度上升會衝擊森林的生物多樣性，下列何者敘述「不正確」？", "options": ["暖化可能導致中海拔溫帶針葉林分布向下推移", "暖溫帶雨林群系的變動幅度最大", "冷溫帶與亞高山針葉林群系僅能零星分布在海拔極高的山區
