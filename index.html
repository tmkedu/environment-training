", "高海拔溫帶針葉林分布向上推移、面積因而縮減"], "answer": 0, "explanation": "暖化可能導致中高海拔溫帶針葉林分布向上推移，分布的面積因而縮減；其中以暖溫帶雨林群系的變動幅度最大，其分布將局限在目前垂直分布的上限；冷溫帶與亞高山針葉林群系則僅能零星分布在海拔極高的山區。", "row": 75}, {"id": "中高級-075", "level": "中高級", "question": "溫度會影響下列哪一種水的物理性質？(A)密度(B)黏度(C)蒸氣壓(D)表面張力。", "options": ["ABC", "BCD", "ABCD", "ABD"], "answer": 2, "explanation": "水溫會影響水的密度、黏度、蒸氣壓、表面張力等物理性質，在化學方面亦可影響化學反應速率及氣體溶解度等，在生物方面則可能影響微生物的活性及其代謝速率等。", "row": 76}, {"id": "中高級-076", "level": "中高級", "question": "碳足跡是指產品或服務之生命週期過程中，何種污染物之排放總和？", "options": ["溫室氣體", "廢棄物", "廢水污染量", "以上皆是"], "answer": 0, "explanation": "碳足跡之意義是指產品或服務於生命週期過程，包括原料階段，製造階段，使用階段，運輸階段及廢棄處理階段，所有直接與間接之溫室氣體總和(包括京都議定書規範六種溫室氣體及《蒙特婁議定書》所規範之溫室氣體)。", "row": 77}, {"id": "中高級-077", "level": "中高級", "question": "隨著自然環境的改變與人為土地利用的不當，中國沙漠化問題日益嚴重，其所引起的沙塵暴，甚至威脅到中國首都北京，故如何對抗沙漠化已成為中國近年西部大開發政策中，不可忽略的議題。中國成為全球沙漠化最嚴重的地區與哪種土地利用「不當」有關？", "options": ["石油開採造成環境污染", "牧業用地改為工廠或建築用地", "游牧改為定牧或農耕", "傳統游牧活動飼養多樣的牲畜"], "answer": 2, "explanation": "中國近年來積極改善游牧民族的生活，挖掘深水井等措施鼓勵定居、半定居的形式，許多游牧民族改為定牧或農耕，對當地脆弱的生態環境造成威脅，造成沙漠化擴張迅速。", "row": 78}, {"id": "中高級-078", "level": "中高級", "question": "隨著西北航道海冰的融化，阿拉斯加的生態系統可能出現下列哪種變化？", "options": ["國王企鵝的數量減少", "北極熊的生物群落增加", "小麥種植的面積增加", "落葉灌木林的面積增加"], "answer": 3, "explanation": "國王企鵝多分布於南極洲；海冰融化將威脅北極熊的生存環境；阿拉斯加州目前尚無小麥的栽培；海冰融化，氣候變暖，將增加落葉灌木林的生長面積。", "row": 79}, {"id": "中高級-079", "level": "中高級", "question": "聯合國氣候變化綱要公約(UNFCCC)是在哪一次聯合國重要會議時簽訂的？", "options": ["1992年在巴西里約召開的地球高峰會", "2002年在南非召開的地球高峰會", "2012年在巴西里約召開的地球高峰會", "1997年日本京都會議"], "answer": 0, "explanation": "1992年在巴西里約召開的地球高峰會，促使全球154個國家代表共同簽署「聯合國氣候變化綱要公約(UNFCCC)。", "row": 80}, {"id": "中高級-080", "level": "中高級", "question": "購買日光燈應選擇哪一種安定器較省電？", "options": ["傳統式", "電子式", "電磁式", "以上皆是"], "answer": 1, "explanation": "安定器本身，一般來說，預熱型電子安定器壽命約在50,000小時左右，其溫度約低(電子零件廢熱越少)，則壽命可以延長。若以此壽命計算50,000~100,000小時計算，大約用了2~5支燈管，一天使用8小時，則可使用17~34年，非常環保。安定器加上燈管成本1000NT左右而已。使用一對二或一對三安定器則更低。", "row": 81}, {"id": "中高級-081", "level": "中高級", "question": "避免熱島效應的產生，民眾消費方式可以做什麼改變？", "options": ["購買具有節能標章的冷氣", "購買二手電器用品", "購買二手車", "購買回收紙產品"], "answer": 0, "explanation": "減少熱島效應的方法有很多例如：植樹、確保風的流通性、減低建築物(如冷氣)的人工排熱、選用節能減碳產品等等。\n", "row": 82}, {"id": "中高級-082", "level": "中高級", "question": "關於《京都協議書》的敘述，何者正確？", "options": ["發起國家為美國，簽署地點在日本京都", "是繼哥本哈根協議後的第一個碳交易管制文書", "臺灣也是簽署國家之一", "可分為京都機制與自願減碳系統兩大類機制"], "answer": 1, "explanation": "《京都協議書》是繼哥本哈根協議後的第一個碳交易管制，臺灣並未簽屬。", "row": 83}, {"id": "中高級-083", "level": "中高級", "question": "關於「減少」電器使用時數的原因，下列哪個選項正確？", "options": ["延長電器使用壽命", "減少二氧化碳的排放", "省錢", "以上皆是"], "answer": 3, "explanation": "減少電器使用時數，不只可以省錢、延長電器使用壽命，最主要的原因是因為可以減少二氧化碳的排放，降低溫室效應的發生。", "row": 84}, {"id": "中高級-084", "level": "中高級", "question": "關於「溫室效應」的敘述，下列哪個選項最正確？", "options": ["從太陽輻射的紫外線被二氧化碳吸收", "從太陽輻射的紅外線被一氧化碳吸收", "從地面輻射的紅外線被二氧化碳吸收", "從地面輻射的紫外線被二氧化碳吸收"], "answer": 2, "explanation": "溫室氣體指的是可以通過太陽的輻射能量，並吸收地面反射紅外線的放射熱，使得地球表面的溫度上升的氣體，如二氧化碳、甲烷、氟化氫類等。大氣中的二氧化碳可以吸收從地表輻射出的紅外線，再從大氣輻射回地面的效應稱為溫室效應。溫室效應導致全球暖化；全球暖化意思是全球表面溫度上升、溫室氣體不斷產生，加速溫室效應。", "row": 85}, {"id": "中高級-085", "level": "中高級", "question": "關於「廢照明光源回收」，下列敘述何者正確？", "options": ["可避免環境污染", "可當成玻璃回收", "直接用塑膠袋裝著即可", "破損時會產生甲醛"], "answer": 0, "explanation": "燈管(泡)不是玻璃，應將廢燈管(泡)與廢玻璃類分開回收及貯存。且回收應以紙箱裝載或多層包裝，避免其破損造成汞蒸氣及螢光粉外洩。", "row": 86}, {"id": "中高級-086", "level": "中高級", "question": "根據聯合國氣候變遷委員會統計，何種產業會消耗全球40%的能源，並排放約36%的二氧化碳？", "options": ["建築", "石化", "餐飲", "鋼鐵"], "answer": 0, "explanation": "建築相關產業消耗全球40%的能源，並排放約36%的二氧化碳，其中住宅類建築佔去能源消耗比例的1/3。目前歐盟、美國與日本都將建築業列入低碳經濟，是促進節能和克服金融危機的重點實施項目。", "row": 87}, {"id": "中高級-087", "level": "中高級", "question": "綠建築為包含廢棄物減量、室內空氣品質等考量，雖然初期經費可能較高，但有下列哪一項優點？", "options": ["可以種滿植物，故視覺較佳", "能夠跟上國際潮流", "能夠申請節能標章", "環保節能、永續發展"], "answer": 3, "explanation": "「綠建築」並非在建築環境上植栽綠化，而是從地球環保角度，以全面化、系統化的 環保設計作為訴求的永續建築設計理念。「綠建築」必須以人類生活的健康、舒適為原點，任何生態環保設計，如違反人類生存便失去意義。因此，從積極面觀點，可將「綠建築」定義為：以人類的健康舒適為基礎，追求與地球環境共生共榮及人類生活環境永續發展的建築設計。", "row": 88}, {"id": "中高級-088", "level": "中高級", "question": "我國推動的能源四法，不包括以下何者？", "options": ["能源管理法", "再生能源發展條例", "溫室氣體減量法草案", "石油管理法"], "answer": 3, "explanation": "能源（減碳）四法，包含「能源管理法」、「再生能源發展條例」、「溫室氣體減量法」（草案）及「能源稅條例」（草案），健全我國節能減碳法制基礎。", "row": 89}, {"id": "中高級-089", "level": "中高級", "question": "聯合國氣候變遷專家小組指出，2050年前需減少多少百分比的二氧化碳排放量，以控制全球暖化？", "options": ["5-20%", "20-30%", "30-50%", "50-85%"], "answer": 3, "explanation": "二氧化碳是最主要的人為溫室氣體。全球大氣中，二氧化碳(CO2)濃度已自工業革命前約280ppm增至2005年的379ppm。而聯合國氣候變遷專家小組(IPCC)第4份報告也指出2050年前需減少 50%-85%二氧化碳排放，以控制全球暖化。", "row": 90}, {"id": "中高級-090", "level": "中高級", "question": "氣候變遷直接影響降雨，以下何者為全球性的變化趨勢？", "options": ["常下雨的地區發生洪水的風險增加", "不常下雨的地區增加降雨量", "常下雨的地區，每日降雨量更加平均", "常下雨的地區，降雨量將會大量減少"], "answer": 0, "explanation": "氣候變化直接影響降水量、降水強度、頻率和型態。全球平均降雨量無法跟平均溫度一樣，歸納出一個全球性的長期變化趨勢，但可以發現，氣候變遷使得常下雨的地區發生洪水的風險增加，不常下雨地區則是乾旱發生的風險會增加。", "row": 91}, {"id": "中高級-091", "level": "中高級", "question": "全球氣溫暖化，加速南、北極冰山的急速溶解，然而冰山溶解除造成海平面上升外，也會帶來什麼影響？", "options": ["沒有其他影響", "珊瑚越來越多", "海水溫度上升", "地下水淡化"], "answer": 2, "explanation": "少了冰山的反射，太陽輻射熱能直接由海洋吸收，造成海洋溫度上升。", "row": 92}, {"id": "中高級-092", "level": "中高級", "question": "以下何者是美國為減緩日趨嚴重的溫室效應現象，由美國環保署與能源部共同合作推動的計畫？", "options": ["綠建築標章", "碳足跡標籤", "節能標章", "能源之星"], "answer": 3, "explanation": "能源之星計劃於1992年由美國環保署所啟動，目的是降低能源消耗及減少發電廠所排放的溫室效應氣體。此計劃並不具強迫性，自發配合此計劃的廠商可以在其合格產品上貼上能源之星的標籤。最早配合此計劃的產品主要是電腦等資訊電器，之後逐漸延伸到電機、辦公室設備、照明、家電等等。", "row": 93}, {"id": "中高級-093", "level": "中高級", "question": "請問下列哪一項物品最可能貼有「節能標章」？", "options": ["省水率可達10-50%的馬桶", "省水率可達10-20%的馬桶", "能源效率比國家認證標準高10-50%的吹風機", "能源效率比業界標準高10-20%的吹風機"], "answer": 2, "explanation": "節能標章是一項節能、環保的新概念，經濟部能委會為肯定產品之省能技術，遂以市場誘因導向機制，激勵廠商投入高能源效率產品的開發；藉由「節能標章」的認證申請及推動，鼓勵廠商提供省能源、高效率的產品，作為消費者購買時優先選購對象，家電產品貼上這個圖樣，代表其能源效率比國家認證標準高10-50％，不僅兼顧品質，更能節約耗電。", "row": 94}, {"id": "中高級-094", "level": "中高級", "question": "我國推廣省水標章的主管機關是下列何者？", "options": ["各縣市環境保護局", "內政部", "行政院環境保護署", "經濟部水利署"], "answer": 3, "explanation": "經濟部水利署（前水資源局）為鼓勵消費者選用省水產品，推動節水器材的使用與研發，於民國87年1月頒訂＜省水標章作業要點＞，全力推動省水標章制度，並由工研院能資所節水服務團設立「節水實驗室」，進行各項產品檢測，以提供消費者以易於辨示省水產品之標誌。", "row": 95}, {"id": "中高級-095", "level": "中高級", "question": "家中若用有省水標章的洗衣機，下列有關省水標章洗衣機之敘述何者正確？", "options": ["漩渦式的洗衣機，洗淨每公斤衣物耗水量不得大於50公升", "滾筒式的洗衣機，洗淨比可達0.8以上", "各式產品均須符合CNS 3765-7國家標準之規定", "同一系列產品如外觀顏色不同，需另外申請標章"], "answer": 2, "explanation": "漩渦式與攪拌式產品，洗淨比達0.8以上，洗淨每公斤衣物之耗水量不得大於20公升（含）。滾筒式產品，洗淨比達0.6以上，洗淨每公斤衣物所耗水量不得大於13公升（含）。各式產品均須符合CNS 3765-7國家標準之規定，滾筒式產品另須符合CNS 3765-11國家標準之規定。若產品僅外觀、顏色等差異而不影響省水功能及品質者，經提供產品差異分析，視為同一系列產品。產品之適用條件、適用場所及使用限制，須於使用說明書或包裝上清楚註明。", "row": 96}, {"id": "中高級-096", "level": "中高級", "question": "「綠色商店」在引進商品時，可檢視商品是否有以下哪個標誌？", "options": ["碳標籤", "MIT標章", "無障礙標章", "安全蔬果標章"], "answer": 0, "explanation": "綠色商店在引進商品時應檢視該商品是否取得碳標籤、環保標章、節能標章、省水標章、綠建材標章，且注意其證書有效期限，並隨時更新綠色生活資訊網登錄資訊，確保正確性。", "row": 97}, {"id": "中高級-097", "level": "中高級", "question": "環保署為協助民間企業響應綠色消費，擬訂許多輔導措施，以下何者為是？", "options": ["只要產品廢棄時可回收就好", "訂定員工綠色消費教育訓練計畫", "企業發展綠色有機產品之未來規劃", "將國外綠色商品引進國內之做法"], "answer": 1, "explanation": "綠色採購及綠色消費為企業推動永續發展所不可或缺之核心價值。環保署為協助民間企業及其所屬員工響應綠色消費政策，擬協助企業輔導下列事項：訂綠色採購及員工綠色消費教育訓練計畫、瞭解禁用物質對企業產品之影響、企業綠色經營策略的導入、預期目標及動機、綠色供應鏈的管理機制建立、企業發展綠色產品之未來規劃、引入數位及無紙化的學習方式、企業置入綠色採購及綠色行銷之整體預估效益說明等。", "row": 98}, {"id": "中高級-098", "level": "中高級", "question": "下列何者是第一個將綠色採購納入正式法令的國家？", "options": ["美國", "臺灣", "日本", "德國"], "answer": 1, "explanation": "我國自民國81年透過行政院正式公告實施環保標章制度，並開始相關之推廣活動。民國87年我國將綠色採購的觀念納入法規，進而成為世界首例將綠色採購納入正式法令的國家。", "row": 99}, {"id": "中高級-099", "level": "中高級", "question": "現在有許多省水標章的兩段式省水馬桶，假設1瓶礦泉水容量為1公升，請問上述馬桶在小號時，普級沖水量須在幾瓶礦泉水以下？", "options": ["1瓶礦泉水", "3瓶礦泉水", "6瓶礦泉水", "12瓶礦泉水"], "answer": 1, "explanation": "依照經濟部水利署省水標章產品規範，兩段式省水馬桶依每次沖水量分為金級及普級。金級大號須在4.8公升以下，小號須在3公升以下；普級大號須在6公升以下，小號須在3公升以下。", "row": 100}, {"id": "高級-001", "level": "高級", "question": "《不願面對的真相》一書中講述有關全球暖化之議題，該書作者是誰？", "options": ["歐巴馬", "柯林頓", "陳文茜", "高爾"], "answer": 3, "explanation": "《不願面對的真相》記錄了美國前副總統高爾巡迴世界各地的全球暖化演講，他以時而風趣、時而嚴肅的態度，用最簡單易懂的概念，讓人瞭解「全球暖化」及其可能帶來的毀滅性後果。", "row": 2}, {"id": "高級-002", "level": "高級", "question": "《巴賽爾公約》主要管制哪一類污染物？", "options": ["一般廢棄物", "工業廢水", "酸雨", "有害事業廢棄物"], "answer": 3, "explanation": "國際間為減少有害事業廢棄物的產生，並避免跨國運送時造成環境污染，乃設定《巴塞爾公約》。", "row": 3}, {"id": "高級-003", "level": "高級", "question": "《京都議定書》在1997年日本京都會議時簽訂，明確訂定各國溫室氣體減量責任與時程。但是在各國各有其考量下，到了哪一年2月才生效？", "options": ["1998年", "2000年", "2002年", "2005年"], "answer": 3, "explanation": "1997年在日本京都，各國簽署具有法律約束力的《京都協議書》(KyotoProtocol)，明確訂定各國溫室氣體減量責任與時程。不過，在各國各有其考量下，《京都協議書》遲至2005年2月才生效。", "row": 4}, {"id": "高級-004", "level": "高級", "question": "下列何者屬於《京都議定書》所管制的溫室氣體？", "options": ["二氧化硫", "氟硼酸", "甲烷", "一氧化氮"], "answer": 2, "explanation": "常見的溫室氣體：二氧化碳、甲烷、氧化亞氮、氫氟碳化物類、全氟碳化物。京都議定書除了針對上述五種溫室氣體管制外，還增加六氟化硫(SF6)的管制。\n", "row": 5}, {"id": "高級-005", "level": "高級", "question": "《京都議定書》規定開發國家到哪一年平均二氧化碳排放量需比1990年減少5.2%？", "options": ["1995年", "2010年", "2012年", "2030年"], "answer": 2, "explanation": "《京都議定書》規定，到2012年，所有發達國家排放的二氧化碳等6種溫室氣體的數量，要比1990年減少5.2％。", "row": 6}, {"id": "高級-006", "level": "高級", "question": "《京都議定書》規範各個國家可以透過購買下列哪一項權益，而達到全球暖化減輕目標？", "options": ["二氧化碳排放權", "一氧化碳排放權", "最佳可行技術", "空氣污染防治設備"], "answer": 0, "explanation": "1997年在京都議定書架構下，為了促進各國完成溫室氣體減排目標，議定書允許兩個發達國家之間可以進行排放額度買賣的“排放權交易”，即難以完成削減任務的國家，可以花錢從超額完成任務的國家買進超出的額度。\n", "row": 7}, {"id": "高級-007", "level": "高級", "question": "《京都議定書》管制之溫室氣體包含下列哪個選項？", "options": ["氧化亞氮(N2O)", "亞硝酸(HNO2)", "六氟化鈾(UF6)", "二丁基硫醚(C8H18S)"], "answer": 0, "explanation": "其管制之溫室氣體為二氧化碳、甲烷、氧化亞氮、全氟化物、氫氟碳化物及六氟化硫等六種。為使國內產業及早因應氣候變遷及溫室氣體管制帶來的影響，我國早已輔導產業進行溫室氣體盤查與登錄等基礎工作，並導入ISO14064國際溫室氣體管理系統，協助產業建置溫室氣體管理能力，以循序漸進方式減緩未來可能面臨之衝擊。", "row": 8}, {"id": "高級-008", "level": "高級", "question": "2010年上海世博會，30萬名志工身穿採用綠能纖維（FLYCOOL®&Sorona®交織）的制服，試問此布料具有什麼特性，下列何者「錯誤」？", "options": ["具涼感可節省電費、減少排碳量", "綠色纖維產品可以不需作回收", "纖維原料不需依賴傳統石化原料", "能產生澱粉的作物可做為纖維"], "answer": 1, "explanation": "在世博的產品是以FLYCOOL®&Sorona®交織的布料，採用冷轉移印花技術，經由紡拓會設計中心的設計，並經測試證明涼爽效果。其中冷轉印的訴求是節能、省水、無毒及減少廢水排放。纖維原料並不限於玉米，只要是能產生澱粉的原料均可，如大麥、高粱。37%原料來自天然可再生資源，減少對石化原料的依賴。", "row": 9}, {"id": "高級-009", "level": "高級", "question": "一度水相當於多少公升的水？", "options": ["1公升", "10公升", "100公升", "1,000公升"], "answer": 3, "explanation": "一度水=1公噸；一公噸=1立方公尺；一立方公尺=1,000公升。", "row": 10}, {"id": "高級-010", "level": "高級", "question": "一座能讓植物自由生長並能讓蚯蚓或小昆蟲在地下生存，還能讓雨水順利滲透到地底下儲存的停車場，符合下列哪一項建築指標？", "options": ["生物多樣性指標", "基地保水指標", "綠化量指標", "二氧化碳減量指標"], "answer": 1, "explanation": "基地的保水性能是指建築基地內自然土層及人工土層涵養水分及貯留雨水的能力。基地的保水性能愈佳，基地涵養雨水的能力愈好，有益於土壤內微生物的活動，進而改善土壤之活性，維護建築基地內之自然生態環境平衡。", "row": 11}, {"id": "高級-011", "level": "高級", "question": "下列何者「不是」全球暖化所帶來的影響？", "options": ["夏季溫度上升", "降雨量減少", "日照量增加", "氣候穩定度低"], "answer": 2, "explanation": "因全球暖化導致夏季變得更加炎熱，屢屢創新高，降雨次數減少，但仍有暴雨的情形，因此總降雨量並沒有太大差異。而日射量受太陽與雲層的影響，與暖化無關。", "row": 12}, {"id": "高級-012", "level": "高級", "question": "下列何者「不是」全球暖化對臺灣民眾的影響？", "options": ["暴雨強度增加", "下雨天數增加", "農作物產量可有效提升", "颱風強度減少"], "answer": 2, "explanation": "因全球暖化造成氣候異常，當季農作物及動植物紛紛死亡或是生長不良，使農產量減少。", "row": 13}, {"id": "高級-013", "level": "高級", "question": "下列何者是再生利用的行為？", "options": ["花瓶打破後埋入土中", "酒瓶清洗後再使用", "玻璃瓶磨粉後混入行道磚", "小孩隨地大小便，以增加地表肥力"], "answer": 2, "explanation": "(1)回收再利用：指再生資源再使用或再生利用之行為。(2)再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。(3)再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。", "row": 14}, {"id": "高級-014", "level": "高級", "question": "下列何者「不是」綠色消費的效益？", "options": ["增加自然資源的無限開採與使用", "提昇資源的永續利用", "減少有害物質的使用", "減少污染物的產生與排放"], "answer": 0, "explanation": "應減少自然資源的無限開採與過度使用。", "row": 15}, {"id": "高級-015", "level": "高級", "question": "下列何者「不是」綠色採購的原則？", "options": ["收集產品及供應商的環境資訊", "採購時應考產品生命週期對環境的衝擊", "選擇照顧環境的供應商", "採購前應考慮該產品價格"], "answer": 3, "explanation": "綠色採購的原則有四點，分別如下：(1)採購前考慮是不是真的需要；(2)了解產品從原料取得到產品使用後廢棄的生命週期對環境影響；(3)選擇對環境友善的供應商；(4)收集產品及供應商的環境資訊 。\n", "row": 16}, {"id": "高級-016", "level": "高級", "question": "下列何者「不是」綠建築的主要特徵？", "options": ["高隱私", "省資源", "低污染", "省能源"], "answer": 0, "explanation": "綠建築的特徵包括：省能源、省資源、低污染、舒適、健康、環保等。其居住環境應符合「舒適性」、「自然調和健康」、「環保」等三大設計理念。綠建築由過去「消耗最少地球資源，製造最少廢棄物的建築物」的消極定義，擴大為「生態、節能、減廢、健康的建築物」的積極定義。", "row": 17}, {"id": "高級-017", "level": "高級", "question": "下列何者「不屬於」再生能源？", "options": ["海洋能", "燃煤", "生質能", "地熱能"], "answer": 1, "explanation": "依據再生能源發展條例規定，再生能源指太陽能、生質能、地熱能、海洋能、風力、非抽蓄式水力、國內一般廢棄物與一般事業廢棄物等直接利用或經處理所產生之能源，或其它經中央主管機關認定可永續利用之能源。燃煤屬於化石能源，非再生能源。", "row": 18}, {"id": "高級-018", "level": "高級", "question": "下列何者屬於碳交易的機制？", "options": ["繳交空污費", "清潔發展機制", "明智利用", "有效管理"], "answer": 1, "explanation": "為達到《聯合國氣候變化框架公約》全球溫室氣體減量的最終目的，其法律架構約定了三種排減機制：清潔發展機制(CDM)、聯合履行(JI)、排放交易(ET)。", "row": 19}, {"id": "高級-019", "level": "高級", "question": "下列何者是正確的綠色行銷策略？", "options": ["提供正確環保觀念與知識", "不引導過度消費", "提供綠色商品相關資訊", "以上皆是"], "answer": 3, "explanation": "綠色行銷策略包括：提供正確環保觀念與知識、不引導過度消費、提供綠色商品相關資訊。", "row": 20}, {"id": "高級-020", "level": "高級", "question": "下列何者是交通省油好方法？", "options": ["降低胎壓", "行車維持安全距離，避免緊急煞車", "停紅燈時，持續催油門", "購買馬力大的汽車"], "answer": 1, "explanation": "保持汽車標準胎壓，以及行車維持安全距離，避免緊急煞車，若紅燈時不要持續催油門，上述均是省油減碳的好方法。\n", "row": 21}, {"id": "高級-021", "level": "高級", "question": "下列何者是使用生質柴油的優點？", "options": ["加油站設置專用設備即可提供加油", "修改引擎即可使用生質柴油", "對溫室氣體減量有幫助", "閃火點較柴油低"], "answer": 2, "explanation": "使用生質柴油的優點：(1)環保、安全、不需要修改引擎。(2)再生性能源，可被生物分解。(3)具環境友善性，減少引擎廢氣污染物排放，特別是溫室效應氣體。(4)根據國外使用經驗，使用生質柴油B20以下，不需要對車輛引擎做任何修改。(5)生質柴油的閃火點較化石柴油高，運送與儲存的安全性較高。(6)加油站不需要新增任何設施。", "row": 22}, {"id": "高級-022", "level": "高級", "question": "下列何者是使用電動車帶來的直接正面影響？", "options": ["大眾運輸蓬勃發展", "增加汽油銷售", "電動機車使用無鉛汽油，可減少污染", "減少空氣污染"], "answer": 3, "explanation": "電動機車因為沒有引擎，故不用加汽油，所以在行駛中幾乎是零污染，對環境來說更是零負擔。政府鼓勵大眾使用無污染交通工具，空氣品質也可以永保清新。\n", "row": 23}, {"id": "高級-023", "level": "高級", "question": "下列何者是家中減碳的好方法？", "options": ["電冰箱要塞滿食物，避免浪費空間", "冷氣維持23℃", "米飯烹煮時可先浸泡30分鐘", "使用白熾燈"], "answer": 2, "explanation": "電冰箱若塞滿食物，會影響維持低溫的效果，導致壓縮機必須持續運轉；使用冷氣時，請將室內溫度維持在26~28度，可減少電力浪費，白熾燈泡比省電燈泡多耗能約80%，米飯泡過再煮，可以減少電鍋煮的時間。\n", "row": 24}, {"id": "高級-024", "level": "高級", "question": "下列何者是針對熱島效應正確的描述？", "options": ["郊區溫度上升", "能見度提升", "降雨量增加", "空氣污染物不易擴散"], "answer": 3, "explanation": "造成異常溫度上升主要是，來自於大樓和柏油的太陽光的蓄熱，城市內部林立的大樓中的空調設備被排出的熱空氣，樹木的減少所產生的城市被熱空氣籠罩，同時污染物容易蓄積。", "row": 25}, {"id": "高級-025", "level": "高級", "question": "下列何者為碳中和的標準？", "options": ["PAS 2060", "PAS 1060", "ISO 14050", "ISO 12050"], "answer": 0, "explanation": "由英國標準協會制定的PAS 2060宣告碳中和(carbon netural)，是獨立且被國際公認的標準，它保證碳中和承諾的準確性、可證性和一致性。", "row": 26}, {"id": "高級-026", "level": "高級", "question": "下列何者為綠建築評估指標？", "options": ["綠化量指標", "二氧化碳減量指標", "生物多樣性", "以上皆是"], "answer": 3, "explanation": "綠建築九大評估指標包括：日常節約能源、綠化量指標、二氧化碳減量指標、基地保水、廢棄物減量、水資源指標、污水垃圾改善指標、生物多樣性與室內環境指標。", "row": 27}, {"id": "高級-027", "level": "高級", "question": "下列何者為臺灣綠建築評估系統？", "options": ["EEWH", "BREEAM", "LEED", "CASBEE"], "answer": 0, "explanation": "EEWH為臺灣綠建築評估系統，包含「生態、節能、減廢、健康」四大指標群之意，BREEAM為全球第一部綠建築評估系統，由英國建築研究所提出，LEED為美國綠建築協會提出的能源暨環境先導設計，CASBEE為日本建築物綜合環境性能評估系統。", "row": 28}, {"id": "高級-028", "level": "高級", "question": "下列哪一個是「氣候變化綱要公約」所管制的氣體？", "options": ["一氧化氮", "二氧化碳", "溴（ㄒㄧㄡˋ）化銀", "乙烷"], "answer": 1, "explanation": "1992 年6 月於地球高峰會議由153 國共同簽署「氣候變化綱要公約」，包括5 項共同遵守原則及10 項共同承諾，旨在管制二氧化碳、甲烷、氟氯碳化物、氧化亞氮等溫室效應氣體的排放，以減緩地球的溫暖化。", "row": 29}, {"id": "高級-029", "level": "高級", "question": "下列哪一種溫室氣體吸收大氣熱能的能力最強？", "options": ["二氧化碳", "甲烷", "六氟化硫", "氧氣"], "answer": 2, "explanation": "每一溫室氣體攫住大氣中熱氣的能力均不同，以二氧化碳作為基準，則六氟化硫的能力最強，其次是甲烷，二氧化碳最弱，但因二氧化碳含量較多，對全球暖化的影響也是最大。", "row": 30}, {"id": "高級-030", "level": "高級", "question": "下列哪句成語有節約用水的意涵？", "options": ["水深火熱", "近水惜水", "巴山蜀水", "愛才若渴"], "answer": 1, "explanation": "近水惜水：雖靠近水源，用水方便，但也很珍惜水，比喻即便容易得到的東西也不能浪費。", "row": 31}, {"id": "高級-031", "level": "高級", "question": "下列哪個選項是水庫必定具備的功能？", "options": ["發電", "防洪", "給水", "遊憩"], "answer": 2, "explanation": "水庫多數為了公共給水及灌溉、防洪，少部分專作發電，有些還兼有觀光遊憩的功能。", "row": 32}, {"id": "高級-032", "level": "高級", "question": "日常耗能以空調與照明用電佔最大比例，尤其以空調耗能影響為最。在臺灣，夏日的建築空調耗電佔總尖峰用量的多少？", "options": ["二分之一", "三分之一", "四分之一", "五分之一"], "answer": 1, "explanation": "夏日的建築空調耗電佔總尖峰用量的三分之一。", "row": 33}, {"id": "高級-033", "level": "高級", "question": "以下何者為「電器類環保標章規格標準」之環境訴求？", "options": ["省電", "塑膠件不得檢出鉛", "塑膠件不得檢出溴化阻燃劑", "以上皆是"], "answer": 3, "explanation": "推動環保標章之環境效益－電器類包括：(1)省電、(2)不得檢出鎘、鉛、六價鉻及汞金屬、(3)不得檢出溴化阻燃劑：多溴聯苯類PBBs、多溴聯苯醚類PBDEs、10-13個碳原子之含氯鏈狀烴類化合物(ChloroParaffins)且氯含量重量比超過50%(含)以上者、(4)其他：省水、環保冷媒。", "row": 34}, {"id": "高級-034", "level": "高級", "question": "以前化石能源十分充足時，人類都不太注意亂度所形成的能源。以下哪一項動力的發明是有效利用分散殘餘的能量？", "options": ["電梯發電", "油電混合動力", "腳踏車的頭燈", "以上皆是"], "answer": 3, "explanation": "很多動力，如電梯下降從位能產生動能的同時，為了維持穩定的速度，必須加以控制其速度，造成能量的損失，若能導入發電，則可以做為其他弱電的供電。汽車在高速時，引擎的動力是多餘的，若能使用電力則可以大幅省電。", "row": 35}, {"id": "高級-035", "level": "高級", "question": "目前世界上的碳交易所「不包括」下列哪一個國家？", "options": ["英國", "加拿大", "美國", "澳洲"], "answer": 1, "explanation": "目前世界上的碳交易所共有五個：歐盟的歐盟排放權交易制(EUETS)、英國的英國排放權交易制(ETG)、美國的芝加哥氣候交易所(CCX)、澳洲的澳洲氣候交易所(ACX)、中國的天津排放權交易所(TCX)。", "row": 36}, {"id": "高級-036", "level": "高級", "question": "目前臺灣以哪一種發電方式供應最多的發電量？", "options": ["風力發電", "水力發電", "火力發電", "太陽能發電"], "answer": 2, "explanation": "臺灣各種發電方式所供應的發電量如下：水力發電3.6%；風力發電0.6%；火力發電69.7%(最多)；核能發電21.2%；地熱發電0%；生質能發電0%；太陽能板發電0%；潮汐的漲落發電0%；汽電共生4.9%。", "row": 37}, {"id": "高級-037", "level": "高級", "question": "全球生質燃料中，以下何者所佔的比例較多？", "options": ["氣態燃料", "生質酒精", "固態衍生燃料", "液態煉解油"], "answer": 1, "explanation": "全球目前生質燃料(Biofuel)產業發展情況而言，以生質酒精與生質柴油等液態生質燃料為主要，被廣泛應用作為交通運輸用燃油。", "row": 38}, {"id": "高級-038", "level": "高級", "question": "全球約有多少比例的人「沒有」乾淨的飲水可用？", "options": ["二分之一", "四分之一", "六分之一", "八分之一"], "answer": 2, "explanation": "全球年平均雨量是834公釐，臺灣年平均雨量高達2,500公釐左右，算是雨量豐沛的國家。最近聯合國的一份報告指出全球有十億的人沒有乾淨的飲水。臺灣的用水量大多集中於農業灌溉及養殖用水，兩者占總用水量比例達77.1%，無情的啃噬，臺灣可用的水源不但會逐年減少，水質維護工作也將會愈發困難。", "row": 39}, {"id": "高級-039", "level": "高級", "question": "全球氣候變遷與溫室效應的影響日益明顯，減緩與調適為各國政府因應氣候變遷威脅的兩大重要策略。「減緩」指的是何種策略？", "options": ["減低民眾對於溫室效應和全球暖化議題的迷思，認真面對問題", "以人類的科技結合自然的覆育，提高溫室氣體的排放", "讓環境經由自然方式覆育，並減低溫室效應", "以人為干預的方式，減少溫室氣體排放量"], "answer": 3, "explanation": "「減緩」(mitigation)係指以人為干預的方式，減少溫室氣體排放量；或者增加溫室氣體儲存量。", "row": 40}, {"id": "高級-040", "level": "高級", "question": "全球暖化「不會」造成下列哪個選項的問題？", "options": ["海平面上升", "異常氣候", "環流系統改變", "北極冰原增加"], "answer": 3, "explanation": "因全球溫度上升導致各地發生異常現象，如海洋異常增暖、冰河融解、海平面上升、極區海冰厚度減少後退以及北半球雪蓋面積減少。這些現象的發生，證明了全球暖化確實正在進行，並也預告其將對環境生態產生嚴重的衝擊。", "row": 41}, {"id": "高級-041", "level": "高級", "question": "全球暖化可能造成天然災害頻率與規模增加，以下何者為地球暖化減緩之自然調節機制？", "options": ["極地融冰", "火山活動增加", "風化作用加劇", "永凍土溫度上升至冰點以上"], "answer": 2, "explanation": "極地融冰會減少太陽能量反射、火山活動增加與永凍土解凍均將導致溫室氣體增加；風化作用加劇可減少溫室氣體。", "row": 42}, {"id": "高級-042", "level": "高級", "question": "再生紙漿相較原生紙漿的製作過程，除了減少樹木砍伐，還有什麼好處？下列何者正確？", "options": ["消耗較少的能源", "減少空氣污染、水污染", "減少大量的固體廢棄物", "以上皆是"], "answer": 3, "explanation": "再生紙漿的製作過程，除了減少砍樹，並較製作原生紙漿消耗較少的能源，減少約75%的空氣污染、35%的水污染及減少大量的固體廢棄物。", "row": 43}, {"id": "高級-043", "level": "高級", "question": "在多種民生用品中(如電視)，都有使用到多溴聯苯醚以做為產品內的阻燃劑，下列關於多溴聯苯醚的敘述何者「錯誤」？", "options": ["廣泛用於火焰抑制劑", "於水中溶解度很高", "具生物累積性", "毒性與多氯聯苯相仿"], "answer": 1, "explanation": "多溴聯苯醚(PBDEs)共有209種異構物，因其具有高沸點、高脂溶性、低水溶性、阻燃性佳等特性，所以常被用來做為電子用品、石化產品、塑膠，家具建材等易燃物品的阻燃劑。", "row": 44}, {"id": "高級-044", "level": "高級", "question": "在亞洲地區，人均碳排放最高的是下列哪個國家？", "options": ["中國", "臺灣", "日本", "南韓"], "answer": 1, "explanation": "臺灣平均二氧化碳排放量以11.26噸，排名全世界第18，在亞洲地區則居第一，其次為居全球第25名的南韓、26名的日本", "row": 45}, {"id": "高級-045", "level": "高級", "question": "在建築二氧化碳減量上，下列何者為「錯誤」的敘述？", "options": ["儘量使用荷重較輕的鋼結構，避免使用磚石及鋼筋混凝土結構", "採寒帶林木為材料的原木結構、木地板等材料，可儲存大量大氣中的CO2", "鋼筋混凝土產生的二氧化碳小於鋼結構", "鋼筋混凝土的耗能量大於鋼結構"], "answer": 2, "explanation": "就環保的觀點，一磚一瓦，或是鐵和玻璃，排放大量的二氧化碳．都是高污染與高溫化，都是能源的產物。鋼筋混凝土的耗能量是鋼結構的1.2倍，產生的二氧化碳是鋼結構的1.4倍。", "row": 46}, {"id": "高級-046", "level": "高級", "question": "在建築基地之一隅，保留枯木、樹根、亂石堆、岩洞等「多孔隙環境」之設計，符合下列哪一項綠建築指標？", "options": ["綠化量指標", "生物多樣性指標", "基地保水指標", "二氧化碳減量指標"], "answer": 1, "explanation": "維持生物多樣性的基本原則之一就是要建立多孔隙的環境。綠化的地方，其土壤必須保持多孔隙才能容納水分和空氣，小生物才能生存；地表須有枯枝、落葉、石頭、坑洞、小水池等等不同的棲息環境，以供不同種類的生物棲息。", "row": 47}, {"id": "高級-047", "level": "高級", "question": "在產生相同能量下，重型柴油引擎使用生質柴油與化石柴油對環境的效益，下列何者正確？", "options": ["二氧化碳僅有化石柴油的15~40%", "懸浮微粒排放僅下降1%", "一氧化碳排放量略微增加", "生質柴油含大量硫，會產生致癌風險物質"], "answer": 0, "explanation": "(1)依美國環保署對重型柴油引擎完整的研究，結果懸浮微粒、一氧化碳與碳氫化合物的排放都大幅下降，最高可達40%以上，而一氧化氮NOx略微上升。(2)生質柴油中硫與芳香族，遠低於化石柴油，對有致癌風險之污染物排放，有降50%以上的效果。(3)最顯著的效益在：產生相同能量其二氧化碳僅有化石原料的15~40%。\n", "row": 48}, {"id": "高級-048", "level": "高級", "question": "在臺灣的哪一個地方可以發現珊瑚礁，其生存的原因為何？", "options": ["墾丁，因為海水溫暖", "花蓮，因為海水有深海溝", "基隆，因為河川污染", "臺中港，因為是沙質海岸"], "answer": 0, "explanation": "墾丁位於臺灣的南部，北回歸線以下，故屬於熱帶型氣候，因此珊瑚礁喜歡(適應)於海水溫暖的環境。", "row": 49}, {"id": "高級-049", "level": "高級", "question": "如果陽明山地區要進行能源開發，最適合者為何？", "options": ["太陽能", "風力能", "生質能", "地熱能"], "answer": 3, "explanation": "陽明山國家公園是臺灣唯一以火山地質為保護主題的國家公園，為臺灣地熱能最富集之地區，其地下水水溫度最高達293℃(馬槽地熱區)，地面噴氣孔溫度最高為120℃(大油坑地熱區)，從新北投到金山之間長達18公里的狹長地帶，就有20幾個溫泉區與噴氣孔。", "row": 50}, {"id": "高級-050", "level": "高級", "question": "如果溫室效應太嚴重造成格陵蘭島冰原全部融化，可能「不會」有下列哪個現象發生？", "options": ["全球平均海水鹽度增加", "全球陸地面積減少", "海平面上升", "溫鹽環流停止"], "answer": 0, "explanation": "因溫室效應導致氣候變遷，使格陵蘭島與南極的大冰原持續融化，造成海平面上升，將引發大災難。若是南極西部整個冰原完全融化，將會在2100年前使全球海平面平均上升6公尺，影響住在離海岸兩百哩內的三十二億多的人口，占世界人口的半數，影響甚鉅。全球平均海水鹽度因為被冰稀釋而降低。", "row": 51}, {"id": "高級-051", "level": "高級", "question": "有關能源的敘述，下列哪個選項是正確的？", "options": ["氫氧燃料電池的發電原理與傳統的水力發電相同，兩者在其發電過程中均不污染環境", "太陽能電池是利用光能產生電流，理論上會消耗物質", "核能是指核分裂或核融合時所產生的能量，並遵守質量不滅定律", "潮汐發電、波浪發電、洋流發電、海洋溫差發電等均屬於海洋能源"], "answer": 3, "explanation": "氫氧燃料電池發電原理為化學能轉換成電能，而傳統的水力發電原理為力學能轉換成電能；太陽能電池是利用光能產生電流，理論上不會消耗物質；核能是指核分裂或核融合時所產生的能量，遵守質能互換。", "row": 52}, {"id": "高級-052", "level": "高級", "question": "將廢污泥產生的沼氣再應用，是屬於下列何者能源？", "options": ["太陽能", "生質能", "核能", "地熱"], "answer": 1, "explanation": "生質能就是利用生質作物經轉換所獲得的電與熱等可用的能源。生質作物則泛指由生物產生的有機物質，例如木材與林業廢棄物如木屑等；農作物與農業廢棄物如稻殼、蔗渣等；畜牧業廢棄物如動物屍體；廢水處理所產生的沼氣；都市垃圾與垃圾掩埋場與下水道污泥處理廠所產生的沼氣；工業有機廢棄物如有機污泥、廢塑橡膠、廢紙等。", "row": 53}, {"id": "高級-053", "level": "高級", "question": "我們在挑選冷氣時應該重視下列何種指標對環境才是友善的？", "options": ["HP值", "EER值", "A值", "COD值"], "answer": 1, "explanation": "EER(Energy Efficiency Ratio)為能源效率比值EER=冷氣能力/消耗功率，EER越高代表冷氣能力越強且消耗功率越低，就是只需花費一點電力就可以達到冷卻環境效果，其他選項並不是選擇冷氣應看的指標。", "row": 54}, {"id": "高級-054", "level": "高級", "question": "我國建築相關產業之二氧化碳排放比例，約佔全國總排放量28.8%，下列哪一項耗能最大？", "options": ["建材生產", "營建運輸", "住宅使用", "商業使用"], "answer": 2, "explanation": "成大建研所指出，建築耗能排放的二氧化碳佔全國總排放量的28.8%，其中建材為9.31%，營建運輸為1.49%，住宅使用為11.88%，商業使用為5.94%。", "row": 55}, {"id": "高級-055", "level": "高級", "question": "依照永續能源政策網領，臺灣於2025年的二氧化碳排放應回到哪一年的水準？", "options": ["2000年", "1995年", "2005年", "2010年"], "answer": 0, "explanation": "永續能源政策應將有限資源作有效率的使用，開發對環境友善的潔淨能源。全國二氧化碳排放減量，於2016年至2020年間回到2008年排放量，於2025年回到2000年排放量。", "row": 56}, {"id": "高級-056", "level": "高級", "question": "依據2012年「國家氣候變遷調適政策綱領」所述，以下哪一項「不是」在「維生基礎設施」領域的調適策略中，積極研發之新技術？", "options": ["耐洪、耐澇", "耐旱、耐強風", "耐震", "耐海嘯、耐火災"], "answer": 3, "explanation": "根據綱領指出，研發基礎設施之氣候變遷調適新技術，主要有兩大重點：(1)積極研發新技術，以建設耐洪、耐澇、耐旱、耐強風、耐震之基礎設施。(2)應投資人力與經費於國外新技術之交流與移轉，及國內各研發單位技術之彙整。", "row": 57}, {"id": "高級-057", "level": "高級", "question": "清淨家園顧厝邊綠色生活網中「去污保育」主要的概念為何？", "options": ["建立低碳社會", "降低污染保護生態", "去污保育護生態", "即時通報與清理"], "answer": 2, "explanation": "去污保育護生態，呼籲一同擴散環境巡守的一份力量，即可同時減少一分破壞環境的力量。\n", "row": 58}, {"id": "高級-058", "level": "高級", "question": "清淨家園顧厝邊綠色生活網中「節能減碳」主要的推動項目為何？", "options": ["建立低碳社會", "推動綠色設計", "去污保育護生態", "即時通報與清理"], "answer": 0, "explanation": "綠網之節能減碳平臺主要是希望民眾能節能減碳酷地球，響應節能減碳新主張，一起採行節能減碳無悔措施，建構低碳及循環型社會。\n", "row": 59}, {"id": "高級-059", "level": "高級", "question": "清淨家園顧厝邊綠色生活網中「資源循環」主要的工作為何？", "options": ["建立低碳社會", "推動資源再利用", "去污保育護生態", "即時通報與清理"], "answer": 1, "explanation": "資源循環希望達到資源循環零廢棄，推動前端綠色設計，後端資源再利用，創造資源循環與低污染排放的環境。", "row": 60}, {"id": "高級-060", "level": "高級", "question": "清淨家園顧厝邊綠色生活網中「整潔美化」主要的工作為何？", "options": ["建立低碳社會", "推動綠色設計", "去污保育護生態", "即時通報與清理髒亂的環境"], "answer": 3, "explanation": "整潔美化的主要工作為：清淨家園樂活化，環境要乾淨全民要參與，推動全民監督、即時通報與清理環境髒亂。", "row": 61}, {"id": "高級-061", "level": "高級", "question": "對於日常節能行為的敘述，下列何者是「錯誤」的？", "options": ["多吹自然風，關閉空調冷氣", "使用通過節能標章產品", "無人使用的空間應該關閉燈光", "避免使用太陽能板產生電力，以免浪費資源"], "answer": 3, "explanation": "使用太陽能板可產生電力資源。", "row": 62}, {"id": "高級-062", "level": "高級", "question": "臺灣海邊有時會看到白色像風車一樣的機器是下列哪種設施？", "options": ["風力發電機", "水車", "核能發電機", "火力發電機"], "answer": 0, "explanation": "臺灣的風力發電能量密度含量居全球排名第二(第一是紐西蘭)，特別為桃園-雲林沿海一帶，由於有強勁的夏季西南氣流與冬季東北季風吹襲，且可建置地點亦不少，因此成為臺灣發展風力發電之最佳地點。目前，臺灣有經營風力發電廠的公司除國營的臺灣電力公司外，民營亦有德商英華威等公司。", "row": 63}, {"id": "高級-063", "level": "高級", "question": "熱帶雨林的破壞會造成何種環境問題，下列哪個選項正確？", "options": ["溫室效應", "氣候變遷", "生物瀕絕", "以上皆是"], "answer": 3, "explanation": "熱帶雨林消失後所造成的影響有(1)氣候變遷、(2)溫室效應、(3)水土流失、(4)海平面上升、(5)藥品原料消失、(6)生物瀕臨絕種。", "row": 64}, {"id": "高級-064", "level": "高級", "question": "熱帶雨林消失將對環境帶來什麼影響？(A)氣候異常(B)全球溫度上升(C)水土流失(D)再生能源增加。", "options": ["AB", "BCD", "ABC", "BD"], "answer": 2, "explanation": "熱帶雨林消失後所造成的影響包括氣候變遷、溫室效應、水土流失、海平面上升、藥品原料消失、生物瀕臨絕種等情形。", "row": 65}, {"id": "高級-065", "level": "高級", "question": "調查顯示：「1971-1999年，美國東部櫻花開花日期提前7天；1959-1999年，歐洲秋季樹葉變色的日期延遲4.8天；1954-1981年，中國雲南西南部山區的霧日減少75天。」下列何者最適合用來解釋引文所述的現象？", "options": ["氣候變遷", "生態平衡", "山岳效應", "推拉理論"], "answer": 0, "explanation": "文中三種現象均與氣候變遷有關。推拉理論則是有關於人口移動現象。", "row": 66}, {"id": "高級-066", "level": "高級", "question": "目前全球最廣泛使用的再生能源為生質能。它是使用何種方式轉換成為可使用的能源？", "options": ["位能轉換", "動能轉換", "太陽能轉換", "熱轉換或生物轉換"], "answer": 3, "explanation": "生質能是指利用生質物（泛指所有的有機物質），經轉換所獲得之可用能源，如電與熱，約占世界所有再生能源利用的78%。其轉換方式包含物理轉換、熱轉換及生物轉換三大類", "row": 67}, {"id": "高級-067", "level": "高級", "question": "下列哪一種太陽能熱水器在國內市場佔有率約為90%？", "options": ["儲置式太陽能熱水器", "真空管式太陽能熱水器", "面蓋式平板太陽能熱水器", "無面蓋式太陽能熱水器"], "answer": 2, "explanation": "國內一般民眾普遍對於面蓋式平板式太陽能熱水器接受度較高，依安裝件數計，此類型太陽能熱水器目前在國內市場佔有率約為90%；真空管式太陽能熱水器產品及相關製造供應廠商相對較少。", "row": 68}, {"id": "高級-068", "level": "高級", "question": "原健康綠建材標章，經參考國內外相關基準及研究成果後，改名為以下何者？", "options": ["低逸散健康綠建材標章", "環保建材標章", "生態性建材標章", "再生綠建材標章"], "answer": 0, "explanation": "本標章原名稱為「健康綠建材標章」，性能評定基準係參考先進國家之相關綠建材標章，搭配內政部建築研究所長期成果，以臺灣本土室內氣候條件為考量，訂定建材逸散之「總揮發性有機化合物（TVOC）」及「甲醛（Formaldehyde）」逸散速率基準，其TVOC基準以BTEX（苯、甲苯、乙苯、二甲苯）等指標性污染物累加計算，並透過名稱修訂為「低逸散健康綠建材標章」。", "row": 69}, {"id": "高級-069", "level": "高級", "question": "植物透過光合作用吸收二氧化碳，並固定在植物與土壤當中的行為是以下何者？", "options": ["碳中和", "碳匯現象", "碳足跡", "碳控制"], "answer": 1, "explanation": "植物透過光合作用吸收二氧化碳，並固定在植物與土壤當中的行為稱之為碳匯現象。", "row": 70}];

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{document.getElementById('storage-warning').textContent='瀏覽器無法儲存紀錄；請在關閉前到學習統計匯出備份。'}}
function record(q,a){const r=state.records[q.id]||{attempts:0,correct:0,lastCorrect:false};r.attempts++;r.correct+=Number(a===q.answer);r.lastCorrect=a===q.answer;state.records[q.id]=r;}
const wrong=()=>QUESTIONS.filter(q=>state.records[q.id]?.lastCorrect===false);
function totals(){let attempts=0,correct=0;Object.values(state.records).forEach(r=>{attempts+=r.attempts;correct+=r.correct});return {seen:Object.keys(state.records).length,attempts,correct,rate:attempts?Math.round(correct/attempts*100):0}}
const percent=(a,b)=>b?Math.round(a/b*100):0;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const levelSelect=()=>`<label>題庫級別<select id="level"><option>全部</option>${LEVELS.map(l=>`<option ${filterLevel===l?'selected':''}>${l}</option>`).join('')}</select></label>`;
const heading=(title,sub)=>`<h1>${title}</h1><p class="muted">${sub}</p>`;
const btn=(text,action,cls='')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
const countLevel=l=>QUESTIONS.filter(q=>q.level===l);
function navigate(p){if(session&&session.mode==='exam'&&!session.finished&&!confirm('模擬賽尚未交卷。離開將放棄本次作答，確定離開？'))return;clearInterval(timer);session=null;page=p;listPage=0;render();}
function render(){nav.innerHTML=[['home','訓練儀表板'],['learn','分級學習'],['practice','題庫練習'],['random','隨機練習'],['wrong','錯題重練'],['exam','模擬競賽'],['stats','學習統計']].map(([p,n])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${n}</button>`).join('');if(session){renderQuestion();return}({home:home,learn:list,practice:list,random:setup,wrong:wrongPage,exam:setup,stats:stats}[page]||home)();}
function home(){const t=totals();app.innerHTML=heading('今天，從一題開始。','選擇適合的級別，累積你的環境知識。')+`<div class="grid stats"><div class="card"><span class="muted">已練習題目</span><div class="metric">${t.seen}<small> / 408</small></div><progress value="${t.seen}" max="408" aria-label="已練習題目進度"></progress></div><div class="card"><span class="muted">累計正確率</span><div class="metric">${t.attempts?t.rate+'%':'—'}</div><span class="small muted">已提交 ${t.attempts} 次作答</span></div><div class="card"><span class="muted">待重練錯題</span><div class="metric">${wrong().length}<small> 題</small></div><button data-page="wrong">前往重練</button></div><div class="card"><span class="muted">模擬賽最佳成績</span><div class="metric">${state.exams.length?Math.max(...state.exams.map(e=>percent(e.correct,e.total))):'—'}<small> 分</small></div><span class="small muted">已完成 ${state.exams.length} 場</span></div></div><div class="grid two"><section class="card banner"><div class="eyebrow">DAILY PRACTICE</div><h2 style="margin-top:12px">用 10 題，啟動今天的訓練</h2><p class="muted">從全題庫隨機抽題，作答後立即查看<br>正確答案與原始解析。</p><div class="actions">${btn('開始隨機 10 題','quick','primary')}<button data-page="practice">依序練習</button></div></section><section class="card"><div class="eyebrow">NEXT STEP</div><h2 style="margin-top:12px">${wrong().length?'把錯題變成拿手題':'準備好挑戰計時練習？'}</h2><p class="muted">${wrong().length?'重練最近一次答錯的題目；答對後，自動移出待重練清單。':'自訂題數與時間，交卷後一次檢討答案，掌握自己的答題節奏。'}</p><button data-page="${wrong().length?'wrong':'exam'}">${wrong().length?'重練 '+wrong().length+' 道錯題':'設定模擬競賽'}</button></section></div><div class="row" style="margin-top:28px"><h2>能源篇 · 分級訓練</h2><button data-page="learn">查看全部教材</button></div><div class="grid levels">${LEVELS.map((l,i)=>{const qs=countLevel(l),n=qs.filter(q=>state.records[q.id]).length;return `<section class="card"><div class="levelnum">LEVEL 0${i+1}</div><div class="row"><h2>${l}</h2><span class="muted">${qs.length} 題</span></div><progress value="${n}" max="${qs.length}" aria-label="${l}已練習進度"></progress><div class="row"><span class="small muted">已練習 ${n} / ${qs.length}</span><button data-study="${l}">進入學習</button></div></section>`}).join('')}</div>`+sourceNote();}
function sourceNote(){return '<div class="notice">教材來源：112 年北北基環境知識競賽題庫（能源篇）。依原檔四個級別編排，答案與解析均保留原文；涉及年份、政策及數據的內容以原題庫為準，未更新為現行資料。</div>'}
function filtered(){return QUESTIONS.filter(q=>(filterLevel==='全部'||q.level===filterLevel)&&(!search||(q.question+' '+q.options.join(' ')+' '+q.id).includes(search)))}
function list(){const learn=page==='learn',qs=filtered(),size=12;listPage=Math.min(listPage,Math.max(0,Math.ceil(qs.length/size)-1));app.innerHTML=heading(learn?'分級學習':'題庫練習',learn?'依原題庫級別閱讀題目，展開答案與解析，再進入練習。':'依序練習完整題庫，也可以選擇級別或搜尋題目。')+`<div class="filters">${levelSelect()}<label>搜尋題目與選項<input type="search" id="search" value="${esc(search)}" placeholder="例如：節能、溫室效應"></label>${btn('套用篩選','filter')}${btn('練習篩選結果','filtered','primary')}</div><div class="row"><p class="muted">共 ${qs.length} 題 · ${filterLevel==='全部'?'全部級別':filterLevel}</p><span class="small muted">第 ${listPage+1} / ${Math.max(1,Math.ceil(qs.length/size))} 頁</span></div><div class="list">${qs.slice(listPage*size,(listPage+1)*size).map(q=>`<article class="card"><div class="row"><span class="pill">${q.level} · ${q.id.split('-')[1]}</span><span class="small muted">${!state.records[q.id]?'尚未練習':state.records[q.id].lastCorrect?'最近答對':'待重練'}</span></div><h3 style="margin-top:14px;white-space:pre-wrap">${esc(q.question)}</h3>${learn?`<ol class="study-options">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><details><summary>查看原始答案與解析</summary><p class="answerline">答案：${q.answer+1}．${esc(q.options[q.answer])}</p><p style="white-space:pre-wrap">${esc(q.explanation||'原題庫未提供解析。')}</p></details>`:''}<div class="actions"><button data-single="${q.id}">練習這一題</button></div></article>`).join('')||'<div class="card empty">找不到符合條件的題目，請調整篩選。</div>'}</div><div class="actions"><button data-action="prevlist" ${listPage===0?'disabled':''}>上一頁</button><button data-action="nextlist" ${(listPage+1)*size>=qs.length?'disabled':''}>下一頁</button></div>`+(learn?sourceNote():'');}
function setup(){const exam=page==='exam';app.innerHTML=heading(exam?'模擬競賽':'隨機練習',exam?'調整訓練長度，專心完成一場挑戰。':'不重複抽題，每題作答後立即檢討。')+`<section class="card"><h2>${exam?'設定這次挑戰':'設定練習範圍'}</h2><div class="filters">${levelSelect()}<label>題數<select id="amount"><option value="10">10 題</option><option value="20" ${exam?'selected':''}>20 題</option><option value="30">30 題</option><option value="50">50 題</option></select></label>${exam?'<label>時間限制<select id="minutes"><option value="5">5 分鐘</option><option value="10" selected>10 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option></select></label>':''}</div><div class="notice">${exam?'原型自訂練習規則，非正式競賽賽制。每題等權重，未答計錯；交卷前可以修改作答，答案與解析於交卷後顯示。時間到自動交卷。':'題目只會在本次練習出現一次。提交後顯示原始答案與解析，已提交的作答會存入學習紀錄。'}</div>${btn(exam?'開始計時競賽':'開始隨機練習','startsetup','primary')}</section>`;}
function wrongPage(){const qs=wrong();app.innerHTML=heading('錯題重練',`目前有 ${qs.length} 題待重練。答對後會自動移出清單。`)+(qs.length?`<div class="actions">${btn('開始重練全部錯題','wrongstart','primary')}</div><div class="list" style="margin-top:24px">${qs.map(q=>`<div class="card"><span class="pill">${q.id}</span><p>${esc(q.question)}</p><button data-single="${q.id}">重練這一題</button></div>`).join('')}</div>`:'<div class="card empty"><h2>目前沒有待重練的錯題</h2><p class="muted">練習中答錯的題目會出現在這裡。</p><button data-page="random" class="primary">開始隨機練習</button></div>');}
function start(qs,mode='practice',minutes=0){if(!qs.length){alert('目前沒有可練習的題目。');return}session={qs:[...qs],mode,index:0,answers:{},submitted:{},finished:false,deadline:mode==='exam'?Date.now()+minutes*60000:null};render();if(mode==='exam'){clearInterval(timer);timer=setInterval(tick,250);tick()}}
function renderQuestion(){if(session.finished){results();return}const s=session,q=s.qs[s.index],answer=s.answers[q.id],done=!!s.submitted[q.id],exam=s.mode==='exam';app.innerHTML=heading(exam?'模擬競賽進行中':'專注練習',exam?'選擇答案後自動保留，可在交卷前修改。':'先選擇一個答案，再提交查看解析。')+`<div class="row"><span>${exam?'已作答':'已提交'} ${Object.keys(exam?s.answers:s.submitted).length} / ${s.qs.length} 題</span><span>${exam?'<span id="timer" class="timer" role="timer"></span>':'第 '+(s.index+1)+' 題'}</span></div><progress value="${Object.keys(exam?s.answers:s.submitted).length}" max="${s.qs.length}" aria-label="本次作答進度"></progress><div class="question-layout"><section class="card"><div class="row"><span class="pill">${q.level} · ${q.id}</span><span class="small muted">原工作表第 ${q.row} 列</span></div><div class="qtitle">${esc(q.question)}</div><div class="options" role="group" aria-label="選擇答案">${q.options.map((o,i)=>`<button class="option ${answer===i?'selected':''} ${done&&i===q.answer?'correct':''} ${done&&answer===i&&i!==q.answer?'wrong':''}" data-answer="${i}" aria-pressed="${answer===i}" ${done?'disabled':''}><b>${i+1}</b><span>${esc(o)}${done&&i===q.answer?' ✓ 正確答案':''}${done&&answer===i&&i!==q.answer?' ✕ 你的答案':''}</span></button>`).join('')}</div>${done?`<div class="feedback ${answer===q.answer?'':'bad'}" role="status"><strong>${answer===q.answer?'答對了！':'再記住一次，下次更有把握。'} 正確答案：${q.answer+1}</strong><span class="small">原題庫解析</span><div>${esc(q.explanation||'原題庫未提供解析。')}</div></div>`:''}<div class="actions"><button data-action="prevq" ${s.index===0?'disabled':''}>上一題</button>${!exam&&!done?`<button data-action="submit" class="primary" ${answer===undefined?'disabled':''}>提交答案</button>`:''}${s.index<s.qs.length-1?btn('下一題','nextq',done?'primary':''):''}${!exam?btn('結束並看結果','finish'):''}</div></section><section class="card"><h3>答題進度</h3><p class="small muted">${exam?'綠底代表已選答案。':'綠底代表已提交。'}<br>點擊題號切換題目。</p><div class="numbers">${s.qs.map((x,i)=>`<button aria-label="第 ${i+1} 題" class="${(exam?s.answers[x.id]!==undefined:s.submitted[x.id])?'done':''} ${s.index===i?'current':''}" data-index="${i}">${i+1}</button>`).join('')}</div>${exam?`<div class="actions">${btn('交卷並查看成績','finish','primary')}</div>`:''}</section></div>`;if(exam)tick();}
function tick(){if(!session||session.finished||session.mode!=='exam')return;const remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));const el=document.getElementById('timer');if(el)el.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining===0)finish(true)}
function finish(auto=false){const s=session;if(!s||s.finished)return;const n=Object.keys(s.mode==='exam'?s.answers:s.submitted).length;if(!auto&&n<s.qs.length&&!confirm(`尚有 ${s.qs.length-n} 題${s.mode==='exam'?'未作答，交卷後計錯':'未提交，不納入本次練習成績'}。確定結束？`))return;clearInterval(timer);if(s.mode==='exam'){s.qs.forEach(q=>record(q,s.answers[q.id]));const correct=s.qs.filter(q=>s.answers[q.id]===q.answer).length;state.exams.unshift({date:new Date().toISOString(),correct,total:s.qs.length});save()}s.finished=true;s.auto=auto;results();}
function results(){const s=session,exam=s.mode==='exam',graded=s.qs.filter(q=>exam||s.submitted[q.id]),correct=graded.filter(q=>s.answers[q.id]===q.answer).length;app.innerHTML=heading(exam?'競賽完成，看看你的成果':'練習完成',s.auto?'時間到，系統已自動交卷。':'把這次的檢討，變成下次的進步。')+`<section class="card"><div class="row"><div><div class="eyebrow">${exam?'本次競賽分數':'本次練習正確率'}</div><div class="score">${graded.length?percent(correct,graded.length):'—'}<span style="font-size:20px">${exam?' 分':'%'}</span></div></div><div><strong>答對 ${correct} / ${graded.length} 題</strong><p class="muted">${exam?'未答 '+s.qs.filter(q=>s.answers[q.id]===undefined).length+' 題（計錯）':'未提交 '+(s.qs.length-graded.length)+' 題（不計分）'}</p></div></div><div class="actions">${btn('重練本次錯題','retry','primary')}<button data-page="home">回到儀表板</button><button data-page="stats">查看學習統計</button></div></section><h2 style="margin-top:26px">逐題檢討</h2><section class="card">${graded.map(q=>`<article class="result-item"><span class="pill">${q.id} · ${s.answers[q.id]===q.answer?'答對':s.answers[q.id]===undefined?'未答':'答錯'}</span><p><strong>${esc(q.question)}</strong></p><p>你的答案：${s.answers[q.id]===undefined?'未作答':(s.answers[q.id]+1)+'．'+esc(q.options[s.answers[q.id]])}</p><p class="answerline">正確答案：${q.answer+1}．${esc(q.options[q.answer])}</p><details><summary>查看原題庫解析</summary><p>${esc(q.explanation||'原題庫未提供解析。')}</p></details></article>`).join('')||'<p>本次尚未提交任何作答。</p>'}</section>`;}
function stats(){const t=totals();app.innerHTML=heading('學習統計','紀錄儲存在這台裝置的目前瀏覽器，隨時掌握練習狀態。')+`<div class="grid stats"><div class="card">題庫完成率<div class="metric">${percent(t.seen,408)}%</div><span class="small">${t.seen} / 408 題</span></div><div class="card">累計作答<div class="metric">${t.attempts}<small> 次</small></div></div><div class="card">累計答對<div class="metric">${t.correct}<small> 次</small></div></div><div class="card">累計正確率<div class="metric">${t.attempts?t.rate+'%':'—'}</div></div></div><section class="card"><h2>各級別進度</h2><div class="table-wrap"><table><thead><tr><th>級別</th><th>已練習 / 題數</th><th>完成率</th><th>累計正確率</th><th>待重練</th></tr></thead><tbody>${LEVELS.map(l=>{const qs=countLevel(l),rs=qs.map(q=>state.records[q.id]).filter(Boolean),a=rs.reduce((n,r)=>n+r.attempts,0),c=rs.reduce((n,r)=>n+r.correct,0);return `<tr><td>${l}</td><td>${rs.length} / ${qs.length}</td><td>${percent(rs.length,qs.length)}%</td><td>${a?percent(c,a)+'%':'—'}</td><td>${rs.filter(r=>!r.lastCorrect).length}</td></tr>`}).join('')}</tbody></table></div></section><section class="card" style="margin-top:20px"><h2>模擬競賽紀錄</h2>${state.exams.length?`<div class="table-wrap"><table><thead><tr><th>完成時間</th><th>答對 / 題數</th><th>分數</th></tr></thead><tbody>${state.exams.map(e=>`<tr><td>${esc(new Date(e.date).toLocaleString('zh-TW'))}</td><td>${e.correct} / ${e.total}</td><td>${percent(e.correct,e.total)} 分</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">還沒有完成的模擬賽。</p>'}</section><div class="notice">完成率以「至少提交一次」的不同題數計算；正確率以所有提交次數計算。錯題清單保留最近一次答錯的題目。模擬賽於交卷時統一計入，未答計錯。</div><section class="card"><h2>紀錄備份</h2><p class="muted">更換瀏覽器或移動網站檔案前，先匯出備份。匯入會取代目前的學習紀錄。</p><div class="actions">${btn('匯出紀錄','export')}<label>匯入備份<input id="import" type="file" accept="application/json,.json"></label>${btn('清除學習紀錄','reset')}</div><p id="import-status" role="status"></p></section>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.study){filterLevel=b.dataset.study;search='';navigate('learn');return}if(b.dataset.single){start([BY_ID[b.dataset.single]]);return}if(b.dataset.answer!==undefined){if(!session||session.finished)return;if(session.mode==='exam'&&Date.now()>=session.deadline){tick();return}const q=session.qs[session.index];if(session.submitted[q.id])return;session.answers[q.id]=Number(b.dataset.answer);renderQuestion();return}if(b.dataset.index!==undefined){session.index=Number(b.dataset.index);renderQuestion();return}const a=b.dataset.action;if(a==='quick'){start(shuffle(QUESTIONS).slice(0,10));return}if(a==='filter'){filterLevel=document.getElementById('level').value;search=document.getElementById('search').value.trim();listPage=0;list()}if(a==='filtered'){filterLevel=document.getElementById('level').value;search=document.getElementById('search').value.trim();start(filtered())}if(a==='prevlist'){listPage--;list()}if(a==='nextlist'){listPage++;list()}if(a==='wrongstart')start(shuffle(wrong()));if(a==='startsetup'){filterLevel=document.getElementById('level').value;const qs=QUESTIONS.filter(q=>filterLevel==='全部'||q.level===filterLevel);start(shuffle(qs).slice(0,Number(document.getElementById('amount').value)),page==='exam'?'exam':'practice',Number(document.getElementById('minutes')?.value||0))}if(a==='prevq'){session.index--;renderQuestion()}if(a==='nextq'){session.index++;renderQuestion()}if(a==='submit'){const q=session.qs[session.index];if(session.answers[q.id]===undefined||session.submitted[q.id])return;session.submitted[q.id]=true;record(q,session.answers[q.id]);save();renderQuestion()}if(a==='finish')finish();if(a==='retry'){const s=session;start(s.qs.filter(q=>(s.mode==='exam'||s.submitted[q.id])&&s.answers[q.id]!==q.answer))}if(a==='reset'&&confirm('確定清除所有答題與模擬賽紀錄？建議先匯出備份。')){state=emptyState();save();stats()}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='能源篇學習紀錄.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('change',async e=>{if(e.target.id!=='import'||!e.target.files[0])return;const status=document.getElementById('import-status');try{if(e.target.files[0].size>5000000)throw Error();const parsed=JSON.parse(await e.target.files[0].text());if(!validState(parsed))throw Error();if(!confirm('將以備份取代目前紀錄，確定匯入？'))return;state=parsed;save();stats();document.getElementById('import-status').textContent='匯入成功。'}catch{status.textContent='無法匯入：請選擇由本網站匯出的有效紀錄檔。'}});
